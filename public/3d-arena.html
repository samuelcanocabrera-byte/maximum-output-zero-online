<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MAXIMUM OUTPUT: ZERO | 3D ARENA</title>
<style>
  :root{--bg:#05070f;--ink:#eaf6ff;--blue:#59bcff}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    overflow:hidden}
  #stage{position:fixed;inset:0}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  #bar{position:fixed;left:14px;bottom:14px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;
    background:#060d1cf0;border:1px solid #3c6a8c;border-radius:8px;padding:8px 10px;
    font:900 10px/1 Inter,system-ui,sans-serif;letter-spacing:1px;color:#9fd8f2;z-index:10}
  #bar b{color:#6fd4ff;letter-spacing:1.6px}
  #bar button{font:900 10px/1 Inter,system-ui,sans-serif;letter-spacing:1px;color:#cfeaff;
    background:#122539;border:1px solid #3f6685;border-radius:5px;padding:6px 9px;cursor:pointer}
  #bar button:hover{background:#1c3a54;border-color:#8ddfff}
  #bar button.on{background:#1d4b64;border-color:#8ddfff;color:#eafaff}
  #bar i{color:#6d8ba3;font-style:normal;font-weight:700}
  #bar.hidden{display:none}
  #bar.onpause{z-index:60}
  #sel[data-page="online"] .selwrap{width:min(780px,94%)}
  .netform{display:grid;gap:7px;margin:14px 0 10px}
  .netform label{font:900 8px/1 Inter,system-ui,sans-serif;letter-spacing:1.8px;color:#7fb3cf}
  .netform input{background:#0a1526;border:1px solid #35506e;border-radius:6px;color:#eaf7ff;
    padding:11px 12px;font:900 13px/1 Inter,system-ui,sans-serif;letter-spacing:1.2px;outline:none}
  .netform input:focus{border-color:#7de0ff;box-shadow:0 0 18px #40b7ff33}
  .netcode{font:1000 clamp(30px,5vw,52px)/1 Inter,system-ui,sans-serif;letter-spacing:9px;
    color:#a8edff;text-shadow:0 0 26px #40bdff80;margin:12px 0 10px}
  .netrows{display:grid;gap:6px;margin:12px 0}
  .netrow{display:grid;grid-template-columns:32px 1fr auto auto;gap:9px;align-items:center;
    background:#0a1526;border:1px solid #2f4763;border-radius:7px;padding:11px 12px;
    font:900 11px/1 Inter,system-ui,sans-serif;color:#cfe8ff}
  .netrow.me{border-color:#7de0ff;background:#12283dd9}
  .netrow b{color:#7fb3cf;font-size:9px;letter-spacing:1.5px}
  .netrow em{font-style:normal;color:#9db4ce;font-size:10px}
  .netrow i{font-style:normal;color:#8ea7c0;font-size:9px;letter-spacing:1px}
  .netrow i.ok{color:#8dffc9}
  .neterr{margin:10px 0;border:1px solid #7a3245;background:#2a0f18;color:#ffb3c6;
    padding:10px 12px;border-radius:6px;font:800 10px/1.5 Inter,system-ui,sans-serif}
  #tip{position:fixed;right:14px;bottom:124px;max-width:320px;text-align:right;color:#7f9cb4;
    font:700 10px/1.6 Inter,system-ui,sans-serif;letter-spacing:.6px;z-index:10}
  @media(max-width:820px){#tip{display:none}}

  /* ---------- select overlay (same visual language as the 2D game) ---------- */
  #sel{position:fixed;inset:0;z-index:20;overflow:auto;padding:3vh 18px;
    background:linear-gradient(112deg,#050a16d9,#07101fd6 55%,#050811e6);
    display:flex;align-items:center;justify-content:center}
  #sel.hidden{display:none}
  .selwrap{width:min(1180px,100%)}
  .eyebrow{color:#6fd4fa;font-size:10px;letter-spacing:3.6px;font-weight:900}
  .selhead{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .selhead h2{font-size:clamp(26px,4.2vw,54px);line-height:1;letter-spacing:-2.4px;font-style:italic;
    margin:8px 0 6px;font-weight:1000;text-shadow:0 4px 23px #12335f}
  .selhead h2 span{color:#7adbff}
  .selhead p{margin:0;font-size:11.5px;line-height:1.6;color:#a9bdd4;max-width:600px}
  .selmode{display:inline-flex;background:#0d1729c9;border:1px solid #35496a;border-radius:8px;padding:4px}
  .selmode button{padding:9px 15px;border:0;border-radius:5px;background:transparent;color:#96aac4;
    font:900 10px/1 Inter,system-ui,sans-serif;letter-spacing:1px;cursor:pointer}
  .selmode button.on{background:#4ea7e9;color:#081422;box-shadow:0 3px 16px #3c9be755}
  .selgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin:16px 0 14px}
  .fcard{position:relative;text-align:left;padding:13px 13px 12px;border-radius:9px;cursor:pointer;
    border:1px solid #33445f;background:linear-gradient(135deg,#16223ac9,#0a1324d9);overflow:hidden;
    transition:transform .15s,border-color .15s,box-shadow .15s}
  .fcard:hover{transform:translateY(-3px);border-color:var(--accent)}
  .fcard.picked{border-color:#8ddcff;box-shadow:0 0 0 1px #5dd1ffb2,0 0 24px #5bbcff28}
  .fcard.picked:after{content:'P'attr(data-slot);position:absolute;right:8px;top:7px;background:#0a2344d9;
    color:#a7eaff;border:1px solid #477294;border-radius:3px;padding:3px 6px;font:900 8px/1 Inter,sans-serif;
    letter-spacing:1px}
  .fcard .swatch{height:3px;width:38px;background:var(--accent);border-radius:2px;box-shadow:0 0 14px var(--accent)}
  .fcard h3{margin:6px 0 0;font-size:17px;line-height:1.15;letter-spacing:-.35px;font-weight:1000;
    color:#f2fbff;text-shadow:0 2px 14px #02060f}
  .fcard small{display:block;margin-top:11px;color:var(--accent);font-size:8px;letter-spacing:1.7px;font-weight:900}
  .fcard .pill{display:inline-block;margin-top:8px;margin-right:4px;font-size:8px;letter-spacing:1.2px;color:#bdcae1;
    border:1px solid #40506a;border-radius:12px;padding:3px 7px}
  .fcard .pill.grade{color:#93aec6;border-color:#31445c}
  .fcard p{margin:7px 0 0;font-size:9.5px;line-height:1.5;color:#9fb2c9;min-height:42px}
  .selslots{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:13px}
  .slot{display:flex;align-items:center;gap:7px;background:#080f1fe0;border:1px solid #33455f;
    border-radius:7px;padding:8px 9px;cursor:pointer}
  .slot.focus{border-color:#7de0ff;background:#15283fd9;box-shadow:0 0 18px #4ba3fd22}
  .slot b{font:900 8px/1 Inter,sans-serif;letter-spacing:1.6px;color:#7fb3cf}
  .slot span{flex:1;text-align:center;font:900 12.5px/1.2 Inter,sans-serif;letter-spacing:0;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#eaf7ff}
  .slot.off{opacity:.32;pointer-events:none}
  .slot .arrow{padding:5px 8px;border:1px solid #3d5273;background:#16253c;border-radius:4px;
    color:#cfeaff;font:900 10px/1 Inter,sans-serif;cursor:pointer}
  .selfoot{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
    border-top:1px solid #2b425f;padding-top:13px}
  .selnote{font-size:10px;line-height:1.6;color:#8ea7c0;max-width:480px}
  .selnote b{color:#d6ecff}
  .selactions{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
  .start{border:0;display:inline-flex;align-items:center;justify-content:center;gap:12px;
    font:1000 12px/1 Inter,system-ui,sans-serif;letter-spacing:1.7px;
    background:linear-gradient(95deg,#68d2ff,#428bdf);color:#061021;border-radius:6px;padding:14px 24px;
    box-shadow:0 8px 30px #268ee544;cursor:pointer}
  .start:hover{filter:brightness(1.12)}
  .hbtn{background:#101c32d9;border:1px solid #486786;color:#cfe8ff;padding:12px 15px;border-radius:5px;
    font:900 10px/1 Inter,system-ui,sans-serif;letter-spacing:1px;cursor:pointer}
  .hbtn:hover{border-color:#91dcff;background:#1a324e}

  /* stage cards reuse the exact 2D scene art */
  .arenagrid{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin:16px 0}
  .acard{position:relative;background:#0b1529d9;text-align:left;padding:0 0 12px;border:2px solid #344b66;
    border-radius:8px;overflow:hidden;cursor:pointer;transition:transform .15s,border-color .15s}
  .acard:hover{transform:translateY(-4px);border-color:#8cd7ff}
  .acard.picked{border-color:#89e9ff;background:#122b47d9;box-shadow:0 0 26px #63d4ff33}
  .acard.picked:after{content:'SELECTED';position:absolute;z-index:2;top:8px;right:8px;background:#8ddfff;
    color:#072035;font:1000 8px/1 Inter,sans-serif;letter-spacing:.6px;padding:4px 7px;border-radius:2px}
  .acard small,.acard strong,.acard em{display:block;margin:9px 10px 0}
  .acard small{font-size:8px;color:#82bedb;letter-spacing:1px;font-style:normal;font-weight:900}
  .acard strong{font-size:14px;font-style:italic;letter-spacing:-.3px;font-weight:1000}
  .acard em{font-size:8px;color:#9db4ce;letter-spacing:.3px;font-style:normal;font-weight:700}
  .arena-scene{display:block;aspect-ratio:1.6;position:relative;overflow:hidden}
  .city-scene{background:linear-gradient(#241c38 12%,#754d5b 62%,#1a2638)}
  .city-scene:before{content:"";position:absolute;inset:24% 0 0;background:repeating-linear-gradient(90deg,#171c30 0 15px,#283047 15px 18px,transparent 18px 37px,#182033 37px 58px);clip-path:polygon(0 35%,12% 21%,20% 43%,31% 12%,40% 27%,50% 5%,63% 35%,70% 10%,79% 28%,91% 1%,100% 20%,100% 100%,0 100%)}
  .city-scene:after{content:"";position:absolute;width:45px;height:45px;right:15%;top:13%;background:#f6a277;border-radius:50%;box-shadow:0 0 30px #ffa77d}
  .shrine-scene{background:linear-gradient(#132633,#355359 65%,#17282e)}
  .shrine-scene:before{content:"";position:absolute;left:25%;right:25%;top:23%;height:65%;border:12px solid #bd5144;border-top:18px solid #cb6f4b;border-bottom:0;box-shadow:inset 0 0 20px #241b28;transform:perspective(400px) rotateX(6deg)}
  .shrine-scene:after{content:"";position:absolute;top:13%;left:19%;right:19%;height:18px;background:#db8c65;transform:skew(-15deg);box-shadow:0 0 22px #c75b4f77}
  .roof-scene{background:linear-gradient(#111330,#20264f 65%,#10172a)}
  .roof-scene:before{content:"";position:absolute;width:60px;height:60px;right:16%;top:9%;border-radius:50%;background:#c5dffd;box-shadow:0 0 34px #a1bded}
  .roof-scene:after{content:"";position:absolute;inset:45% 0 0;background:repeating-linear-gradient(90deg,#142037 0 16px,#29385b 16px 22px,#131d39 22px 42px);clip-path:polygon(0 22%,11% 18%,11% 40%,23% 39%,23% 5%,34% 5%,34% 26%,52% 26%,52% 0,73% 0,73% 18%,100% 18%,100% 100%,0 100%)}
  .subway-scene{background:radial-gradient(ellipse at 50% 15%,#b3b2a0,#39465a 38%,#101b2b)}
  .subway-scene:before{content:"";position:absolute;inset:22% 14% 0;border:14px solid #35475a;border-bottom:0;border-radius:95px 95px 0 0;box-shadow:0 -15px 25px #738b9a}
  .subway-scene:after{content:"";position:absolute;inset:55% 0 0;background:repeating-linear-gradient(90deg,#1b293c 0 3px,transparent 3px 28px),linear-gradient(#222d3f,#101b29);transform:perspective(160px) rotateX(12deg)}

  /* ---------- menu shell, title, help ---------- */
  #sel{align-items:center;justify-content:flex-start;padding:3vh 18px;background:transparent}
  #sel:before{content:'';position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(100deg,#050a16f7 0 40%,#050a16e4 52%,#050a1633 64%,#050a1600 74%,#050a1644 88%,#050a16b8 100%)}
  #sel[data-page] .selwrap{position:relative;z-index:2}
  #sel[data-page="stage"]:before{background:linear-gradient(100deg,#050a16ee 0 42%,#050a16b8 62%,#050a1677 100%)}
  #sel[data-page="help"]:before{background:#050a16f6}
  #sel[data-page="pause"],#sel[data-page="result"]{justify-content:center}
  #sel[data-page="pause"]:before,#sel[data-page="result"]:before{background:linear-gradient(115deg,#040815f2,#071226f4)}
  #sel[data-page="title"] .selwrap{width:min(760px,68%)}
  #sel[data-page="roster"] .selwrap{width:min(860px,66%)}
  #sel[data-page="stage"] .selwrap{width:min(1080px,100%);
    background:linear-gradient(112deg,#050a16f2 0 62%,#050a1699)}
  #sel[data-page="help"] .selwrap{width:min(1140px,100%);background:#050a16f4;
    border:1px solid #2c4360;border-radius:14px;padding:18px 20px}
  #sel[data-page="pause"],#sel[data-page="result"]{justify-content:center;
    background:radial-gradient(ellipse 60% 70% at 50% 40%,#12253a99,transparent 70%),linear-gradient(115deg,#040815f2,#071226f4)}
  .selview{display:none}
  .titlepage h1{font-size:clamp(40px,6.4vw,86px);line-height:.92;letter-spacing:-3.6px;font-style:italic;
    font-weight:1000;margin:12px 0 6px;text-shadow:0 8px 30px #050b1c}
  .titlepage h1 em{color:#7be7ff;text-shadow:0 0 34px #58baff77}
  .lead{font-size:11.5px;line-height:1.7;color:#a9bdd4;max-width:620px;margin:10px 0 14px}
  .titlepage .selhead{align-items:center}
  .titlering{width:150px;height:150px;border:2px solid #7cdfff66;border-radius:50%;
    display:grid;place-items:center;flex:none;text-align:center;position:relative;
    box-shadow:0 0 60px #2e89cf3b,inset 0 0 50px #4085df33;animation:spin 34s linear infinite}
  .titlering:after{content:'';position:absolute;inset:19px;border:1px dashed #a3e5ff66;border-radius:50%}
  .titlering b{font-size:22px;letter-spacing:1px;color:#d9f7ff;line-height:1.15;font-weight:1000}
  .titlering small{display:block;font-size:7px;letter-spacing:2px;color:#71cef8;margin-top:7px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .chips{display:flex;gap:7px;flex-wrap:wrap;margin:4px 0 2px}
  .chips span{font:900 8px/1 Inter,sans-serif;letter-spacing:.8px;border:1px solid #3b5879;
    background:#071426c9;padding:7px 9px;border-radius:4px;color:#b9e7ff}
  .modecards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0 14px}
  .modecard{text-align:left;border:1px solid #33506d;border-radius:10px;padding:15px 16px;cursor:pointer;
    background:linear-gradient(120deg,#132238d9,#0a1425e6);transition:.16s}
  .modecard:hover{transform:translateY(-3px);border-color:#8ddfff;box-shadow:0 8px 26px #050b1c99}
  .modecard b{display:block;font:1000 12px/1.3 Inter,sans-serif;letter-spacing:1.1px;color:#e6f6ff}
  .modecard span{display:block;margin-top:6px;font-size:9.5px;line-height:1.5;color:#9db4ce}
  .fcard .ficon{position:absolute;right:11px;top:9px;font-size:19px;color:var(--accent);opacity:.55}
  .selgrid{grid-template-columns:repeat(3,1fr)}
  .fcard{padding-right:44px}
  .helpgrid{display:grid;grid-template-columns:1.05fr 1fr 1fr;gap:11px;margin-top:14px}
  .helppanel{border:1px solid #314563;border-radius:10px;background:#0c1728e8;padding:14px 15px;min-width:0}
  .helppanel h3{font:1000 11px/1 Inter,sans-serif;letter-spacing:1.6px;color:#8ee6ff;margin:0 0 10px}
  .helppanel p{font-size:10px;line-height:1.7;color:#a9bfd4;margin:0 0 8px}
  .helppanel p b{color:#e2f3ff}
  .helppanel ul{margin:4px 0 0;padding-left:15px;font-size:10px;line-height:1.8;color:#a9bfd4}
  .helppanel li b{color:#dcefff}
  .kvhead,.kv{display:grid;grid-template-columns:1fr .8fr .8fr .8fr;gap:6px;align-items:center}
  .kvhead{font:900 7.5px/1 Inter,sans-serif;letter-spacing:1.4px;color:#6f92ad;margin-bottom:6px}
  .kv{padding:4px 0;border-bottom:1px solid #1d2f45}
  .kv:last-child{border-bottom:0}
  .kv b{font:900 8.5px/1.3 Inter,sans-serif;letter-spacing:.7px;color:#c0daef}
  .kv span{font:800 8px/1.2 Inter,sans-serif;color:#8fb3cd;background:#101f33;border:1px solid #2c4560;
    border-radius:3px;padding:4px 5px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pausebox{width:min(680px,100%);margin:0 auto;border:1px solid #3d6383;border-radius:14px;padding:26px 28px;
    background:linear-gradient(120deg,#122238f7,#0a1526fa);box-shadow:0 30px 90px #000a}
  .pausebox h2{font-size:clamp(30px,5vw,52px);font-style:italic;letter-spacing:-2px;margin:8px 0 6px;font-weight:1000}
  .pausebox .selfoot{margin-top:18px}

  @media(max-width:1100px){
    #sel[data-page="help"] .selwrap{width:100%}
    .helpgrid{grid-template-columns:1fr 1fr}
  }
  @media(max-width:900px){
    #sel[data-page="title"] .selwrap,#sel[data-page="roster"] .selwrap,
    #sel[data-page="stage"] .selwrap{width:100%}
    #sel:before{background:#050a16f6}
    .modecards{grid-template-columns:1fr}
    .selgrid{grid-template-columns:repeat(2,1fr)}
    .arenagrid{grid-template-columns:repeat(2,1fr)}
    .selslots{grid-template-columns:1fr}
    .fcard p{min-height:0;display:none}
    .acard em{display:none}
    #sel{padding:12px 10px;align-items:flex-start}
  }
</style>
</head>
<body>
<div id="stage"><canvas id="game"></canvas></div>

<div id="bar" class="hidden">
  <b>3D ARENA</b>
  <button type="button" id="bMenu">☰ MENU</button>
  <button type="button" id="bFighters">◈ FIGHTERS</button>
  <button type="button" id="bStage">◈ STAGE</button>
  <button type="button" id="bMove">↺ REMATCH</button>
  <button type="button" id="bCam">CAMERA AUTO</button>
  <button type="button" id="bHelp">⌨ CONTROLS</button>
  <button type="button" id="bPause">Ⅱ PAUSE</button>
  <button type="button" id="b2d">← 2D BATTLE</button>
  <i>P1 WASD · F strike · G technique · H guard · Q cycle · E domain · R maximum · C RCT · SHIFT dash</i>
</div>
<div id="tip"></div>

<div id="sel">
  <div class="selwrap" id="selWrap"></div>
</div>

<script>
(function(){
'use strict';

/* ============================================================
   3D ARENA — genuine x/y/z Maximum Output.
   Own projection, own painter's-algorithm renderer, no deps.
   Character rigs, four battlefields, six Domain worlds.
   ============================================================ */

const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=canvas.clientWidth||window.innerWidth;
  H=canvas.clientHeight||window.innerHeight;
  canvas.width=Math.max(1,Math.round(W*DPR));
  canvas.height=Math.max(1,Math.round(H*DPR));
}
resize();
window.addEventListener('resize',resize);

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const TAU=Math.PI*2;
// declared up here because stage/domain geometry is baked before the
// world-state block runs, and several builders read the clock
let time=0;

/* ============================================================
   ROSTER — silhouettes and palettes taken from the character
   sheets: Jin's long embroidered coat and card case, Arata's
   open jacket and blue wristband, Shirogane's crystalline
   light, Hido's asymmetric charcoal coat, Kitsune's ponytail
   and coin, Arashi's wind-wrapped cursed spirit.
   ============================================================ */
const ROSTER=[
  {name:'Kisaragi Jin',epithet:'THE CONCEPTUAL GAMBLER',short:'JIN',grade:'SPECIAL GRADE SORCERER',tech:'ARCANA DECREE',
   coat:'#182134',panel:'#2b3549',trim:'#cfc49a',hair:'#161d30',accent:'#eac986',
   skin:'#e6c3a8',eyes:'#9fb6c9',model:'jin',scale:1.03,
   blurb:'Card suits become laws of reality. Polite, smiling, never gambling without an edge.',
   domain:{name:'FATED MISFORTUNE',sky:['#1b1206','#4a2f14','#0a0703'],
     floor:['#241708','#120b04'],grid:'#c9963a44',build:buildParlor}},
  {name:'Arata Michizane',epithet:'THE UNSTOPPABLE PURSUER',short:'ARATA',grade:'SPECIAL GRADE SORCERER',tech:'MOMENTUM',
   coat:'#1b3050',panel:'#26496f',trim:'#6fccff',hair:'#1d3d7a',accent:'#59bcff',
   skin:'#e2c0a4',eyes:'#66c8ff',model:'arata',scale:1.04,
   blurb:'Every dodge feeds his momentum. Keep moving forward, or lose the path entirely.',
   domain:{name:'ENDLESS HORIZON',sky:['#11212b','#314b57','#101a20'],
     floor:['#16241f','#0a1210'],grid:'#68b39b33',build:buildHorizon}},
  {name:'Shirogane Aizawa',epithet:'THE REFRACTED PHANTOM',short:'SHIROGANE',grade:'SPECIAL GRADE VENGEFUL SPIRIT',tech:'QUANTUM FLICKER',
   coat:'#242b46',panel:'#343d60',trim:'#c3cdf5',hair:'#f4f8ff',accent:'#b98cff',
   skin:'#e8eaf7',eyes:'#c9b6ff',model:'shirogane',scale:1.08,
   blurb:'Light, afterimages and stolen frames. Ten holograms, one true body.',
   domain:{name:'KALEIDOSCOPE OF TOTAL REFLECTION',sky:['#0b0d1c','#3d3263','#120d20'],

/* ============================================================
   RENDERER CORE
   ============================================================ */
const ARENA=1000;
const GRAVITY=-2350;
const SPLIT_DIST=980;

function makeCam(eye,target,fov){
  let fx=target.x-eye.x, fy=target.y-eye.y, fz=target.z-eye.z;
  const fl=Math.hypot(fx,fy,fz)||1; fx/=fl; fy/=fl; fz/=fl;
  let rx=-fz, ry=0, rz=fx;
  const rl=Math.hypot(rx,ry,rz)||1; rx/=rl; ry/=rl; rz/=rl;
  const ux=ry*fz-rz*fy, uy=rz*fx-rx*fz, uz=rx*fy-ry*fx;
  return {eye,fx,fy,fz,rx,ry,rz,ux,uy,uz,fov};
}
function project(cam,vp,x,y,z){
  const dx=x-cam.eye.x, dy=y-cam.eye.y, dz=z-cam.eye.z;
  const cz=dx*cam.fx+dy*cam.fy+dz*cam.fz;
  if(cz<12) return null;
  const cx=dx*cam.rx+dy*cam.ry+dz*cam.rz;
  const cy=dx*cam.ux+dy*cam.uy+dz*cam.uz;
  const s=vp.focal/cz;
  return {x:vp.cx+cx*s, y:vp.cy-cy*s, s, z:cz};
}
function shadeColor(hex,shade){
  const c=hex.replace('#','');
  let r=parseInt(c.slice(0,2),16),g=parseInt(c.slice(2,4),16),b=parseInt(c.slice(4,6),16);
  r=Math.round(clamp(r*shade,0,255));g=Math.round(clamp(g*shade,0,255));b=Math.round(clamp(b*shade,0,255));
  return 'rgb('+r+','+g+','+b+')';
}
// distance haze: every face dissolves toward the stage horizon colour, which
// separates near fighters from far architecture the way real depth of field does
let FOG_COL='#16202f';
function parseRGB(hex){
  let c=String(hex||'#000000').trim().replace('#','');
  if(c.length===3) c=c[0]+c[0]+c[1]+c[1]+c[2]+c[2];
  const n=v=>{const q=parseInt(v,16);return Number.isFinite(q)?clamp(q,0,255):128};
  if(c.length<6) return [128,128,128];
  return [n(c.slice(0,2)),n(c.slice(2,4)),n(c.slice(4,6))];
}

/* ---------- geometry collection ---------- */
let FACES=[];
let GLOWS=[];
let RAW=null;                    // when set, primitives are baked instead of drawn

function pushQuad(a,b,c,d,color,opt){
  if(RAW){ RAW.push({t:'q',a,b,c,d,color,opt}); return; }
  const e1x=b.x-a.x,e1y=b.y-a.y,e1z=b.z-a.z;
  const e2x=c.x-a.x,e2y=c.y-a.y,e2z=c.z-a.z;
  let nx=e1y*e2z-e1z*e2y, ny=e1z*e2x-e1x*e2z, nz=e1x*e2y-e1y*e2x;
  const nl=Math.hypot(nx,ny,nz)||1; nx/=nl;ny/=nl;nz/=nl;
  const mx=(a.x+b.x+c.x+d.x)/4, my=(a.y+b.y+c.y+d.y)/4, mz=(a.z+b.z+c.z+d.z)/4;
  const vx=mx-CAM.eye.x, vy=my-CAM.eye.y, vz=mz-CAM.eye.z;
  if(nx*vx+ny*vy+nz*vz>0) return;                        // facing away
  const flat=opt&&opt.flat;
  const L=nx*0.35+ny*0.82+nz*0.45;
  const shade=flat?1:clamp(0.66+0.56*Math.max(0,L),0.56,1.34);
  const rgb=parseRGB(color);
  FACES.push({a,b,c,d,depth:vx*vx+vy*vy+vz*vz,
    fr:rgb[0]*shade,fg:rgb[1]*shade,fb:rgb[2]*shade,
    color:flat?color:shadeColor(color,shade),
    alpha:(opt&&opt.alpha)||1});
}
// double-sided plane (cloth, banners, shards): exactly one winding survives
function pushPanel(a,b,c,d,color,opt){
  pushQuad(a,b,c,d,color,opt);
  pushQuad(d,c,b,a,color,opt);
}
function glow(x,y,z,color,size,alpha){
  if(RAW){ RAW.push({t:'g',x,y,z,color,size,alpha}); return; }
  GLOWS.push({x,y,z,color,size,alpha});
}
function boxRect(a,b,hw,hd,color,opt){
  const dx=b.x-a.x,dy=b.y-a.y,dz=b.z-a.z;
  const len=Math.hypot(dx,dy,dz)||1;
  const ux=dx/len,uy=dy/len,uz=dz/len;
  let rx=0,ry=1,rz=0;
  if(Math.abs(uy)>0.92){rx=1;ry=0;rz=0}
  let qx=uy*rz-uz*ry, qy=uz*rx-ux*rz, qz=ux*ry-uy*rx;
  let ql=Math.hypot(qx,qy,qz)||1; qx/=ql;qy/=ql;qz/=ql;
  const sx=uy*qz-uz*qy, sy=uz*qx-ux*qz, sz=ux*qy-uy*qx;
  const C=[];
  for(const e of [a,b]){
    C.push(
      {x:e.x+qx*hw+sx*hd,y:e.y+qy*hw+sy*hd,z:e.z+qz*hw+sz*hd},
      {x:e.x-qx*hw+sx*hd,y:e.y-qy*hw+sy*hd,z:e.z-qz*hw+sz*hd},
      {x:e.x-qx*hw-sx*hd,y:e.y-qy*hw-sy*hd,z:e.z-qz*hw-sz*hd},
      {x:e.x+qx*hw-sx*hd,y:e.y+qy*hw-sy*hd,z:e.z+qz*hw-sz*hd});
  }
  pushQuad(C[1],C[0],C[4],C[5],color,opt);
  pushQuad(C[0],C[3],C[7],C[4],color,opt);
  pushQuad(C[3],C[2],C[6],C[7],color,opt);
  pushQuad(C[2],C[1],C[5],C[6],color,opt);
  pushQuad(C[0],C[1],C[2],C[3],color,opt);
  pushQuad(C[7],C[6],C[5],C[4],color,opt);
}
function boxSeg(a,b,w,color,opt){ boxRect(a,b,w/2,w/2,color,opt); }

/* oriented axis-aligned box: single primitive for most architecture */
function obox(cx,y0,cz,w,h,d,yaw,color,opt){
  yaw=yaw||0;
  const c=Math.cos(yaw), s=Math.sin(yaw);
  const P=(lx,ly,lz)=>({x:cx+lx*c+lz*s, y:y0+ly, z:cz-lx*s+lz*c});
  const hw=w/2, hd=d/2;
  const C=[
    P(-hw,0,-hd),P(hw,0,-hd),P(hw,0,hd),P(-hw,0,hd),
    P(-hw,h,-hd),P(hw,h,-hd),P(hw,h,hd),P(-hw,h,hd)
  ];
  pushQuad(C[3],C[2],C[6],C[7],color,opt);   // +z
  pushQuad(C[0],C[1],C[5],C[4],color,opt);   // -z
  pushQuad(C[1],C[2],C[6],C[5],color,opt);   // +x
  pushQuad(C[0],C[3],C[7],C[4],color,opt);   // -x
  pushQuad(C[4],C[5],C[6],C[7],color,opt);   // top
  pushQuad(C[0],C[3],C[2],C[1],color,opt);   // bottom
}
function aabox(cx,y0,cz,w,h,d,color,opt){ obox(cx,y0,cz,w,h,d,0,color,opt); }

/* tapered prism / spire / crystal shard */
function spire(cx,y0,cz,r,h,color,opt,sides){
  sides=sides||6;
  const ap={x:cx,y:y0+h,z:cz};
  let prev=null;
  for(let i=0;i<=sides;i++){
    const a=(i/sides)*TAU;
    const p={x:cx+Math.cos(a)*r,y:y0,z:cz+Math.sin(a)*r};
    if(prev) pushPanel(prev,p,ap,ap,color,opt);
    prev=p;
  }
}

/* ============================================================
   FIGHTER RIGS
   Articulated box mannequin: hips, torso, shoulders, elbows,
   wrists, knees, ankles. Every fighter shares the skeleton and
   the coat/hair/weapon detail from their character sheet is
   layered on top, so silhouettes stay readable in a fight.
   ============================================================ */
function fighterParts(p,faceOverride){
  const S=p.cfg.scale||1;
  const face=faceOverride!==undefined?faceOverride:p.face;
  const cf=Math.cos(face), sf=Math.sin(face);
  const P=(lx,ly,lz)=>({x:p.x+lx*cf+lz*sf, y:p.y+ly*S, z:p.z-lx*sf+lz*cf});
  const speed=Math.hypot(p.vx,p.vz);
  const moving=speed>75&&p.y<2&&!p.ko;
  const swing=moving?Math.sin(p.phase):0;
  const bob=p.ko?0:(moving?Math.abs(Math.cos(p.phase))*3.4:Math.sin(time*1.9+p.i*1.5)*2.2);
  // Each attack kind has its own recovery time. Normalising every pose by the
  // jab's 0.34s meant longer casts sat at 0 for their first frames and then
  // snapped straight to the end pose — that was the deformed-looking swing.
  const atkDur=p.atkKind==='cast'?0.46:p.atkKind==='launch'?0.42:p.atkKind==='sweep'?0.38:0.34;
  const k=p.atkAnim>0?Math.sin(Math.PI*Math.pow(clamp(1-p.atkAnim/atkDur,0,1),0.7)):0;
  const air=p.y>2;

  // A real fighting stance instead of straight arms: knees soft, weight on
  // the back leg, both hands up in front of the chest. Every pose below
  // bends the same joints, so nothing pops between states.
  let hipY=88, lean=0;
  let tF=0.26, tB=-0.30, sF=0.20, sB=-0.16;
  let aF=0.55, aB=0.34, fF=2.30, fB=2.12;
  let twist=0, exF=0, exB=0, wxF=0, wxB=0;

  if(moving){ tF=0.26+swing*0.62; tB=-0.30-swing*0.60;
              sF=0.20+Math.max(0,-swing)*0.55; sB=-0.16+Math.max(0,swing)*0.5;
              aF=0.55-swing*0.18; aB=0.34+swing*0.20;
              fF=2.24+Math.abs(swing)*0.14; fB=2.04;
              lean=speed*0.00028; twist=swing*0.06; }
  if(air){ tF=0.80; tB=-0.42; sF=1.05; sB=0.55; aF=0.92; aB=0.55; fF=2.10; fB=1.92; lean=0.05; }
  if(p.guard){ hipY=84; tF=0.30; tB=-0.28; sF=0.46; sB=-0.42;
               aF=0.92; fF=2.42; aB=0.78; fB=2.30; lean=-0.03 }
  // reel backwards without hyper-extending the forearms through the torso
  if(p.stun>0){ aF=0.30; aB=0.52; fF=1.15; fB=1.55; lean=-0.12; hipY=86; tF=-0.06; tB=0.18; twist=-0.16 }
  if(p.atkKind==='jab'&&k>0){
    const hook=p.chain===2||p.chain===4?1:0, out=hook?1:0, upper=p.chain===3?1:0;
    aF=lerp(0.55,1.46,k)+out*0.12-upper*0.55;
    fF=lerp(2.30,1.62,k)+upper*0.5;
    exF=out*15*k; wxF=-out*20*k;
    aB=0.34*(1-k)-0.10*k-(upper?0.18*k:0); fB=2.12-0.5*k;
    lean=0.05*k+upper*0.06; twist=(0.12-out*0.26+upper*0.14)*k;
    hipY=88-upper*5*k;
  }
  if(p.atkKind==='launch'&&k>0){ aF=lerp(0.55,0.86,k); fF=lerp(2.30,2.5,k);
    aB=0.34*(1-k); fB=lerp(2.12,1.2,k); hipY=88-9*k; tF=0.26+0.2*k; lean=-0.05*k }
  if(p.atkKind==='sweep'&&k>0){ hipY=80-6*k; tF=0.26+1.15*k; sF=0.15; tB=-0.5; sB=-0.62;
    aF=0.7-0.30*k; aB=0.1; fF=2.0; fB=1.6; lean=0.10*k }
  if(p.atkKind==='cast'&&k>0){
    // casting pose: both hands drive the technique forward instead of
    // recycling the punch arc, so the body matches the effect
    const two=(p.castType==='avalanche'||p.castType==='tempest'||p.castType==='lash'||
               p.castType==='barrier'||p.castType==='vector');
    aF=lerp(0.55,two?1.62:1.46,k);
    fF=lerp(2.30,two?1.56:1.92,k);
    aB=lerp(0.34,two?1.28:0.92,k);
    fB=lerp(2.12,1.86,k);
    lean=0.055*k; twist=0.11*k; hipY=88-2*k;
  }
  if((p.ultPose||0)>0.01){
    const u=p.ultPose;
    aF=lerp(aF,1.74,u); aB=lerp(aB,1.58,u);
    fF=lerp(fF,2.04,u); fB=lerp(fB,1.96,u);
    hipY=lerp(hipY,91,u); exF=lerp(exF,8,u); exB=lerp(exB,-8,u);
  }
  if(p.ko){
    const fall=clamp((p.koT||0)/0.55,0,1);
    hipY=lerp(88,18,fall); lean=lerp(0,-0.26,fall);
    tF=lerp(0.26,1.42,fall); tB=lerp(-0.30,1.15,fall); sF=0.30; sB=0.45;
    aF=lerp(0.55,1.35,fall); aB=lerp(0.34,1.10,fall);
    fF=lerp(2.30,0.35,fall); fB=lerp(2.12,0.85,fall); twist=0.2*fall;
  }

  // legs
  const hipF={x:11,y:hipY,z:0}, hipB={x:-11,y:hipY,z:0};
  const knF={x:11,y:hipY-Math.cos(tF)*44,z:Math.sin(tF)*44};
  const knB={x:-11,y:hipY-Math.cos(tB)*44,z:Math.sin(tB)*44};
  const anF={x:11,y:Math.max(3,knF.y-Math.cos(sF)*42),z:knF.z+Math.sin(sF)*42};
  const anB={x:-11,y:Math.max(3,knB.y-Math.cos(sB)*42),z:knB.z+Math.sin(sB)*42};
  const toeF={x:11,y:anF.y-2,z:anF.z+15}, toeB={x:-11,y:anB.y-2,z:anB.z+15};

  // torso
  const hip={x:0,y:hipY-bob*0.4,z:0}, waist={x:0,y:hipY+22,z:lean*20};
  const chest={x:0,y:hipY+50,z:lean*34}, neck={x:0,y:hipY+64,z:lean*38};
  const head={x:twist*10,y:hipY+82,z:lean*40}, crown={x:twist*10,y:hipY+98,z:lean*40};

  // arms
  const shF={x:20,y:hipY+62,z:lean*34}, shB={x:-20,y:hipY+62,z:lean*34};
  const elF={x:shF.x+exF,y:shF.y-Math.cos(aF)*31,z:shF.z+Math.sin(aF)*31};
  const elB={x:shB.x+exB,y:shB.y-Math.cos(aB)*31,z:shB.z+Math.sin(aB)*31};
  const wrF={x:elF.x+wxF,y:elF.y-Math.cos(fF)*27,z:elF.z+Math.sin(fF)*27};
  const wrB={x:elB.x+wxB,y:elB.y-Math.cos(fB)*27,z:elB.z+Math.sin(fB)*27};
  const handF={x:wrF.x,y:wrF.y-4,z:wrF.z+3}, handB={x:wrB.x,y:wrB.y-4,z:wrB.z+3};

  return {P,S,moving,swing,bob,k,air,hip,waist,chest,neck,head,crown,
    shF,shB,elF,elB,wrF,wrB,handF,handB,
    hipF,hipB,knF,knB,anF,anB,toeF,toeB};
}
const panel=(P,
  x1,y1,z1,x2,y2,z2,x3,y3,z3,x4,y4,z4,color,opt)=>
  pushPanel(P(x1,y1,z1),P(x2,y2,z2),P(x3,y3,z3),P(x4,y4,z4),color,opt);

/* local axis-aligned box with outward-facing winding */
function lbox(P,cx,cy,cz,w,h,d,color,opt){
  const hw=w/2,hh=h/2,hd=d/2;
  const Q=(x,y,z)=>P(cx+x,cy+y,cz+z);
  pushQuad(Q(-hw,-hh,hd),Q(hw,-hh,hd),Q(hw,hh,hd),Q(-hw,hh,hd),color,opt);
  pushQuad(Q(-hw,-hh,-hd),Q(-hw,hh,-hd),Q(hw,hh,-hd),Q(hw,-hh,-hd),color,opt);
  pushQuad(Q(hw,-hh,hd),Q(hw,-hh,-hd),Q(hw,hh,-hd),Q(hw,hh,hd),color,opt);
  pushQuad(Q(-hw,-hh,-hd),Q(-hw,-hh,hd),Q(-hw,hh,hd),Q(-hw,hh,-hd),color,opt);
  pushQuad(Q(-hw,hh,hd),Q(hw,hh,hd),Q(hw,hh,-hd),Q(-hw,hh,-hd),color,opt);
  pushQuad(Q(-hw,-hh,-hd),Q(hw,-hh,-hd),Q(hw,-hh,hd),Q(-hw,-hh,hd),color,opt);
}

function drawFighter(p){
  // fighters face each other, but angle a quarter toward the camera so the
  // coat, face and weapon read in the shot (a standard 3D fighting cheat)
  let face=p.face;
  if(CAM&&!p.ko){
    const camYaw=Math.atan2(CAM.eye.x-p.x,CAM.eye.z-p.z);
    let d=camYaw-face; while(d>Math.PI)d-=TAU; while(d<-Math.PI)d+=TAU;
    face+=d*0.26;
  }
  const J=fighterParts(p,face);
  const cfg=p.cfg;
  const flash=p.hitFlash>0;
  const C=flash?{...cfg,coat:'#ffffff',panel:'#ffffff',trim:'#ffffff',hair:'#ffffff',skin:'#ffffff',accent:'#ffffff'}
               :cfg;
  const coat=C.coat, panelCol=C.panel, trim=C.trim, skin=C.skin;
  const seg=(a,b,w,col,opt)=>boxSeg(J.P(a.x,a.y,a.z),J.P(b.x,b.y,b.z),w,col,opt);
  const dark='#0a1220';

  // back leg, front leg
  seg(J.hipB,J.knB,19,coat); seg(J.knB,J.anB,15,coat); seg(J.anB,J.toeB,15,dark);
  seg(J.hipF,J.knF,19,coat); seg(J.knF,J.anF,15,coat); seg(J.anF,J.toeF,15,dark);
  // pelvis / abdomen / chest / shoulders
  lbox(J.P,J.hip.x,J.hip.y+4,0,34,18,23,panelCol);
  // belt, buckle and hip guards — shared tailoring so every silhouette reads
  lbox(J.P,0,J.hip.y+17,0,36,7,25,C.trim);
  lbox(J.P,0,J.hip.y+9,0,10,9,26,C.accent,{flat:true,alpha:.9});
  lbox(J.P,0,J.waist.y+6,0,30,26,21,coat);
  lbox(J.P,0,J.chest.y,0,40,30,25,panelCol);
  lbox(J.P,0,J.chest.y+14,0,44,10,26,coat);
  // chest crest + shoulder caps
  lbox(J.P,0,J.chest.y+4,12.4,10,11,2,C.accent,{flat:true,alpha:.85});
  lbox(J.P,J.shF.x,J.shF.y+4,0,19,8,21,coat);
  lbox(J.P,J.shB.x,J.shB.y+4,0,19,8,21,coat);
  lbox(J.P,0,J.neck.y,0,12,12,12,skin);
  // head, jaw taper and neck shadow
  lbox(J.P,J.head.x,J.head.y+1,J.head.z,21,25,23,skin);
  lbox(J.P,J.head.x,J.head.y-11,J.head.z+1,17,9,20,skin);
  lbox(J.P,J.head.x,J.head.y-17,J.head.z,11,4,13,shadeColor(skin,0.86));
  // ears
  lbox(J.P,J.head.x-11,J.head.y+1,J.head.z,4,8,7,skin);
  lbox(J.P,J.head.x+11,J.head.y+1,J.head.z,4,8,7,skin);
  // eyes, brows, mouth
  lbox(J.P,J.head.x-4.6,J.head.y+1,J.head.z+11.2,4,3,2,cfg.eyes||'#eaf6ff',{flat:true});
  lbox(J.P,J.head.x+4.6,J.head.y+1,J.head.z+11.2,4,3,2,cfg.eyes||'#eaf6ff',{flat:true});
  lbox(J.P,J.head.x-4.6,J.head.y+4.6,J.head.z+11.2,5,1.6,2,'#141d29',{flat:true});
  lbox(J.P,J.head.x+4.6,J.head.y+4.6,J.head.z+11.2,5,1.6,2,'#141d29',{flat:true});
  lbox(J.P,J.head.x,J.head.y-7,J.head.z+11.2,7,2,2,shadeColor(skin,0.78),{flat:true});
  // hair cap that leaves the face clear
  lbox(J.P,J.head.x,J.head.y+10,J.head.z-2,22,13,22,C.hair);
  lbox(J.P,J.head.x,J.head.y+3,J.head.z-9,20,18,8,C.hair);

  // back arm, front arm
  seg(J.shB,J.elB,13,coat); seg(J.elB,J.wrB,11,trim);
  seg(J.shF,J.elF,13,coat); seg(J.elF,J.wrF,11,trim);
  lbox(J.P,J.shF.x,J.shF.y-2,0,16,14,18,coat);
  lbox(J.P,J.shB.x,J.shB.y-2,0,16,14,18,coat);
  lbox(J.P,J.handB.x,J.handB.y,J.handB.z,10,11,12,dark);
  lbox(J.P,J.handF.x,J.handF.y,J.handF.z,11,11,13,C.skin);
  // knee guards and reinforced shoes
  lbox(J.P,J.knF.x,J.knF.y,J.knF.z,17,13,18,trim);
  lbox(J.P,J.knB.x,J.knB.y,J.knB.z,17,13,18,trim);
  lbox(J.P,J.anF.x,J.anF.y+4,J.anF.z+3,16,11,23,dark);
  lbox(J.P,J.anB.x,J.anB.y+4,J.anB.z+3,16,11,23,dark);

  const fn=MODELS[cfg.model];
  if(fn) fn(J.P,J,C,p);

  // --- active-state geometry: every timed buff now has a body around it ---
  if(p.kind===4&&p.vectorBarrierT>0){
    const rr2=82, yb=p.y+100*J.S;
    for(let i=0;i<8;i++){
      const a0=i/8*TAU, a1=(i+1)/8*TAU;
      const wob=Math.sin(time*3+i)*8;
      pushPanel({x:p.x+Math.cos(a0)*rr2,y:yb-62+wob,z:p.z+Math.sin(a0)*rr2},
                {x:p.x+Math.cos(a1)*rr2,y:yb-62+Math.sin(time*3+i+1)*8,z:p.z+Math.sin(a1)*rr2},
                {x:p.x+Math.cos(a1)*rr2,y:yb+74,z:p.z+Math.sin(a1)*rr2},
                {x:p.x+Math.cos(a0)*rr2,y:yb+74+wob,z:p.z+Math.sin(a0)*rr2},
                '#a6ffdd',{flat:true,alpha:.16});
    }
    glow(p.x,p.y+100,p.z,'#a6ffdd',160,.26);
  }
  if(p.extraArmT>0){
    for(const s of [-1,1]){
      const sh=J.P(s*20,J.shF.y,J.shF.z), el=J.P(s*54,J.shF.y+6,J.shF.z+18), tip=J.P(s*62,J.shF.y-16,J.shF.z+52);
      boxSeg(sh,el,10,'#a5f4ff',{flat:true,alpha:.88});
      boxSeg(el,tip,8,'#eaffff',{flat:true,alpha:.92});
      glow(tip.x,tip.y,tip.z,'#a5f4ff',55,.4);
    }
  }
  if(p.stormT>0){
    const S2=p.cfg.scale||1;
    for(let i=0;i<14;i++){
      const a=time*2.4+i*TAU/14, rad=150+Math.sin(time*3+i)*34;
      const yy=p.y+42+((i*37)%150);
      const x=p.x+Math.cos(a)*rad, z=p.z+Math.sin(a)*rad;
      boxSeg({x,y:yy+30,z},{x,y:yy,z},8,'#8ff0ff',{flat:true,alpha:.86});
      glow(x,yy,z,'#8ff0ff',34,.34);
    }
    glow(p.x,p.y+110,p.z,'#8ff0ff',250,.22);
  }
  if(p.zephyrT>0){
    for(let r=0;r<3;r++){
      const rr2=95+r*42, yy=p.y+40+r*34, rot=time*(2.2+r*0.6);
      for(let i=0;i<7;i++){
        const a0=rot+i*TAU/7, a1=a0+TAU/14;
        pushPanel({x:p.x+Math.cos(a0)*rr2,y:yy,z:p.z+Math.sin(a0)*rr2},
                  {x:p.x+Math.cos(a1)*rr2,y:yy+5,z:p.z+Math.sin(a1)*rr2},
                  {x:p.x+Math.cos(a1)*rr2,y:yy+13,z:p.z+Math.sin(a1)*rr2},
                  {x:p.x+Math.cos(a0)*rr2,y:yy+8,z:p.z+Math.sin(a0)*rr2},
                  '#e8daff',{flat:true,alpha:.26});
      }
    }
  }
  if(p.windGuardT>0) glow(p.x,p.y+100,p.z,'#e8daff',200,.24);
  if(p.sharpenT>0){
    const hf=J.P(J.handF.x,J.handF.y,J.handF.z);
    glow(hf.x,hf.y,hf.z,'#ffe9b8',70,.4);
  }
  if(p.anchorT>0) glow(p.x,p.y+8,p.z,'#ffb3c6',150,.26);

  // Technique / Maximum weapon flare. This used to key off p.atkAnim, so
  // every plain strike spawned a stray glowing blade at the hand — the random
  // light that appeared whenever somebody pressed M1. Casts only, now.
  if((p.atkAnim>0&&p.atkKind==='cast')||p.ultT>0){
    const h=J.handF, tip={x:h.x+Math.sin(face)*54,y:h.y+16,z:h.z+Math.cos(face)*54};
    boxSeg(h,tip,8,cfg.accent,{flat:true,alpha:.9});
    glow(tip.x,tip.y,tip.z,cfg.accent,80,.5);
  }
  // strike arc: a brief crescent that ties the fist to the impact
  if(p.atkKind==='jab'&&J.k>0.08){
    const a0=face-0.95, a1=face+0.95, rad=62+38*J.k;
    const cx=p.x+Math.sin(face)*30, cz=p.z+Math.cos(face)*30;
    const segs=7;
    for(let i=0;i<segs;i++){
      const t0=a0+(a1-a0)*(i/segs), t1=a0+(a1-a0)*((i+1)/segs);
      const y0=p.y+112+Math.sin(Math.PI*J.k)*20-8*Math.abs(i-segs/2);
      pushPanel(
        {x:cx+Math.sin(t0)*rad,y:y0,z:cz+Math.cos(t0)*rad},
        {x:cx+Math.sin(t1)*rad,y:y0,z:cz+Math.cos(t1)*rad},
        {x:cx+Math.sin(t1)*(rad+8),y:y0+5,z:cz+Math.cos(t1)*(rad+8)},
        {x:cx+Math.sin(t0)*(rad+8),y:y0+5,z:cz+Math.cos(t0)*(rad+8)},
        cfg.accent,{flat:true,alpha:0.30*J.k});
    }
  }
  if(p.domainTime>0) glow(p.x,p.y+110,p.z,cfg.accent,300,.26);
  if(p.armorT>0) glow(p.x,p.y+100,p.z,'#bfe9ff',180,.22);
  if(p.simpleT>0) glow(p.x,p.y+100,p.z,'#bdefff',240,.3);

  // dash after-images
  if(p.ghosts) for(const g of p.ghosts){
    const a=clamp(g.life/0.26,0,1)*0.32;
    const gp={x:g.x,z:g.z,face:g.face};
    const Q=(lx,ly,lz)=>({x:gp.x+lx*Math.cos(gp.face)+lz*Math.sin(gp.face),
                          y:p.y+ly*J.S, z:gp.z-lx*Math.sin(gp.face)+lz*Math.cos(gp.face)});
    const tint=p.cfg.accent;
    pushPanel(Q(-16,20,0),Q(16,20,0),Q(16,150,0),Q(-16,150,0),tint,{flat:true,alpha:a});
    pushPanel(Q(16,20,0),Q(-16,20,0),Q(-16,150,0),Q(16,150,0),tint,{flat:true,alpha:a});
    pushPanel(Q(-11,150,0),Q(11,150,0),Q(11,196,0),Q(-11,196,0),tint,{flat:true,alpha:a});
  }

  // ground shadow
  if(CAM&&VP){
    const sh=project(CAM,VP,p.x,0.6,p.z);
    if(sh){
      const r=Math.max(8,44*sh.s*J.S);
      ctx.save();
      ctx.globalAlpha=0.36;
      ctx.fillStyle='#02060f';
      ctx.beginPath();ctx.ellipse(sh.x,sh.y,r,r*0.38,0,0,TAU);ctx.fill();
      ctx.restore();
    }
  }
}

/* ---------- solid-light mirrors ---------- */
// These are real bodies: orbiting copies that absorb a hit and each fire a
// lash alongside Shirogane's technique, not just a HUD counter.
function drawMirrors(p){
  if(p.kind!==2||!p.mirrors||!p.mirrors.length) return;
  const S=p.cfg.scale||1, face=p.face;
  for(const m of p.mirrors){
    const x=p.x+Math.cos(m.a)*m.r, z=p.z+Math.sin(m.a)*m.r;
    const P=(lx,ly,lz)=>({x:x+lx*Math.cos(face)+lz*Math.sin(face),y:p.y+ly*S,z:z-lx*Math.sin(face)+lz*Math.cos(face)});
    const a=clamp(m.life/7,0,1)*0.5;
    const col=p.cfg.accent;
    boxSeg(P(-8,18,0),P(-9,2,4),10,col,{flat:true,alpha:a*0.9});
    boxSeg(P(8,18,0),P(9,2,4),10,col,{flat:true,alpha:a*0.9});
    boxSeg(P(0,20,0),P(0,96,0),21,col,{flat:true,alpha:a});
    boxSeg(P(-13,88,0),P(-22,64,10),7,'#eaffff',{flat:true,alpha:a});
    boxSeg(P(13,88,0),P(22,64,10),7,'#eaffff',{flat:true,alpha:a});
    lbox(P,0,110,0,18,21,19,'#eaffff',{flat:true,alpha:a*0.85});
    for(let i=0;i<3;i++){
      const q=(time*1.6+i/3+m.a)*TAU;
      pushPanel(P(Math.cos(q)*20,60,Math.sin(q)*20),P(Math.cos(q+0.6)*20,60,Math.sin(q+0.6)*20),
                P(Math.cos(q+0.6)*20,86,Math.sin(q+0.6)*20),P(Math.cos(q)*20,86,Math.sin(q)*20),
                '#eaffff',{flat:true,alpha:a*0.5});
    }
    glow(x,p.y+110*S,z,col,80,a*0.9);
  }
}

/* ---------- bake stage geometry once ---------- */
function bake(fn){
  const prev=RAW; RAW=[];
  fn();
  const out=RAW; RAW=prev;
  return out;
}

let AC=null;
function sfx(type){
  try{
    if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended') AC.resume();
    const o=AC.createOscillator(), g=AC.createGain(), n=AC.currentTime;
    let f=160,d=.1,wave='triangle';
    if(type==='hit'){f=210;d=.08;wave='square'}
    else if(type==='heavy'){f=95;d=.22;wave='sawtooth'}
    else if(type==='dash'){f=540;d=.09;wave='sine'}
    else if(type==='guard'){f=760;d=.07;wave='triangle'}
    else if(type==='parry'){f=1250;d=.16;wave='sine'}
    else if(type==='tech'){f=640;d=.18;wave='triangle'}
    else if(type==='domain'){f=58;d=1.0;wave='sawtooth'}
    else if(type==='max'){f=72;d=.5;wave='square'}
    else if(type==='ko'){f=48;d=.62;wave='sawtooth'}
    else if(type==='heal'){f=560;d=.2;wave='sine'}
    else if(type==='card'){f=880;d=.11;wave='triangle'}
    o.type=wave;
    o.frequency.setValueAtTime(f,n);
    o.frequency.exponentialRampToValueAtTime(Math.max(30,f*.4),n+d);
    g.gain.setValueAtTime(.045,n);
    g.gain.exponentialRampToValueAtTime(.0001,n+d);
    o.connect(g);g.connect(AC.destination);o.start(n);o.stop(n+d+.02);
  }catch(e){}
}

/* ---------- combat ---------- */
function alive(){return players.filter(p=>!p.ko)}
function nearest(from){
  let best=null,bd=1e9;
  for(const p of players){
    if(p===from||p.ko) continue;
    const d=Math.hypot(p.x-from.x,p.z-from.z);
    if(d<bd){bd=d;best=p}
  }
  return best;
}
function dmgMul(p){
  let m=p.cfg.dmg;
  if(p.kind===1) m*=1+p.mom/200*0.45;
  if(p.overdriveT>0) m*=1.18;
  if((p.burnout||0)>0) m*=0.72;
  if(p.domainTime>0) m*=1.25;
  if(p.burn>0) m*=0.9;
  return m;
}
function awardAwake(p,n){ p.aw=clamp(p.aw+n,0,100) }

function hurt(t,src,amount,opt){
  opt=opt||{};
  if(t.ko) return 0;
  if(clash && (!clash.ids.includes(t.i)||!src||!clash.ids.includes(src.i))) return 0;
  if(t.invuln>0&&!opt.sure){
    popupAt(t.x,t.y+150,t.z,'EVADE',t.cfg.accent,12);
    awardAwake(t,6);
    if(t.kind===1){t.mom=clamp(t.mom+10,0,200);popupAt(t.x,t.y+178,t.z,'PERFECT PURSUIT +10%',t.cfg.accent,11)}
    return 0;
  }
  if(t.simpleT>0&&opt.sure){
    popupAt(t.x,t.y+158,t.z,'SIMPLE DOMAIN · NULLIFIED','#b9f7ff',11);
    return 0;
  }
  if(!opt.sure&&t.kind===2&&t.clones>0&&Math.random()<0.30){
    t.clones=Math.max(0,t.clones-1);
    if(t.mirrors&&t.mirrors.length) t.mirrors.pop();
    popupAt(t.x,t.y+150,t.z,'HOLOGRAM!','#cbf9ff',12);
    sparks(t.x,t.y+100,t.z,'#d8e9ff',10,180);
    return 0;
  }
  if(t.guard&&t.parryT>0&&!opt.sure){
    sfx('parry');
    t.parryT=0; t.counterT=1.15; t.guardT=0;
    if(src&&!src.ko){src.stun=Math.max(src.stun,0.62)}
    popupAt(t.x,t.y+170,t.z,'JUST GUARD · COUNTER READY','#bdf6ff',12);
    sparks(t.x,t.y+110,t.z,'#cdf3ff',16,260);
    shake=Math.max(shake,5); hitStop=Math.max(hitStop,0.07);
    awardAwake(t,10);
    return 0;
  }
  let dmg=amount;
  let blocked=false;
  if(t.guard){
    blocked=true; sfx('guard'); dmg*=0.18;
    sparks(t.x+Math.sin(t.face)*20,t.y+110,t.z+Math.cos(t.face)*20,'#9fd8ff',6,120);
  }
  if(t.armorT>0) dmg*=0.55;
  if(t.kind===1&&t.resistT>0){ dmg*=0.42; popupAt(t.x,t.y+146,t.z,'RESISTANCE','#9fd8ff',11) }
  if(t.kind===4&&t.vectorBarrierT>0&&!opt.sure){
    dmg*=0.28;
    popupAt(t.x,t.y+146,t.z,'REFRACTION','#a6ffdd',11);
    if(src&&src!==t&&!src.ko&&!clash){
      const rf=Math.max(2,Math.round(dmg*0.6));
      src.hp=Math.max(0,src.hp-rf);
      popupAt(src.x,src.y+150,src.z,'REFRACTED '+rf,'#a6ffdd',12);
      sparks(src.x,src.y+100,src.z,'#a6ffdd',8,160);
      if(src.hp<=0) ko(src,t);
    }
  }
  if(clash){
    // barrier war counts damage DEALT, not damage taken
    if(src) clash.score[src.i]=(clash.score[src.i]||0)+dmg;
  }else{
    t.hp=Math.max(0,t.hp-dmg);
  }
  t.hitFlash=0.11;
  if(!blocked){
    const nx=(t.x-(src?src.x:t.x-1))||0.001, nz=(t.z-(src?src.z:t.z-1))||0.001;
    const nl=Math.hypot(nx,nz)||1;
    const kn=(opt.knock||0);
    t.vx+=nx/nl*kn; t.vz+=nz/nl*kn;
    if(opt.launch) t.vy=Math.max(t.vy,opt.launch);
    if(opt.stun) t.stun=Math.max(t.stun,opt.stun);
    t.stun=Math.max(t.stun,opt.stun||0.12);
  }
  awardAwake(t,blocked?3:6);
  if(src){
    awardAwake(src,6);
    src.dmgDone+=dmg;
    if(src.kind===1) src.mom=clamp(src.mom+8,0,200);
    if(!clash){
      if(comboOwner===src.i&&comboT>0){comboCount++;comboDmg+=dmg}
      else{comboOwner=src.i;comboCount=1;comboDmg=dmg}
      comboT=1.6;
      src.comboHits=comboCount;
    }
  }
  if(!blocked) sfx(dmg>20?'heavy':'hit');
  sparks(t.x,t.y+108,t.z,blocked?'#bfe9ff':(src?src.cfg.accent:'#ffffff'),blocked?5:12,blocked?120:300);
  if(!blocked) popupAt(t.x,t.y+150,t.z,Math.round(dmg),blocked?'#b7dcff':'#ffffff',blocked?11:15);
  shake=Math.min(26,shake+dmg*0.72);
  hitStop=Math.max(hitStop,blocked?0.035:0.06);
  camKick=Math.max(camKick,clamp(dmg*0.010,0,0.55));
  if(t.hp<=0&&!t.ko) ko(t,src);
  return dmg;
}

function ko(t,src){

function finishMatch(){
  if(phase!=='fight') return;
  if(winner<0){
    let best=-1,bh=-1;
    for(const p of players) if(p.hp>bh){bh=p.hp;best=p.i}
    winner=best;
  }
  phase='menu'; page='result';
  if(net.active&&net.host) netPush();
  renderMenu();
}

function strike(p){
  if(p.atkCd>0||p.ko||p.stun>0||p.burn>0) return;
  const k=keysFor(p);
  const launch=keyHeld(p,k.jump)&&p.y<=2;
  const sweep=keyHeld(p,k.down);
  const kind=launch?'launch':sweep?'sweep':'jab';
  p.chain=(kind==='jab'&&p.chainT>0)?Math.min(5,p.chain+1):1;
  p.chainT=0.6;
  p.atkCd=launch?0.42:kind==='sweep'?0.38:0.27;
  p.atkAnim=0.34; p.atkKind=kind;
  // capture the parry reward first — it is consumed by this strike
  const counterReady=p.counterT>0;
  if(counterReady){ p.counterT=0; p.chain=1; }
  const finisher=kind==='jab'&&p.chain>=5;
  const base=(launch?13:kind==='sweep'?10:finisher?18:(7+p.chain*1.4)+(p.zephyrT>0?20:0))*(p.sharpenT>0?1.35:1);
  const range=launch?125:kind==='sweep'?155:150;
  let hitAny=false;
  for(const t of players){
    if(t===p||t.ko) continue;
    const dx=t.x-p.x, dz=t.z-p.z, d=Math.hypot(dx,dz)||0.001;
    if(d>range) continue;
    if((dx/d)*Math.sin(p.face)+(dz/d)*Math.cos(p.face)<0.12) continue;
    if(Math.abs(t.y-p.y)>130) continue;
    const counter=counterReady;
    hurt(t,p,(counter?base*1.9:base)*dmgMul(p),{
      knock:kind==='launch'?110:finisher?720:kind==='sweep'?360:(260+(counter?220:0)),
      launch:kind==='launch'?660:0,stun:kind==='sweep'?0.62:0.16});
    if(p.zephyrT>0){ t.healLock=6; p.zephyrT=0; popupAt(t.x,t.y+186,t.z,'ZEPHYR · HEAL BLOCKED',p.cfg.accent,13) }
    if(counter){
      hitStop=Math.max(hitStop,0.08); shake=Math.max(shake,10);
      popupAt(t.x,t.y+186,t.z,'COUNTER','#bdf6ff',13);
    }
    hitAny=true;
  }
  const fx=Math.sin(p.face), fz=Math.cos(p.face);
  // step into the punch — heavier feel, and it keeps combos in range
  p.vx+=fx*(finisher?300:kind==='sweep'?80:180);
  p.vz+=fz*(finisher?300:kind==='sweep'?80:180);
  slashBurst(p.x+fx*80,p.y+112,p.z+fz*80,p.cfg.accent,finisher?1.6:1);
  if(finisher){ ringBurst(p.x+fx*70,p.y+100,p.z+fz*70,p.cfg.accent,1.1); shake=Math.max(shake,8) }
  if(!hitAny&&finisher) popupAt(p.x,p.y+170,p.z,'FINISHER',p.cfg.accent,11);
}

function dash(p){

  p.vx+=Math.sin(p.face)*880; p.vz+=Math.cos(p.face)*880;
  p.ghosts.push({x:p.x,z:p.z,face:p.face,life:0.26});

}

        hurt(t,p,clamp(24+(p.club||0)*12,27,84)*dmgMul(p),{knock:490,stun:0.2,sure:true});

    }else{
      p.club=5;

    }
  }else if(c.type==='heart'){
    addProjectile({x:tx,y:ty,z:tz,vx:fx*720,vz:fz*720,owner:p,dmg:10*dmgMul(p),knock:0,stun:0.6,
      color:'#ff7eac',kind:'heart',life:1.3,r:18});
    popupAt(p.x,p.y+165,p.z,c.s+c.r+' '+(c.rank===12?'REFLECTIVE BOND':'ATTACHMENT'),'#ffb3c6',12);
  }else{
    p.jokers=(p.jokers||0)-1;
    if(Math.random()<0.5){
      const foes=players.filter(t=>t!==p&&!t.ko)
        .sort((a,b)=>Math.hypot(a.x-p.x,a.z-p.z)-Math.hypot(b.x-p.x,b.z-p.z));
      announce('THE REALITY WAGER','THE UNIVERSE AGREES','#ffe9b0',1.3);
      if(foes[0]) hurt(foes[0],p,83*dmgMul(p),{knock:450,stun:0.68,sure:true});
      popupAt(p.x,p.y+170,p.z,'JOKER · REALITY AGREES','#ffe9b0',13);
    }else{
      p.hp=Math.max(1,p.hp-49); p.stun=Math.max(p.stun,0.43);

      popupAt(p.x,p.y+170,p.z,'BACKLASH -49','#ff91b2',16); shake=Math.max(shake,12);

/* ---------- Guard + Technique ---------- */
// Guard used to swallow the technique input entirely. Each fighter now has
// the guard-technique action their 2D sheet lists, and blocking no longer
// prevents the cast: the guard flag routes it here instead of eating it.
function guardTechnique(p){
  const fx=Math.sin(p.face), fz=Math.cos(p.face);
  p.atkCd=0.45; p.atkAnim=0.42; p.atkKind='cast';
  if(p.kind===0){
    const i=p.cardIdx||0, c=JIN_DECK[i];
    if(!c) return;
    if((p.cardCd&&p.cardCd[i]>0)||(c.type==='joker'&&(p.jokers||0)<=0)){
      popupAt(p.x,p.y+160,p.z,'THAT CARD IS SPENT','#ffc0d2',11); return;
    }
    if(p.ce<c.cost){ popupAt(p.x,p.y+160,p.z,'NEEDS '+c.cost+' CE','#ffc0d2',11); return }
    p.ce-=c.cost; p.castType='self_'+c.type;
    if(!p.cardCd) p.cardCd={};
    p.cardCd[i]=(c.rank===14||c.type==='joker')?999:9;
    if(c.type==='diamond'){ p.armorT=Math.max(p.armorT,c.rank===14?5:3.3); p.invuln=Math.max(p.invuln,0.10);
      popupAt(p.x,p.y+168,p.z,'SELF DECREE · INTEGRITY','#caeaff',13) }
    else if(c.type==='spade'){ p.sharpenT=Math.max(p.sharpenT,c.rank===14?6:4);
      popupAt(p.x,p.y+168,p.z,'SELF DECREE · RAZOR HANDS','#ffe3a1',13) }
    else if(c.type==='club'){ p.club=5;
      popupAt(p.x,p.y+168,p.z,'SELF DECREE · KINETIC BATTERY','#ffe8b0',13) }
    else if(c.type==='heart'){ p.anchorT=Math.max(p.anchorT,c.rank===12?6:4.5);
      popupAt(p.x,p.y+168,p.z,'SELF DECREE · ANCHORED BODY','#ffb7dc',13) }
    else {
      p.jokers=(p.jokers||0)-1;
      if(Math.random()<0.5){ p.hp=Math.min(p.maxHp,p.hp+65);
        announce('JOKER: SELF WAGER','MY BODY IS RESTORED','#c6ffed',1.3);
        popupAt(p.x,p.y+168,p.z,'SELF RESTORATION +65','#b2ffe6',15) }
      else { p.hp=Math.max(1,p.hp-45); p.stun=Math.max(p.stun,0.4);
        announce('JOKER: SELF WAGER','MIRACLE REVERSED','#ff9cbe',1.3);
        popupAt(p.x,p.y+168,p.z,'BACKLASH -45','#ff8db0',15) }
    }
    p.ce=Math.min(100,p.ce+3);

  }
  if(p.kind===1){
    p.resistT=3.4; p.mom=Math.max(0,p.mom-18); p.castType='resist';
    popupAt(p.x,p.y+168,p.z,'RESISTANCE · 58% DAMPENING','#9fd8ff',13);
    ringBurst(p.x,8,p.z,'#9fd8ff',1.0); sfx('guard'); return;
  }
  if(p.kind===2){
    if(p.snapshot){
      const s=p.snapshot; p.snapshot=null;
      p.x=s.x; p.z=s.z; p.hp=Math.max(p.hp,s.hp); p.ce=Math.max(p.ce,s.ce);
      p.invuln=Math.max(p.invuln,0.55); p.castType='rewind';
      popupAt(p.x,p.y+170,p.z,'MOMENT CAPTURE · REWIND','#e8faff',13);
      ringBurst(p.x,8,p.z,'#e8faff',1.5); sparks(p.x,p.y+90,p.z,'#e8faff',16,220); sfx('parry'); return;
    }
    if(p.ce<14){ popupAt(p.x,p.y+160,p.z,'NOT ENOUGH CE','#ffc0d2',11); return }
    p.ce-=14; p.snapshot={x:p.x,z:p.z,hp:p.hp,ce:p.ce}; p.castType='snapshot';
    popupAt(p.x,p.y+170,p.z,'MOMENT CAPTURE · SNAPSHOT SAVED','#cbf9ff',12);
    ringBurst(p.x,8,p.z,'#cbf9ff',0.8); sfx('tech'); return;
  }
  if(p.kind===3){
    if(p.extraArmT>0){ popupAt(p.x,p.y+160,p.z,'CRYSTAL ARMS ALREADY BOUND','#bad9ee',11); return }

    popupAt(p.x,p.y+168,p.z,'BIND · CRYSTAL ARMS ×2','#a5f4ff',13);
    ringBurst(p.x,8,p.z,'#a5f4ff',1.2); sfx('tech'); return;
  }
  if(p.kind===4){
    if(p.ce<18){ popupAt(p.x,p.y+160,p.z,'NOT ENOUGH CE','#ffc0d2',11); return }

    ringBurst(p.x,8,p.z,'#a6ffdd',1.1); sfx('guard'); return;

  p.ce-=16; p.windGuardT=3.5; p.castType='gale';

    t.vx+=((t.x-p.x)/260)*520; t.vz+=((t.z-p.z)/260)*520; t.stun=Math.max(t.stun,0.2);
  }
  popupAt(p.x,p.y+168,p.z,'GALE MANTLE','#e8daff',13);
  ringBurst(p.x,8,p.z,'#e8daff',1.2); sfx('guard');
}

function technique(p){
  if(p.atkCd>0||p.ko||p.stun>0||p.burn>0||p.sealed>0) return;
  const k=keysFor(p);
  const fx=Math.sin(p.face), fz=Math.cos(p.face);
  if(p.guard||keyHeld(p,k.guard)){ guardTechnique(p); return }
  if(p.kind===0){ useCard3D(p); return }
  if(p.kind===1){
    const over=p.overdriveT>0;
    const full=keyHeld(p,k.up);
    const need=full?100:50;
    let paid=false;
    // Overdrive's entire promise is that Hari Blue stops asking permission.
    // While it burns, the wave costs no Momentum and can be chained; before
    // this it still drained 50 Momentum, so one cast left Arata unable to
    // fire again and the state looked like it changed nothing.
    if(over){ paid=true }
    else if(p.mom>=need){ p.mom-=need; paid=true }
    else if(p.ce>=14){ p.ce-=Math.min(p.ce,14+(need-p.mom)*0.6); p.mom=0; paid=true }
    if(!paid){ popupAt(p.x,p.y+165,p.z,'AVALANCHE NEEDS MOMENTUM','#ffc0d2',11); return }
    p.atkCd=over?0.30:0.5; p.atkAnim=0.46; p.ultT=Math.max(p.ultT,0.12); p.atkKind='cast'; p.castType='avalanche';
    addProjectile({x:p.x+fx*60,y:p.y+100,z:p.z+fz*60,vx:fx*(over?1090:970),vz:fz*(over?1090:970),
      owner:p,dmg:(full?54:35)*(over?1.45:1)*dmgMul(p),knock:(full?740:490)*(over?1.35:1),
      color:over?'#eaffff':'#5dcfff',kind:'wave',life:1.4,r:(full?27:18)*(over?1.3:1),pierce:true,stun:0.16,over});
    ringBurst(p.x+fx*60,p.y+100,p.z+fz*60,over?'#d8f8ff':'#73d6ff',full?1.9:1.2);
    bursts.push({kind:'beam',x:p.x,y:p.y+100,z:p.z,dx:fx,dz:fz,color:over?'#eaffff':'#9fe6ff',life:0.28,max:0.28,scale:full?1.8:1.2});
    if(over){
      // the state is readable from across the arena, not just in the damage
      flash=Math.max(flash,0.20);
      ringBurst(p.x+fx*60,p.y+100,p.z+fz*60,'#eaffff',2.4);
      sparks(p.x+fx*60,p.y+100,p.z+fz*60,'#eaffff',16,340);
    }
    shake=Math.max(shake,over?14:full?17:7);
    popupAt(p.x,p.y+170,p.z,over?'HARI BLUE · OVERDRIVE':(full?'AVALANCHE ×2':'AVALANCHE ×1.5'),over?'#f0ffff':'#8fe6ff',14);
    sfx('max'); return;
  }
    if(p.kind===2){
    if(keyHeld(p,k.down)){
      if(p.ce<15){ popupAt(p.x,p.y+160,p.z,'NOT ENOUGH CE','#ffc0d2',11); return }
      p.ce-=15; p.atkCd=0.5; p.atkAnim=0.36; p.atkKind='cast'; p.castType='chronal';
      p.invuln=Math.max(p.invuln,0.55);
      p.ghosts.push({x:p.x,z:p.z,face:p.face,life:0.3});
      p.x=clamp(p.x+fx*300,-ARENA+70,ARENA-70);
      p.z=clamp(p.z+fz*300,-ARENA+70,ARENA-70);
      p.ghosts.push({x:p.x,z:p.z,face:p.face,life:0.3});
      ringBurst(p.x,8,p.z,'#e8faff',1.4); sparks(p.x,p.y+90,p.z,'#e8faff',14,200);
      popupAt(p.x,p.y+168,p.z,'CHRONAL LAG','#e8faff',13); sfx('dash'); return;
    }
    if(p.ce<24){ popupAt(p.x,p.y+160,p.z,'NOT ENOUGH CE','#ffc0d2',11); return }
    p.ce-=24; p.atkCd=0.62; p.atkAnim=0.36; p.atkKind='cast'; p.castType='lash';
    for(let i=-1;i<=1;i++)
      addProjectile({x:p.x+fx*60,y:p.y+100+i*20,z:p.z+fz*60,vx:fx*1050,vz:fz*1050,
        owner:p,dmg:13*dmgMul(p),knock:270,color:i===0?'#ffffff':'#ad9eff',kind:'lash',life:1.12,r:9,pierce:true,stun:0.14});
    ringBurst(p.x+fx*90,p.y+100,p.z+fz*90,'#e8faff',1.1);
    if(p.mirrors&&p.mirrors.length){
      // Every solid-light mirror bounces a lash of its own: the mirrors are
      // not decoration, they are extra firing points while they last.
      const tgt=nearest(p);
      if(tgt) for(const m of p.mirrors){
        const mx=p.x+Math.cos(m.a)*m.r, mz=p.z+Math.sin(m.a)*m.r;
        const dx=tgt.x-mx, dz=tgt.z-mz, dl=Math.hypot(dx,dz)||1;
        addProjectile({x:mx,y:p.y+100,z:mz,vx:dx/dl*920,vz:dz/dl*920,
          owner:p,dmg:8*dmgMul(p),knock:120,color:'#c8b8ff',kind:'lash',life:0.82,r:7,pierce:true,stun:0.08});
      }
      popupAt(p.x,p.y+188,p.z,'PRISMATIC CASCADE ×'+p.mirrors.length,'#e8faff',12);
    }
    popupAt(p.x,p.y+168,p.z,'LUMINAL LASH','#e8faff',13); sfx('tech');
  }else if(p.kind===3){
    if(keyHeld(p,k.down)){
      if(p.ce<13){ popupAt(p.x,p.y+160,p.z,'NOT ENOUGH CE','#ffc0d2',11); return }
      p.ce-=13; p.atkKind='cast'; p.castType='spikes';
      p.trapX=p.x+fx*170; p.trapZ=p.z+fz*170;
      for(const t of players) if(t!==p&&!t.ko&&Math.hypot(t.x-p.trapX,t.z-p.trapZ)<120) hurt(t,p,29*dmgMul(p),{knock:260,stun:0.42,sure:true});
      ringBurst(p.trapX,8,p.trapZ,'#88ebff',1.6);
      popupAt(p.x,p.y+168,p.z,'ENLARGE · CRYSTAL SPIKES','#a5f4ff',13);
      p.atkCd=0.53; p.atkAnim=0.36; return;
    }
    if(p.tri<30){ popupAt(p.x,p.y+160,p.z,'TRIANGLE RESERVES DEPLETED','#bad9ee',11); return }
    p.tri-=30; p.atkCd=0.42; p.atkAnim=0.36; p.cardT=0.7; p.atkKind='cast'; p.castType='construct';
    const cst=p.construct||0;
    if(cst===2){
      p.armorT=Math.max(p.armorT,2.5);
      popupAt(p.x,p.y+168,p.z,'CREATION · TRIANGLE SHIELD','#a5f4ff',13);
      ringBurst(p.x,8,p.z,'#a5f4ff',1.0);
    }else{
      const spd=cst===1?1150:850, dmg=cst===1?35:cst===3?22:27, rad=cst===1?18:13;
      addProjectile({x:p.x+fx*48,y:p.y+104,z:p.z+fz*48,vx:fx*spd,vz:fz*spd,

      if(cst===3){ p.trapX=p.x+fx*190; p.trapZ=p.z+fz*190; popupAt(p.x,p.y+168,p.z,'CREATION · CHAIN TRAP','#a5f4ff',13) }
      else popupAt(p.x,p.y+168,p.z,'CREATION · '+['SWORD','SPEAR','SHIELD','CHAIN'][cst],'#a5f4ff',13);

      if((p.siphons||0)<=0){ popupAt(p.x,p.y+160,p.z,'SIPHON DEPLETED','#ffc0d2',11); return }
      p.siphons--; p.ce=Math.min(100,p.ce+19); p.atkKind='cast'; p.castType='siphon';
      t.vx=0; t.vz=0; t.stun=Math.max(t.stun,0.47);
      popupAt(p.x,p.y+172,p.z,'VELOCITY SIPHON ('+p.siphons+'/10)','#a6ffdd',12);
      ringBurst(t.x,8,t.z,p.cfg.accent,0.9); return;
    }
    const charged=(p.loopCharge||0)>0;
    const vcost=charged?23:17;
    if(p.ce<vcost){ popupAt(p.x,p.y+160,p.z,'NOT ENOUGH CE','#ffc0d2',11); return }
    p.ce-=vcost; p.loopCharge=0; p.atkCd=0.47; p.atkAnim=0.34; p.atkKind='cast'; p.castType='vector';
    addProjectile({x:p.x+fx*46,y:p.y+106,z:p.z+fz*46,vx:fx*(charged?1350:880),vz:fz*(charged?1350:880),
      owner:p,dmg:(charged?64:29)*dmgMul(p),knock:charged?700:325,color:'#74f9c4',kind:'vector',life:1.5,r:charged?25:13,pierce:charged,stun:0.14});

    if(keyHeld(p,k.down)){

      p.ce-=20; p.atkCd=0.73;
      for(const t of players) if(t!==p&&!t.ko&&Math.abs(t.x-p.x)<480&&(t.x-p.x)*fx>0){ t.vx=fx*780; t.stun=Math.max(t.stun,0.25) }

      addProjectile({x:p.x+Math.sin(a)*42,y:p.y+104,z:p.z+Math.cos(a)*42,
        vx:Math.sin(a)*1000,vz:Math.cos(a)*1000,owner:p,dmg:12*dmgMul(p),knock:165,color:'#d7b5ff',kind:'wind',life:1.1,r:12,stun:0.12});

function cycleMove(p){
  if(p.ko) return;
  const k=keysFor(p);
  if(p.kind===0){
    const dir=keyHeld(p,k.dash)?-1:1;
    let idx=p.cardIdx||0;
    for(let n=0;n<JIN_DECK.length;n++){
      idx=(idx+dir+JIN_DECK.length)%JIN_DECK.length;
      const c=JIN_DECK[idx];
      if((p.cardCd&&p.cardCd[idx]>0)||(c.type==='joker'&&(p.jokers||0)<=0)) continue;
      break;
    }
    p.cardIdx=idx;
    const c=JIN_DECK[idx];
    popupAt(p.x,p.y+170,p.z,c.s+c.r+' '+c.name,p.cfg.accent,12);
  }else if(p.kind===2){
    if(p.ce<27){popupAt(p.x,p.y+160,p.z,'NOT ENOUGH CE / 27','#ffc0d2',11);return}
    p.ce-=27; p.clones=6; p.cloneT=7; p.mirrorT=7; p.invuln=Math.max(p.invuln,0.35);
    p.mirrors.length=0;
    for(let i=0;i<6;i++) p.mirrors.push({a:i/6*TAU, r:105+(i%2?24:0), life:7});
    popupAt(p.x,p.y+170,p.z,'EMULATION · 6 MIRRORS',p.cfg.accent,12);
    ringBurst(p.x,8,p.z,p.cfg.accent,1.4); sparks(p.x,p.y+90,p.z,p.cfg.accent,16,200); sfx('tech');
  }else if(p.kind===4){
    if(p.ce<9){popupAt(p.x,p.y+160,p.z,'NOT ENOUGH CE','#ffc0d2',11);return}
    p.ce-=9; p.loopCharge=5;
    popupAt(p.x,p.y+170,p.z,'KINETIC LOOP · CHARGING',p.cfg.accent,12);
  }else if(p.kind===3){
    p.construct=((p.construct||0)+1)%4;
    p.trapX=p.x+Math.sin(p.face)*170;
    p.trapZ=p.z+Math.cos(p.face)*170;
    popupAt(p.x,p.y+170,p.z,'RECONSTRUCT · '+['SWORD','SPEAR','SHIELD','CHAIN'][p.construct],p.cfg.accent,12);
  }else{
    popupAt(p.x,p.y+170,p.z,'STANCE SHIFT',p.cfg.accent,11);
    p.face+=Math.PI;
  }
}

function ultimate(p){
  if(p.ko||p.burn>0||p.ultLock) return;
  if(p.aw<70){ popupAt(p.x,p.y+170,p.z,'MAXIMUM NEEDS 70 AWAKENING','#f4c1df',11); return }

  sfx('max');
  p.aw-=70; p.ultT=1.2; p.burn=p.kind===1?0:5.2; p.ultLock=p.kind===1;
  p.ce=Math.min(100,p.ce+20);
  shake=Math.max(shake,22); flash=0.75; hitStop=Math.max(hitStop,0.09);
  announce('MAXIMUM OUTPUT',p.cfg.name+' · '+p.cfg.ultName,p.cfg.accent,1.9);
  ringBurst(p.x,8,p.z,p.cfg.accent,2.4);
  sparks(p.x,p.y+100,p.z,p.cfg.accent,34,460);
  const fx=Math.sin(p.face), fz=Math.cos(p.face);
  if(p.kind===0){
