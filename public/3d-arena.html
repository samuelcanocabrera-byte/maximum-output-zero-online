    if(net.room&&net.host) netPost('/api/arena',netSession({arenaIndex:arenaIdx}));
    renderMenu(); return;
  }
  if(t.dataset.step){
    const s=Number(t.dataset.slotfor), dir=Number(t.dataset.step);
    pick[s]=(pick[s]+dir+ROSTER.length)%ROSTER.length; slot=s; renderMenu(); return;
  }
  if(t.dataset.kind!==undefined){
    const k=Number(t.dataset.kind);
    const other=pick.indexOf(k);
    if(other!==-1&&other!==slot) pick[other]=pick[slot];
    pick[slot]=k;
    if(mode>1) slot=(slot+1)%mode;
    renderMenu(); return;
  }
  if(t.dataset.slotrow!==undefined){ slot=Number(t.dataset.slotrow); renderMenu(); }
});

/* ============================================================
   ONLINE — host-authoritative room play
   The host runs the real simulation and publishes snapshots; guests send
   inputs and render the stream. Reuses the same room service as the 2D game
   (SSE for lobbies/snapshots, JSON POST for actions).
   ============================================================ */
const NETACT={left:'KeyA',right:'KeyD',up:'KeyW',down:'KeyS',jump:'Space',
  attack:'KeyF',skill:'KeyG',guard:'KeyH',cycle:'KeyQ',domain:'KeyE',
  super:'KeyR',rct:'KeyC',dash:'ShiftLeft',emote:'KeyT'};
const CODEACT={};
for(const a in NETACT) CODEACT[NETACT[a]]=a;
const net={active:false,host:false,slot:0,mode:2,room:'',token:'',view:null,
  held:[new Set(),new Set(),new Set()],pressed:[new Set(),new Set(),new Set()],
  sendT:0,busy:false,err:'',name:'',source:null,connected:false,lastSnap:0};

// Every player routes through the same key view: locally on the host, from
// the net buffers for guests. Guests never simulate, so they always read false.
// Online everyone fights on P1's layout on their own machine.
function keysFor(p){ return net.active?KEYMAPS[0]:KEYMAPS[p.i]; }
function keyHeld(p,code){
  if(!net.active) return held.has(code);
  if(net.host){ if(p.i===net.slot) return held.has(code); const s=net.held[p.i]; return !!(s&&s.has(code)) }
  return false;
}
function keyPressed(p,code){
  if(!net.active) return pressed.has(code);
  if(net.host){ if(p.i===net.slot) return pressed.has(code); const s=net.pressed[p.i]; return !!(s&&s.has(code)) }
  return false;
}
function escHTML(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function netPost(path,body){
  try{
    const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(j.error||('HTTP '+r.status));
    return j;
  }catch(e){ net.err=e.message||'Network error'; return null }
}
function netSession(extra){ return Object.assign({room:net.room,token:net.token},extra||{}) }
function netReset(){
  if(net.source){ try{net.source.close()}catch(e){} }
  net.source=null; net.active=false; net.host=false; net.room=''; net.token='';
  net.view=null; net.connected=false; net.busy=false; net.sendT=0;
  for(const s of net.held) s.clear();
  for(const s of net.pressed) s.clear();
}
function netConnect(){
  if(net.source){ try{net.source.close()}catch(e){} }
  net.source=new EventSource('/events?room='+encodeURIComponent(net.room)+'&token='+encodeURIComponent(net.token));
  net.source.addEventListener('lobby',e=>{
    try{ net.view=JSON.parse(e.data); net.connected=true; net.err=''; if(page==='online') renderMenu() }catch(err){}
  });
  net.source.addEventListener('started',e=>{ try{ netStart(JSON.parse(e.data)) }catch(err){ console.error(err) } });
  net.source.addEventListener('snapshot',e=>{ try{ netApply(JSON.parse(e.data)) }catch(err){} });
  net.source.addEventListener('input',e=>{
    try{
      const d=JSON.parse(e.data), code=NETACT[d.action];
      if(!code||!net.held[d.slot]) return;
      if(d.down){ net.held[d.slot].add(code); net.pressed[d.slot].add(code) } else net.held[d.slot].delete(code);
    }catch(err){}
  });
  net.source.addEventListener('closed',()=>{ net.err='The host closed this room'; netReset(); if(page!=='online') setPage('online'); else renderMenu() });
  net.source.addEventListener('return-lobby',()=>{ net.active=false; if(page!=='online') setPage('online'); else renderMenu() });
  net.source.onerror=()=>{ net.connected=false; if(page==='online') renderMenu() };
}
async function netCreate(){
  net.err='';
  const name=((document.getElementById('netName')||{}).value||'').trim()||'Sorcerer';
  const j=await netPost('/api/create',{mode:net.mode,arenaIndex:arenaIdx,name,character:pick[0]});
  if(!j){ renderMenu(); return }
  net.room=j.room; net.token=j.token; net.slot=j.slot; net.host=true; net.name=name;
  netConnect(); renderMenu();
}
async function netJoin(){
  net.err='';
  const name=((document.getElementById('netName')||{}).value||'').trim()||'Sorcerer';
  const code=(((document.getElementById('netCode')||{}).value||'')).trim().toUpperCase();
  if(code.length<4){ net.err='Enter the six-character room code'; renderMenu(); return }
  const j=await netPost('/api/join',{room:code,name,character:pick[0]});
  if(!j){ renderMenu(); return }
  net.room=j.room; net.token=j.token; net.slot=j.slot; net.host=false; net.name=name;
  netConnect(); renderMenu();
}
async function netLeave(){
  if(net.room&&net.token) await netPost('/api/leave',netSession());
  netReset(); setPage('title');
}
function netStart(view){
  net.view=view;
  net.mode=view.mode===3?3:2;
  net.active=true; net.host=net.slot===0;
  for(let i=0;i<net.mode;i++) if(view.players&&view.players[i]) pick[i]=view.players[i].character;
  if(Number.isInteger(view.arenaIndex)&&view.arenaIndex>=0&&view.arenaIndex<ARENAS.length) arenaIdx=view.arenaIndex;
  mode=net.mode; net.sendT=0; net.busy=false; net.lastSnap=0;
  startMatch();
  announce('ONLINE MATCH',ARENAS[arenaIdx].name+' · '+mode+' FIGHTER'+(mode>1?'S':''),'#8fe6ff',2.2);
}
function netSendKey(code,down){
  const action=CODEACT[code];
  if(!action||!net.room||!net.token) return;
  fetch('/api/input',{method:'POST',headers:{'Content-Type':'application/json'},keepalive:true,
    body:JSON.stringify({room:net.room,token:net.token,action,down:!!down})}).catch(()=>{});
}
function netSnapshot(){
  return {
    t:Math.round(clock*100)/100,
    over:phase!=='fight'?1:0, w:winner,
    players:players.map(p=>({
      i:p.i,x:+p.x.toFixed(1),y:+p.y.toFixed(1),z:+p.z.toFixed(1),f:+p.face.toFixed(3),
      hp:Math.round(p.hp),mhp:p.maxHp,ce:Math.round(p.ce),aw:Math.round(p.aw),mom:Math.round(p.mom),
      ko:p.ko?1:0,g:p.guard?1:0,aa:+p.atkAnim.toFixed(3),ak:p.atkKind,ch:p.chain,
      st:+(p.stun||0).toFixed(2),hf:+(p.hitFlash||0).toFixed(2),od:+(p.overdriveT||0).toFixed(2),
      ut:+(p.ultT||0).toFixed(2),ul:+(p.ultPose||0).toFixed(2),ct:p.castType||'',
      sm:+(p.stormT||0).toFixed(2),zp:+(p.zephyrT||0).toFixed(2),cl:p.clones||0,
      tr:p.tri,ea:+(p.extraArmT||0).toFixed(2),sd:+(p.simpleT||0).toFixed(2),
      vb:+(p.vectorBarrierT||0).toFixed(2),sh:+(p.sharpenT||0).toFixed(2),
      ac:+(p.anchorT||0).toFixed(2),tt:+(p.tetherT||0).toFixed(2),bn:+(p.burn||0).toFixed(2),
      rg:+(p.resistT||0).toFixed(2),dt:+(p.domainTime||0).toFixed(2)
    })),
    projectiles:projectiles.map(s=>({x:Math.round(s.x),y:Math.round(s.y),z:Math.round(s.z),
      vx:Math.round(s.vx),vz:Math.round(s.vz),r:s.r,c:s.color,k:s.kind,o:s.over?1:0})),
    domain:domain?{t:domain.type,o:domain.owner.i,time:+domain.time.toFixed(2),total:domain.total,
      intro:+domain.intro.toFixed(2),win:+domain.window.toFixed(2)}:null,
    clash:clash?{ids:clash.ids,score:clash.score,time:+clash.time.toFixed(2),total:clash.total,
      intro:+clash.intro.toFixed(2)}:null,
    cinema:clash&&clash.cinema?{t:+clash.cinema.t.toFixed(2),dur:clash.cinema.dur,ids:clash.cinema.ids}:null
  };
}
function netPush(){
  if(!net.active||!net.host||net.busy||!net.room||!net.token) return;
  net.busy=true;
  netPost('/api/snapshot',netSession({state:netSnapshot()})).finally(()=>{net.busy=false});
}
function netHostTick(dt){
  net.sendT-=dt;
  if(net.sendT>0) return;
  net.sendT=0.05;
  netPush();
}
function netApply(s){
  if(!s||!Array.isArray(s.players)) return;
  const prevClash=clash;
  net.lastSnap=performance.now();
  if(typeof s.t==='number') clock=s.t;
  for(const sp of s.players){
    const p=players[sp.i]; if(!p) continue;
    p.nx=sp.x; p.ny=sp.y; p.nz=sp.z;
    p.face=sp.f; p.hp=sp.hp; p.maxHp=sp.mhp; p.ce=sp.ce; p.aw=sp.aw; p.mom=sp.mom;
    p.ko=!!sp.ko; p.guard=!!sp.g; p.atkAnim=sp.aa; p.atkKind=sp.ak; p.chain=sp.ch;
    p.stun=sp.st; p.hitFlash=sp.hf; p.overdriveT=sp.od; p.ultT=sp.ut; p.ultPose=sp.ul;
    p.castType=sp.ct; p.stormT=sp.sm; p.zephyrT=sp.zp; p.clones=sp.cl;
    p.tri=sp.tr; p.extraArmT=sp.ea; p.simpleT=sp.sd; p.vectorBarrierT=sp.vb;
    p.sharpenT=sp.sh; p.anchorT=sp.ac; p.tetherT=sp.tt; p.burn=sp.bn; p.resistT=sp.rg;
    p.domainTime=sp.dt;
    const want=Math.min(10,sp.cl||0);
    if(p.mirrors.length!==want){
      p.mirrors=[];
      for(let i=0;i<want;i++) p.mirrors.push({a:i/Math.max(1,want)*TAU,r:105+(i%2?24:0),life:7});
    }
  }
  projectiles.length=0;
  if(Array.isArray(s.projectiles)) for(const q of s.projectiles){
    projectiles.push({x:q.x,y:q.y,z:q.z,vx:q.vx,vy:0,vz:q.vz,r:q.r,color:q.c,kind:q.k,over:!!q.o,life:9,hit:[]});
  }
  domain=s.domain?{owner:players[s.domain.o],type:s.domain.t,time:s.domain.time,total:s.domain.total||10,
    intro:s.domain.intro,window:s.domain.win,started:0,tick:0,wager:null,locked:true}:null;
  clash=s.clash?{ids:s.clash.ids,score:s.clash.score,time:s.clash.time,total:s.clash.total||8.5,
    intro:s.clash.intro}:null;
  // The host decides when the three-way cutscene runs; guests replay it from
  // the snapshot clock so every screen shows the same beat at the same time.
  if(clash&&s.cinema) clash.cinema={t:s.cinema.t,dur:s.cinema.dur||threeWay.dur,ids:s.cinema.ids||clash.ids};
  // The host resolves the clash; the guest reads the same scores on the frame
  // the clash leaves the snapshot and shows the identical verdict card.
  if(!s.clash&&prevClash&&prevClash.ids&&prevClash.ids.length===2&&!s.over){
    let best=-1,bs=-1;
    for(const id of prevClash.ids){ if((prevClash.score[id]||0)>bs){bs=prevClash.score[id]||0;best=id} }
    spawnVerdict(prevClash.ids.map(i=>players[i]).filter(Boolean),best);
  }
  if(s.over){
    phase='menu'; page='result'; winner=typeof s.w==='number'?s.w:-1;
    net.active=false; renderMenu();
  }
}
// Guests do not simulate; they ease toward the last authoritative frame and
// keep the purely visual timers running so poses and auras animate smoothly.
function netTick(dt){
  for(const p of players){
    if(p.nx===undefined) continue;
    const a=1-Math.exp(-16*dt);
    const ox=p.x, oz=p.z;
    p.x+=(p.nx-p.x)*a; p.y+=(p.ny-p.y)*a; p.z+=(p.nz-p.z)*a;
    if(Math.hypot(p.x-ox,p.z-oz)>0.05) p.phase+=dt*9;
    p.atkAnim=Math.max(0,p.atkAnim-dt);
    p.ultT=Math.max(0,p.ultT-dt);
    p.ultPose=lerp(p.ultPose||0,p.ultT>0?1:0,1-Math.exp(-16*dt));
    p.hitFlash=Math.max(0,p.hitFlash-dt);
    p.overdriveT=Math.max(0,p.overdriveT-dt);
    p.stormT=Math.max(0,(p.stormT||0)-dt);
    p.zephyrT=Math.max(0,(p.zephyrT||0)-dt);
    p.simpleT=Math.max(0,(p.simpleT||0)-dt);
    p.vectorBarrierT=Math.max(0,(p.vectorBarrierT||0)-dt);
    p.sharpenT=Math.max(0,(p.sharpenT||0)-dt);
    p.anchorT=Math.max(0,(p.anchorT||0)-dt);
    p.extraArmT=Math.max(0,(p.extraArmT||0)-dt);
    p.tetherT=Math.max(0,(p.tetherT||0)-dt);
    for(const m of p.mirrors) m.a+=dt*0.85;
  }
  if(domain&&domain.intro>0) domain.intro=Math.max(0,domain.intro-dt);
  if(clash){ clash.intro=Math.max(0,clash.intro-dt); clash.time=Math.max(0,clash.time-dt) }
  if(clash&&clash.cinema) clash.cinema.t=Math.min(clash.cinema.dur,clash.cinema.t+dt);
  for(let i=bursts.length-1;i>=0;i--){ bursts[i].life-=dt; if(bursts[i].life<=0) bursts.splice(i,1) }
  for(let i=popups.length-1;i>=0;i--){ const q=popups[i]; q.life-=dt; q.y+=34*dt; if(q.life<=0) popups.splice(i,1) }
  for(let i=motes.length-1;i>=0;i--){ const m=motes[i]; m.life-=dt; if(m.life<=0) motes.splice(i,1) }
  if(domain&&domain.time>0) domain.time=Math.max(0,domain.time-dt);
}

        (mine?'<button class="hbtn" type="button" data-net="char">◈ '+ROSTER[mine.character].name+' ▶</button>':'')+
        '<button class="hbtn" type="button" data-net="ready">'+((mine&&mine.ready)?'UNREADY':'READY UP')+'</button>'+
        (net.host?'<button class="start" type="button" data-net="start"'+(allReady?'':' disabled style="opacity:.45;cursor:not-allowed"')+'>START MATCH ➜</button>':'')+
        '<button class="hbtn" type="button" data-net="leave">LEAVE</button></div></div>'+
      (net.host?'<div class="netrows" style="margin-top:10px">'+ARENAS.map((a,i)=>'<button class="hbtn" type="button" data-arena="'+i+'" style="text-align:left'+(arenaIdx===i?';border-color:#7de0ff':'')+'">◈ '+a.name+'</button>').join('')+'</div>':'');
  }
  return '<div class="selhead"><div><div class="eyebrow">3D ARENA / ONLINE ROOMS</div>'+
    '<h2>PLAY ACROSS <span>MACHINES.</span></h2>'+

    'Create a room, share the code, every fighter readies up.</p></div>'+

}
function netAction(t){
  const a=t.dataset.net;
  if(a==='create') netCreate();
  else if(a==='join') netJoin();
  else if(a==='ready'){
    const mine=net.view&&net.view.players?net.view.players[net.slot]:null;
    netPost('/api/ready',netSession({ready:!(mine&&mine.ready)})).then(j=>{ if(j) renderMenu() });
  }
  else if(a==='start') netPost('/api/start',netSession()).then(j=>{ if(!j) renderMenu() });
  else if(a==='char'){
    const mine=net.view&&net.view.players?net.view.players[net.slot]:null;
    const next=(((mine?mine.character:pick[0])+1)%ROSTER.length);
    netPost('/api/character',netSession({character:next})).then(()=>renderMenu());
  }
  else if(a==='size'){ net.mode=t.dataset.size==='3'?3:2; renderMenu() }
  else if(a==='leave') netLeave();
  else if(a==='back'){ netReset(); setPage('title') }
}

/* ============================================================
   PREVIEW (menu backdrop, same renderer)
   ============================================================ */
function previewLineup(){
  const out=[];
  const list=pick.slice(0,mode);
  for(let i=0;i<list.length;i++){
    const p=makePlayer(i,list[i]);
    const spread=list.length>1?165:0;
    p.x=(i-(list.length-1)/2)*spread;
    p.z=0;
    p.face=Math.sin(time*0.35+i)*0.22;
    p.phase=time*1.05+i;
    p.y=0;
    out.push(p);
  }
  return out;
}
function renderPreview(){
  const list=previewLineup();
  const stage=ARENAS[arenaIdx];
  const wide=page==='stage'||page==='help';
  const orbit=time*0.16;
  const dist=wide?1900:760;
  const eye={x:Math.sin(orbit)*dist,y:wide?760:210,z:Math.cos(orbit)*dist};
  const target={x:0,y:wide?150:108,z:0};
  const vp={x:0,y:0,w:W,h:H,cx:W*(wide?0.5:0.80),cy:H/2,focal:0,fov:0.9};
  vp.focal=(vp.h/2)/Math.tan(0.9/2);
  vp.cam=makeCam(eye,target,0.9);
  VP=vp;CAM=vp.cam;
  FACES=[];GLOWS=[];

  const sky=ctx.createLinearGradient(0,0,0,H*0.78);
  sky.addColorStop(0,stage.sky[0]);sky.addColorStop(0.55,stage.sky[1]);sky.addColorStop(1,stage.sky[2]);
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
  drawGround(vp,stage.sky,stage.floor,stage.grid);

  if(!wide){
    for(const p of list) drawFighter(p);
    const sh=ctx.createRadialGradient(W/2,H*0.66,10,W/2,H*0.7,H*0.5);
    sh.addColorStop(0,'#7fd8ff22');sh.addColorStop(1,'#00000000');
    ctx.fillStyle=sh;ctx.fillRect(0,0,W,H);
  }
  emitGeo(stage.geo);
  paintFaces(vp);
  drawGlows();
  drawMotes();
}

/* ============================================================
   FRAME
   ============================================================ */
function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);
  // the permanent control hint would sit on top of the manga panels
  if(tipEl) tipEl.style.opacity=cinemaOn()?'0':'';

  if(phase!=='fight'){
    renderPreview();
    return;
  }

  if(shake>0.4){
    ctx.save();
    ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  }
  if(cinemaManga()){
    // Two fighters get the single-page spread; three keep the triptych.
    if(clash.cinema&&clash.cinema.ids.length<3) drawDuelClash();
    else drawMangaClash();
    if(shake>0.4) ctx.restore();
    return;
  }
  const list=alive().length?alive():players;
  const sep=spread();
  // A Domain Clash is a shared cinematic beat: one shot, both barriers in
  // frame. Outside the clash the split respects each player's own camera.
  const wantSplit=!clash&&!(domain&&domain.intro>0)&&
    ((mode3d==='split')||(mode3d==='auto'&&sep>SPLIT_DIST&&players.length>1));
  const portrait=H>W;
  let layout;
  if(wantSplit&&players.length>1){
    if(players.length===2){
      layout=portrait
        ? [{x:0,y:0,w:W,h:H/2},{x:0,y:H/2,w:W,h:H/2}]
        : [{x:0,y:0,w:W/2,h:H},{x:W/2,y:0,w:W/2,h:H}];
    }else{
      layout=portrait
        ? [{x:0,y:0,w:W,h:H/3},{x:0,y:H/3,w:W,h:H/3},{x:0,y:2*H/3,w:W,h:H/3}]
        : [{x:0,y:0,w:W/2,h:H/2},{x:W/2,y:0,w:W/2,h:H/2},{x:0,y:H/2,w:W,h:H/2}];
    }
  }else{
    layout=[{x:0,y:0,w:W,h:H}];
  }

  for(let i=0;i<layout.length;i++){
    const pn=layout[i];
    const vp={x:pn.x,y:pn.y,w:pn.w,h:pn.h,cx:pn.x+pn.w/2,cy:pn.y+pn.h/2,focal:0,fov:0.86};
    vp.focal=(vp.h/2)/Math.tan(0.86/2);
    // Always frame this viewport's own fighter, even if the other one is KO'd.
    const focus=layout.length>1?[players[i]||players[0]]:list;
    vp.cam=smoothedCam(vp,focus,layout.length>1
      ? {pad:80,pitch:0.18,close:true}
      : {pad:24,pitch:0.30},i);
    renderScene(vp);
  }
  if(layout.length>1){
    ctx.save();
    ctx.font='900 8px Inter,system-ui,sans-serif';ctx.textAlign='left';
    for(let i=0;i<layout.length;i++){
      const pn=layout[i],pl=players[i];
      if(!pl) continue;
      ctx.fillStyle='#050b16cc';
      rr(pn.x+10,pn.y+pn.h-24,88,16,4);ctx.fill();
      ctx.fillStyle=PCOL[i];
      ctx.fillText('P'+(i+1)+' VIEW',pn.x+16,pn.y+pn.h-13);
    }
    ctx.restore();
  }
  if(layout.length>1){
    ctx.save();ctx.strokeStyle='#2f5a7a';ctx.lineWidth=2;
    for(const pn of layout) ctx.strokeRect(pn.x+0.5,pn.y+0.5,pn.w-1,pn.h-1);
    ctx.restore();
  }
  if(clash&&clash.cinema) drawCinemaOverlay();
  if(shake>0.4) ctx.restore();

  layoutCount=layout.length;
  drawHUD(layout);
  drawVerdict();
  if(domain&&domain.type===0&&!clash) drawWager();

  if(!cinemaOn()){
    ctx.save();
    ctx.font='900 9px Inter,system-ui,sans-serif';
    ctx.fillStyle='#6fd4ff';ctx.textAlign='right';ctx.textBaseline='alphabetic';
    const where=domain?('DOMAIN · '+domain.owner.cfg.domain.name):ARENAS[arenaIdx].name;
    ctx.fillText((layout.length>1?'SPLIT CAMERA':'SHARED CAMERA')+' · '+where,W-14,H-118);
    ctx.restore();
  }
}

(function applyURL(){
  try{
    const q=new URLSearchParams(location.search);
    const rawMode=q.get('mode');
    const m=rawMode===null?NaN:Number(rawMode);
    if(m===2||m===3) mode=m;
    for(let i=0;i<3;i++){
      const raw=q.get('p'+(i+1));
      const v=raw===null?NaN:Number(raw);
      if(Number.isInteger(v)&&v>=0&&v<ROSTER.length) pick[i]=v;
    }
    const rawArena=q.get('arena');
    const a=rawArena===null?NaN:Number(rawArena);
    if(Number.isInteger(a)&&a>=0&&a<ARENAS.length) arenaIdx=a;
  }catch(e){}
})();

renderMenu();
let last=performance.now();
function loop(now){
  let dt=(now-last)/1000; last=now;
  if(dt>0.06) dt=0.06;
  time+=dt;
  if(phase==='fight'&&!paused){
    if(net.active&&!net.host) netTick(dt);
    else { update(dt); if(net.active&&net.host) netHostTick(dt) }
  }
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

})();
