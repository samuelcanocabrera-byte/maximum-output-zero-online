      if(t===p||t.ko) continue;
      const dx=t.x-p.x,dz=t.z-p.z,dl=Math.hypot(dx,dz)||1;
      addProjectile({x:p.x+fx*40,y:p.y+104,z:p.z+fz*40,vx:dx/dl*900,vz:dz/dl*900,
        owner:p,dmg:67,knock:660,color:'#ffe9a8',kind:'card',life:2,r:26,pierce:true});
    }
    p.armorT=Math.max(p.armorT,2.3);
  }else if(p.kind===1){
    p.mom=200; p.overdriveT=8; p.ultT=2.4; p.invuln=Math.max(p.invuln,0.4);
    for(const t of players) if(t!==p&&!t.ko&&Math.hypot(t.x-p.x,t.z-p.z)<360) hurt(t,p,30*dmgMul(p),{knock:520,launch:180,stun:0.35});
    popupAt(p.x,p.y+180,p.z,'HARI BLUE · OVERDRIVE','#eaffff',14);
    ringBurst(p.x,8,p.z,'#d8f8ff',2.6); sparks(p.x,p.y+100,p.z,'#eaffff',22,340);
  }else if(p.kind===2){
    for(const t of players) if(t!==p&&!t.ko){ hurt(t,p,66*dmgMul(p),{knock:700,stun:0.7,sure:true}); burstBeam(p,t) }
  }else if(p.kind===3){
    p.stormT=3.4; p.stormTick=0.2; p.ultT=2.6;
    for(const t of players) if(t!==p&&!t.ko){ hurt(t,p,56*dmgMul(p),{knock:560,sure:true}); burstBeam(p,t) }
    p.armorT=Math.max(p.armorT,2);
    popupAt(p.x,p.y+180,p.z,'CRYSTAL STORM · TRIANGULATION','#a5f4ff',14);
  }else if(p.kind===4){
    for(const t of players) if(t!==p&&!t.ko){ hurt(t,p,70*dmgMul(p),{knock:680,sure:true}); burstBeam(p,t) }
  }else{
    p.zephyrT=6; p.ultT=2.4;
    for(const t of players) if(t!==p&&!t.ko){ hurt(t,p,44*dmgMul(p),{knock:520,stun:0.5,sure:true}); burstBeam(p,t) }
    popupAt(p.x,p.y+180,p.z,'ZEPHYR · CONTACT WINDOW','#e8daff',14);
    ringBurst(p.x,8,p.z,'#e8daff',2.4);
  }
}
function burstBeam(a,b){
  bursts.push({kind:'beam2',x:a.x,y:a.y+110,z:a.z,x2:b.x,y2:b.y+100,z2:b.z,
    color:a.cfg.accent,life:0.34,max:0.34});
}

function healOrReversal(p){
  if(p.ko||p.stun>0||p.burn>0||p.healLock>0) return;
  const k=keysFor(p);
  if(keyHeld(p,k.down)){
    if(p.ce<36){ popupAt(p.x,p.y+160,p.z,'NOT ENOUGH CE','#ffc0d2',11); return }
    p.ce-=36; p.healLock=0.7; p.ultT=0.35;
    popupAt(p.x,p.y+172,p.z,'CURSED TECHNIQUE REVERSAL',p.cfg.accent,13);
    ringBurst(p.x,8,p.z,p.cfg.accent,1.5);
    for(const t of players){
      if(t===p||t.ko) continue;
      if(Math.hypot(t.x-p.x,t.z-p.z)<300) hurt(t,p,18*dmgMul(p),{knock:320,stun:0.3});
    }
    shake=Math.max(shake,9);
  }else{
    if(p.hp>=p.maxHp){ popupAt(p.x,p.y+160,p.z,'ALREADY WHOLE','#bcd6ea',11); return }
    if(p.ce<30){ popupAt(p.x,p.y+160,p.z,'NOT ENOUGH CE','#ffc0d2',11); return }
    sfx('heal');
    p.ce-=30; p.hp=Math.min(p.maxHp,p.hp+20); p.healLock=0.6;
    popupAt(p.x,p.y+160,p.z,'+20 REVERSE CURSED TECHNIQUE','#9dffcb',13);
    sparks(p.x,p.y+90,p.z,'#9dffcb',12,120);
  }
}

function simpleDomain(p){
  if(p.ko||p.simpleCd>0||p.simpleT>0) return;
  if(p.ce<24){ popupAt(p.x,p.y+160,p.z,'NOT ENOUGH CE','#ffc0d2',11); return }
  p.ce-=24; p.simpleT=3.3; p.simpleCd=9.5;
  popupAt(p.x,p.y+178,p.z,'SIMPLE DOMAIN','#bdefff',14);
  ringBurst(p.x,8,p.z,'#bdefff',0.9);
}

/* ---------- Domain / clash ---------- */
function domainLife3D(kind){ return kind===0?60:kind===1?13:kind===2?11:kind===3?11:kind===4?12:12 }
function wagerStakes3D(){
  return [
    {id:'health',name:'ENDURANCE',desc:'-22 HP',valid:()=>players.filter(p=>!p.ko).every(p=>p.hp>23)},
    {id:'ce',name:'CURSED ENERGY',desc:'-26 CE',valid:()=>players.filter(p=>!p.ko).every(p=>p.ce>=26)},
    {id:'awakening',name:'AWAKENING',desc:'-22 AW',valid:()=>players.filter(p=>!p.ko).every(p=>p.aw>=22)},
    {id:'technique',name:'TECHNIQUE ACCESS',desc:'SEAL TECHNIQUE',valid:()=>true},
    {id:'mobility',name:'MOBILITY',desc:'IMPAIR MOVEMENT',valid:()=>true}];
}
function expandDomain(p){
  if(p.ko||p.stun>0) return;
  // A decided clash seals every Domain that fought in it until the surviving
  // barrier is gone: you cannot answer a clash with another Domain on the
  // frame it ends. After that the bar is simply your Awakening again.
  if((p.domainLock||0)>0){
    popupAt(p.x,p.y+172,p.z,'DOMAIN RECOVERING · AWAKENING SPENT','#f4c1df',11);
    return;
  }
  // one Domain object per caster per activation: a repeat press during the
  // opening beat can no longer spawn a second environment
  if(domain&&domain.owner===p&&domain.started<0.5) return;
  if(clash){ joinClash(p); return }
  if(domain){
    if(domain.window>0&&p!==domain.owner) joinClash(p);
    else popupAt(p.x,p.y+170,p.z,'A DOMAIN IS ALREADY OPEN','#f4c1df',11);
    return;
  }
  if(p.aw<100||p.ce<35){
    popupAt(p.x,p.y+172,p.z,p.aw<100?'DOMAIN NEEDS 100 AWAKENING':'DOMAIN NEEDS 35 CE','#f4c1df',11);
    return;
  }
  sfx('domain');
  const life=domainLife3D(p.kind);
  // Opening a Domain empties both meters: Awakening and cursed energy have to
  // be earned back before another expansion is even possible.
  p.aw=0; p.ce=0; p.domainTime=life; p.domainCastAt=time;
  domain={owner:p,type:p.kind,time:life,total:life,intro:2.2,window:2.7,tick:0,started:0,
    wager:{step:0,stakeIdx:0,phase:'choose',timer:0,spin:0,win:null,stake:null,results:[]},stakes:wagerStakes3D()};
  shake=Math.max(shake,16); flash=0.55; camKick=1;
  ann.t=0; // the Domain banner is the single presentation for activation
  ringBurst(p.x,8,p.z,p.cfg.accent,2.2); sparks(p.x,p.y+110,p.z,p.cfg.accent,30,380);
}
function joinClash(p){
  if(!domain||p===domain.owner||p.ko) return;
  if(p.aw<35||p.ce<28){
    popupAt(p.x,p.y+172,p.z,'CLASH NEEDS 35 AW + 28 CE','#f4c1df',11);
    return;
  }
  if(clash&&clash.ids.includes(p.i)) return;
  if(clash&&clash.time<2.4) return;
  p.aw-=35; p.ce-=28; p.domainCastAt=time;
  if(!clash){
    clash={ids:[domain.owner.i,p.i],score:{},time:8.5,total:8.5,intro:1.4};
    clash.score[domain.owner.i]=0; clash.score[p.i]=0;
    // A two-fighter clash opens on one manga page: two close-ups, the blade of
    // light between them and the hands of the Domain sign in front.
    if(players.length===2){
      clash.cinema={t:0,dur:duel.manga,ids:[domain.owner.i,p.i]};
      clash.intro=Math.min(clash.intro,0.9);
      sfx('domain');
    }
  }else{
    clash.ids.push(p.i); clash.score[p.i]=0;
  }
  domain.window=0; domain.intro=0;
  shake=Math.max(shake,14); flash=0.5;
  announce('DOMAIN CLASH',ROSTER[pick[p.i]].name+' CHALLENGES THE BARRIER','#ffd6f2',2.2);
  maybeThreeWayClash();
}

/* ---------- SECRET: THREE-WAY DOMAIN CLASH (SENDAI) ----------
   When every living fighter opens a Domain inside the same 1.6-second beat,
   the three worlds are shown colliding in one shared cutscene. This is
   presentation only: the clash scores, clash.time and endClash() still decide
   the outcome, and a two-fighter clash can never enter this path. */
const threeWay={window:1.6,manga:2.0,dur:6.9};
// The two-fighter clash gets the single-page manga beat from the reference.
const duel={manga:2.0};
function maybeThreeWayClash(){
  if(!clash||clash.cinema||clash.ids.length<3||players.length<3) return;
  if(!domain||!domain.owner||domain.owner.ko) return;
  const group=clash.ids.map(i=>players[i]).filter(Boolean);
  if(group.length<3||group.some(p=>p.ko)) return;
  const stamps=group.map(p=>p.domainCastAt);
  if(stamps.some(v=>!(v>=0))) return;
  if(Math.max(...stamps)-Math.min(...stamps)>threeWay.window) return;
  clash.cinema={t:0,dur:threeWay.dur,ids:clash.ids.slice(),who:group.map(p=>p.i)};
  clash.intro=Math.min(clash.intro,0.7);
  shake=Math.max(shake,24); flash=0.7; camKick=1;
  for(const p of group){
    ringBurst(p.x,8,p.z,p.cfg.domain.accent,2.4);
    sparks(p.x,p.y+110,p.z,p.cfg.domain.accent,16,300);
  }
  // No banner: the cutscene itself carries the moment. The rest of the game
  // keeps its normal announcer for every other beat.
  ann.t=0;
  sfx('domain');
}
function cinemaOn(){
  return !!(clash&&clash.cinema&&clash.cinema.t<clash.cinema.dur);
}
// The opening beat is a manga triptych: three vertical close-ups that push in
// on each caster's face before the domains hit the arena.
function cinemaManga(){
  return !!(clash&&clash.cinema&&clash.cinema.t<threeWay.manga);
}
function cinemaCore(){
  if(!clash||!clash.cinema) return null;
  const group=clash.cinema.ids.map(i=>players[i]).filter(Boolean);
  if(group.length<3) return null;
  let x=0,z=0;
  for(const p of group){x+=p.x;z+=p.z}
  // the collision hangs above the casters so bodies never hide the focal point
  return {group,x:x/group.length,z:z/group.length,y:275};
}

function endClash(){
  if(!clash) return;
  let best=-1,bs=-1;
  for(const id of clash.ids){ if((clash.score[id]||0)>bs){bs=clash.score[id]||0;best=id} }
  const winner=players[best];
  // Two barriers can cancel: if the damage is level (or the lead is inside the
  // noise) neither world takes the field. No Domain opens, the original barrier
  // collapses, and every caster is left in burnout.
  {
    const rank=[...clash.ids].sort((x,y)=>(clash.score[y]||0)-(clash.score[x]||0));
    const top=clash.score[rank[0]]||0, second=rank.length>1?(clash.score[rank[1]]||0):0;
    const decided=rank.length>1 && top>0 && (top-second)>=Math.max(4,top*0.10);
    if(!decided){
      const ids=[...clash.ids];
      clash=null; domain=null; verdict=null; projectiles.length=0;
      shake=Math.max(shake,26); flash=0.6;
      for(const id of ids){
        const p=players[id]; if(!p||p.ko) continue;
        p.aw=0; p.ce=0; p.burnout=2.9; p.domainTime=0; p.overdriveT=0;
        p.stun=Math.max(p.stun,0.75); p.domainLock=Math.max(p.domainLock||0,7);
        popupAt(p.x,p.y+150,p.z,'BURN OUT','#ffc2c2',14);
      }
      announce('NO DOMAIN','BOTH BARRIERS CANCEL · CASTERS BURN OUT','#ffd6cc',2.7);
      return;
    }
  }
  for(const id of clash.ids){
    if(id===best) continue;
    const t=players[id];
    if(t&&!t.ko){
      t.hp=Math.max(0,t.hp-22);
      popupAt(t.x,t.y+150,t.z,'-22 BARRIER BROKEN','#ffb3c6',13);
      if(t.hp<=0) ko(t,winner);
    }
  }
  // The barrier that survives is the winner's — not the first one opened.
  // Previously the original caster kept the Domain even when they lost the
  // clash, so a rival who expanded second and won still fought inside the
  // first player's world.
  if(domain&&winner&&domain.owner!==winner){
    const life=Math.min(domainLife3D(winner.kind),9);
    domain.owner=winner; domain.type=winner.kind;
    domain.time=life; domain.total=life;
    domain.intro=1.8; domain.started=0; domain.tick=0; domain.window=0;
    domain.locked=true;
    if(winner.kind===0){
      domain.wager={step:0,stakeIdx:0,phase:'choose',timer:0,spin:0,win:null,stake:null,results:[]};
      domain.stakes=wagerStakes3D();
    }
    winner.overdriveT=Math.max(winner.overdriveT||0,0);
  }else if(domain){
    domain.time=Math.max(domain.time,6.5);
    domain.locked=true;
  }
  // A settled clash costs every participant both meters, winner included: the
  // losing side has to climb back to 100 Awakening before it can answer, and
  // the seal below keeps anyone from re-expanding while the barrier stands.
  const lockTime=domain?Math.max(4,domain.time+1.5):6;
  for(const id of clash.ids){
    const p=players[id]; if(!p) continue;
    p.aw=0; p.ce=0;
    p.domainLock=Math.max(p.domainLock||0,lockTime);
    p.domainTime=p.i===best&&domain?(domain.time):0;
  }
  announce('DOMAIN CLASH RESOLVED',(winner?winner.cfg.name:'NO ONE')+' HOLDS THE BARRIER',
    winner?winner.cfg.accent:'#fff',2.4);
  if(domain&&winner&&domain.owner===winner) announce('DOMAIN EXPANSION',winner.cfg.domain.name,winner.cfg.accent,2.2);
  shake=Math.max(shake,18); flash=0.5;
  // Two-fighter clashes end on a pairing-specific verdict card, so Jin vs
  // Arata and Jin vs Shirogane never resolve the same way.
  if(clash.ids.length===2) spawnVerdict(clash.ids.map(i=>players[i]).filter(Boolean),best);
  clash=null;
}

function updateDomainRules(dt){
  const d=domain; if(!d) return;
  const o=d.owner; if(!o||o.ko) return;
  d.started+=dt; d.tick=(d.tick||0)+dt;
  const pressure=clamp(d.started/Math.max(1,d.total),0,1);
  if(d.type===0){ updateWager3D(dt); return }
  if(d.type===1){
    o.mom=200;
    for(const t of players){ if(t===o||t.ko||t.simpleT>0) continue; t.domainSlow=0.82 }
    if(d.tick>0.64){ d.tick=0;
      for(const t of players) if(t!==o&&!t.ko&&t.simpleT<=0){
        hurt(t,o,Math.round(6+pressure*6),{knock:120,sure:true,stun:0.12});
        ringBurst(t.x,8,t.z,'#b9e6ff',0.9);
      }
      popupAt(o.x,o.y+172,o.z,'200% · OPTIMAL PATH','#97e8ff',12);
    }
  }else if(d.type===2){
    if(d.tick>0.6){ d.tick=0; const rays=2+Math.floor(pressure*2);
      for(const t of players) if(t!==o&&!t.ko&&t.simpleT<=0){
        for(let i=0;i<rays;i++) bursts.push({kind:'beam2',x:o.x+Math.sin(i*2.1+pressure)*260,y:o.y+110+Math.cos(i*1.7)*60,z:o.z+Math.cos(i*2.3)*260,x2:t.x,y2:t.y+100,z2:t.z,color:i%2?'#c8b8ff':'#eaffff',life:0.36,max:0.36});
        hurt(t,o,Math.round(5+pressure*4),{knock:90,sure:true,stun:0.1});
      }
    }
  }else if(d.type===3){
    if(d.tick>0.68){ d.tick=0;
      for(const t of players) if(t!==o&&!t.ko&&t.simpleT<=0){ hurt(t,o,10,{knock:70,sure:true,stun:0.1}); ringBurst(t.x,8,t.z,'#81e9ff',1.0) }
    }
  }else if(d.type===4){
    if(d.tick>0.55){ d.tick=0;
      for(const t of players) if(t!==o&&!t.ko&&t.simpleT<=0){ hurt(t,o,10,{knock:95,sure:true,stun:0.12}); t.vx*=-0.35; t.vz*=-0.35 }
    }
  }else{
    if(d.tick>0.7){ d.tick=0;
      for(const t of players) if(t!==o&&!t.ko&&t.simpleT<=0){
        t.ce=Math.max(0,t.ce-(10+8*pressure));
        t.ceRegenBlock=1.0; t.domainSlow=Math.max(t.domainSlow||0,0.88);
        popupAt(t.x,t.y+160,t.z,'ATMOSPHERIC PRESSURE',o.cfg.accent,11);
      }
    }
  }
}

function updateWager3D(dt){
  const d=domain,o=d.owner,w=d.wager; if(!d||d.type!==0||!w) return;
  if(!d.stakes) d.stakes=wagerStakes3D();
  const k=keysFor(o);
  if(w.phase==='choose'){
    if(keyPressed(o,k.left)) w.stakeIdx=(w.stakeIdx+4)%5;
    if(keyPressed(o,k.right)) w.stakeIdx=(w.stakeIdx+1)%5;
    if(keyPressed(o,k.atk)||keyPressed(o,k.domain)) confirmWager3D();
  }else if(w.phase==='spin'){
    w.timer-=dt; w.spin=clamp(1-w.timer/1.5,0,1);
    if(w.timer<=0) applyWager3D();
  }else if(w.phase==='result'){
    w.timer-=dt;
    if(w.timer<=0){
      if(w.step>=5){ finishWager3D(); return }
      w.phase='choose'; w.win=null; w.timer=0; w.stakeIdx=(w.stakeIdx+1)%5;
    }
  }
}
function confirmWager3D(){
  const d=domain,w=d.wager,st=d.stakes[w.stakeIdx];
  if(!st.valid()){ popupAt(d.owner.x,d.owner.y+184,d.owner.z,'EVERY FIGHTER MUST POSSESS THAT STAKE','#ffb1bc',12); return }
  w.stake=st; w.phase='spin'; w.timer=1.5; w.win=Math.random()<0.90;
  announce('WAGER '+(w.step+1)+'/5',st.name+' // 90% HOUSE · 10% CHALLENGERS','#ffe0aa',1.2);
  sfx('domain');
}
function applyWager3D(){
  const d=domain,w=d.wager,o=d.owner,st=w.stake,win=w.win;
  const losers=win?players.filter(p=>p!==o&&!p.ko):[o];
  for(const t of losers){
    if(st.id==='health') t.hp=Math.max(1,t.hp-22);
    else if(st.id==='ce') t.ce=Math.max(0,t.ce-26);
    else if(st.id==='awakening') t.aw=Math.max(0,t.aw-22);
    else if(st.id==='technique') t.queuedSeal=(t.queuedSeal||0)+5;
    else if(st.id==='mobility') t.queuedSlow=(t.queuedSlow||0)+5;
    popupAt(t.x,t.y+150,t.z,'FORFEIT: '+st.name,'#ffadac',13);
    sparks(t.x,t.y+100,t.z,'#ebc78e',14,180);
  }
  w.step++; w.phase='result'; w.timer=1.8; w.results.push({stake:st.id,win});
  announce('WAGER '+w.step+' / 5',win?'HOUSE WINS · CHALLENGERS PAY':'CHALLENGERS WIN · HOUSE PAYS',1.5,win?'#ffe0b4':'#a0e7ff');
  shake=Math.max(shake,9);
}
function finishWager3D(){
  for(const p of players){
    if(p.queuedSeal>0){ p.burn=Math.max(p.burn,p.queuedSeal); p.queuedSeal=0 }
    if(p.queuedSlow>0){ p.slowLock=Math.max(p.slowLock,p.queuedSlow); p.queuedSlow=0 }
  }
  domain=null; ann.t=0;
  announce('FATED MISFORTUNE ENDS','FIVE WAGERS · THE TABLE IS CLOSED','#f3dca7',1.9);
}

/* ---------- update ---------- */
function update(dt){
  if(hitStop>0){ hitStop-=dt; dt*=0.28 }
  dt=Math.min(dt,0.05);
  shake*=Math.exp(-6*dt); if(shake<0.2)shake=0;
  flash=Math.max(0,flash-dt*1.8);
  camKick=Math.max(0,camKick-dt*0.9);
  comboT=Math.max(0,comboT-dt);
  if(comboT<=0) for(const p of players) p.comboHits=0;
  if(ann.t>0) ann.t-=dt;
  if(verdict){ verdict.t+=dt; if(verdict.t>=verdict.dur) verdict=null }

  // Three-way cutscene: hold the whole simulation while the domains collide.
  // No timer, cooldown, score or HP changes during the beat, so the clash
  // resumes with the exact state it entered with and nothing can get stuck.
  if(cinemaOn()){
    const c=clash.cinema;
    c.t+=dt;
    // Two-fighter page: no collision core, no three-way flashes — just the
    // manga beat, then a white cut straight into the clash.
    if(c.ids.length<3){
      if(!c.mangaDone&&c.t>=c.dur){ c.mangaDone=1; flash=0.85; shake=Math.max(shake,22); sfx('domain') }
      shake=Math.max(shake,3+Math.abs(Math.sin(c.t*6.4))*6);
      pressed.clear();
      for(const s of net.pressed) s.clear();
      return;
    }
    if(!c.mangaDone&&c.t>=threeWay.manga){ c.mangaDone=1; flash=0.9; shake=Math.max(shake,26); sfx('domain') }
    if(!c.flashed&&c.t>=threeWay.manga+1.3){ c.flashed=1; flash=0.9; shake=Math.max(shake,24); sfx('domain') }
    shake=Math.max(shake,3.2+Math.abs(Math.sin(c.t*7.5))*7.5);
    const core=cinemaCore();
    if(core){
      c.fx=(c.fx||0)-dt;
      if(c.fx<=0){
        c.fx=0.055;
        const g=core.group;
        for(let k=0;k<3;k++){
          const p=g[k%g.length], a=Math.random()*TAU;
          motes.push({x:core.x+Math.cos(a)*520,y:20+Math.random()*260,z:core.z+Math.sin(a)*520,
            vx:-Math.cos(a)*(70+Math.random()*110),vy:40+Math.random()*90,vz:-Math.sin(a)*(70+Math.random()*110),
            life:0.5+Math.random()*0.5,max:1,color:p.cfg.domain.accent,r:1.6+Math.random()*2.4});
        }
      }
    }
    for(let i=bursts.length-1;i>=0;i--){ bursts[i].life-=dt; if(bursts[i].life<=0) bursts.splice(i,1) }
    for(let i=popups.length-1;i>=0;i--){ const q=popups[i]; q.life-=dt; q.y+=20*dt; if(q.life<=0) popups.splice(i,1) }
    for(let i=motes.length-1;i>=0;i--){ const m=motes[i]; m.x+=m.vx*dt; m.y+=m.vy*dt; m.z+=m.vz*dt;
      m.vy-=340*dt; m.vx*=Math.exp(-1.1*dt); m.vz*=Math.exp(-1.1*dt); m.life-=dt; if(m.life<=0) motes.splice(i,1) }
    pressed.clear();
    for(const s of net.pressed) s.clear();
    return;
  }

  if(domain){
    domain.time-=dt;
    if(domain.intro>0) domain.intro-=dt;
    if(domain.window>0) domain.window-=dt;
    if(domain.time<=0||domain.owner.ko){
      if(clash) endClash();
      domain=null;
    }
  }
  if(clash){
    clash.time-=dt;
    if(clash.intro>0) clash.intro-=dt;
    if(clash.time<=0) endClash();
  }
  if(clash){
    clash.fx=(clash.fx||0)-dt;
    if(clash.fx<=0) {
      clash.fx=0.09;
      const cs=clashState();
      if(cs) for(let i=0;i<2;i++){
        const t=(Math.random()-0.5)*1700;
        motes.push({x:cs.mx+cs.px*t,y:35+Math.random()*280,z:cs.mz+cs.pz*t,
          vx:(Math.random()-0.5)*70,vy:55+Math.random()*130,vz:(Math.random()-0.5)*70,
          life:0.45+Math.random()*0.45,max:0.9,
          color:Math.random()<0.5?cs.a.cfg.accent:cs.b.cfg.accent,r:2+Math.random()*2.2});
      }
    }
  }

  for(const p of players){
    if(p.ko){ p.koT+=dt; p.vx*=Math.exp(-4*dt); p.vz*=Math.exp(-4*dt);
      p.y=Math.max(0,p.y+p.vy*dt); p.vy+=GRAVITY*dt; if(p.y<=0){p.y=0;p.vy=0}
      continue }
    const k=keysFor(p);
    const peace=!!(domain&&domain.type===0&&!clash);
    const ax=peace?0:((keyHeld(p,k.right)?1:0)-(keyHeld(p,k.left)?1:0));
    const az=peace?0:((keyHeld(p,k.down)?1:0)-(keyHeld(p,k.up)?1:0));
    const guarding=peace?false:keyHeld(p,k.guard);
    if(guarding&&!p.guard) p.guardT=0;
    p.guard=guarding;
    if(p.guard){ p.guardT+=dt; p.parryT=Math.max(0,0.19-p.guardT) } else { p.guardT=0; p.parryT=0 }

    let speed=peace?0:(p.guard?92:p.cfg.spd);
    if(p.simpleT>0) speed*=0.8;
    if(p.slow<1) speed*=p.slow;
    if(p.domainSlow>0) speed*=p.domainSlow;
    if(p.burn>0) speed*=0.9;
    if(p.slowLock>0) speed*=0.72;
    if(p.stun>0){ speed=0; p.stun-=dt }
    if(p.dashT>0){ speed=1050; p.dashT-=dt }
    const acc=p.dashT>0?26:13;
    p.vx=lerp(p.vx,ax*speed,1-Math.exp(-acc*dt));
    p.vz=lerp(p.vz,az*speed,1-Math.exp(-acc*dt));

    if((ax||az)&&!p.guard&&p.stun<=0) p.phase+=dt*9;
    // Always square up to the nearest rival. Turning with the movement stick
    // used to point the fighter's back at the opponent mid-combo.
    if(p.stun<=0){
      const n=nearest(p);
      let want=null, rate=6;
      if(n&&Math.hypot(n.x-p.x,n.z-p.z)<1500){ want=Math.atan2(n.x-p.x,n.z-p.z); rate=11 }
      else if(ax||az){ want=Math.atan2(ax,az); rate=6 }
      if(want!==null){
        let d=want-p.face; while(d>Math.PI)d-=TAU; while(d<-Math.PI)d+=TAU;
        p.face+=d*Math.min(1,dt*rate);
      }
    }

    if(!peace&&keyPressed(p,k.jump)&&p.y<=2&&p.stun<=0){ p.vy=740; sparks(p.x,p.y+8,p.z,p.cfg.accent,4,70) }
    if(!peace&&keyPressed(p,k.atk)) strike(p);
    if(!peace&&keyPressed(p,k.tech)) technique(p);
    if(!peace&&keyPressed(p,k.cycle)) cycleMove(p);
    if(!peace&&keyPressed(p,k.dash)) dash(p);
    if(!peace&&keyPressed(p,k.heal)) healOrReversal(p);
    if(!peace&&keyPressed(p,k.ult)) ultimate(p);
    // Jin's wager Domain freezes movement, but its response window must still
    // accept a rival's Domain press — otherwise the first caster could never
    // be challenged while the wager rules are up.
    const canDomain=!peace||(domain&&domain.type===0&&domain.window>0&&p!==domain.owner);
    if(canDomain&&keyPressed(p,k.domain)){
      if(keyHeld(p,k.guard)) simpleDomain(p); else expandDomain(p);
    }
    if(!peace&&keyPressed(p,k.emote)&&p.emoteT<=0){
      const pool=['…','!','?!','✦','♠','↑','?','♪','✕'];
      p.emote=pool[Math.floor(Math.random()*pool.length)]; p.emoteT=1.7;
    }

    p.x+=p.vx*dt; p.z+=p.vz*dt;
    p.vy+=GRAVITY*dt; p.y+=p.vy*dt;
    if(p.y<0){p.y=0;p.vy=0}
    const lim=ARENA-70;
    if(p.x<-lim){p.x=-lim;p.vx*=-0.3}
    if(p.x> lim){p.x= lim;p.vx*=-0.3}
    if(p.z<-lim){p.z=-lim;p.vz*=-0.3}
    if(p.z> lim){p.z= lim;p.vz*=-0.3}

    p.atkCd=Math.max(0,p.atkCd-dt);
    p.atkAnim=Math.max(0,p.atkAnim-dt);
    p.dashCd=Math.max(0,p.dashCd-dt);
    p.hitFlash=Math.max(0,p.hitFlash-dt);
    p.invuln=Math.max(0,p.invuln-dt);
    p.counterT=Math.max(0,p.counterT-dt);
    p.chainT=Math.max(0,p.chainT-dt);
    p.simpleT=Math.max(0,p.simpleT-dt);
    p.simpleCd=Math.max(0,p.simpleCd-dt);
    p.armorT=Math.max(0,p.armorT-dt);
    p.resistT=Math.max(0,p.resistT-dt);
    p.extraArmT=Math.max(0,p.extraArmT-dt);
    p.vectorBarrierT=Math.max(0,p.vectorBarrierT-dt);
    p.sharpenT=Math.max(0,p.sharpenT-dt);
    p.anchorT=Math.max(0,p.anchorT-dt);
    p.windGuardT=Math.max(0,p.windGuardT-dt);
    const hadOver=p.overdriveT>0;
    p.overdriveT=Math.max(0,p.overdriveT-dt);
    if(hadOver&&p.overdriveT<=0) popupAt(p.x,p.y+168,p.z,'OVERDRIVE ENDS','#9fd8ff',12);
    p.ultPose=lerp(p.ultPose||0,p.ultT>0?1:0,1-Math.exp(-16*dt));
    for(let mi=p.mirrors.length-1;mi>=0;mi--){ const mm=p.mirrors[mi]; mm.life-=dt; mm.a+=dt*0.85; if(mm.life<=0) p.mirrors.splice(mi,1) }
    if(p.mirrors.length>p.clones) p.mirrors.length=p.clones;
    p.mirrorT=Math.max(0,p.mirrorT-dt); if(p.mirrorT<=0) p.mirrors.length=0;
    if(p.stormT>0){
      p.stormT-=dt; p.stormTick-=dt;
      if(p.stormTick<=0){
        p.stormTick=0.42;
        for(const t of players) if(t!==p&&!t.ko&&Math.hypot(t.x-p.x,t.z-p.z)<720) hurt(t,p,12*dmgMul(p),{knock:260,stun:0.16,sure:true});
        ringBurst(p.x,8,p.z,'#8ff0ff',1.3); sparks(p.x,p.y+90,p.z,'#8ff0ff',9,190);
      }
      if(p.stormT<=0) popupAt(p.x,p.y+168,p.z,'CRYSTAL STORM ENDS','#a5f4ff',12);
    }
    p.burn=Math.max(0,p.burn-dt);
    p.ultT=Math.max(0,p.ultT-dt);
    p.healLock=Math.max(0,p.healLock-dt);
    p.cloneT=Math.max(0,p.cloneT-dt);
    if(p.cloneT<=0) p.clones=0;
    p.emoteT=Math.max(0,p.emoteT-dt);
    p.cardT=Math.max(0,p.cardT-dt);
    if(p.cardCd) for(const ck in p.cardCd) p.cardCd[ck]=Math.max(0,p.cardCd[ck]-dt);
    if(p.domainTime>0){ p.domainTime-=dt; if(p.domainTime<=0)p.domainTime=0 }
    p.slow=1; p.domainSlow=0;
    p.tetherT=Math.max(0,(p.tetherT||0)-dt);
    if(p.tetherT>0) p.domainSlow=Math.max(p.domainSlow||0,0.80);
    p.sealed=Math.max(0,(p.sealed||0)-dt); p.slowLock=Math.max(0,(p.slowLock||0)-dt); p.zephyrT=Math.max(0,(p.zephyrT||0)-dt);
    p.domainLock=Math.max(0,(p.domainLock||0)-dt);
    p.burnout=Math.max(0,(p.burnout||0)-dt);
    if(p.ceRegenBlock>0) p.ceRegenBlock=Math.max(0,p.ceRegenBlock-dt);
    else p.ce=Math.min(100,p.ce+dt*(p.burnout>0?0.35:1)*(p.domainTime>0?15:p.cfg.regen));
    if(p.kind===1&&p.domainTime<=0){ p.mom=Math.max(0,p.mom-dt*1.4) }
    p.vx*=Math.exp(-1.55*dt); p.vz*=Math.exp(-1.55*dt);
    for(let i=p.ghosts.length-1;i>=0;i--){ p.ghosts[i].life-=dt; if(p.ghosts[i].life<=0)p.ghosts.splice(i,1) }
  }

  // domain sure-hit rules run after movement so slow/confusion applies next frame
  if(domain&&!clash&&domain.intro<=0&&domain.window<=0&&domain.time>0) updateDomainRules(dt);

  // body separation
  for(let i=0;i<players.length;i++)for(let j=i+1;j<players.length;j++){
    const a=players[i],b=players[j];
    if(a.ko||b.ko||a.y>60||b.y>60) continue;
    const dx=b.x-a.x,dz=b.z-a.z,d=Math.hypot(dx,dz);
    if(d<80&&d>0.001){
      const push=(80-d)/2, nx=dx/d, nz=dz/d;
      a.x-=nx*push; a.z-=nz*push; b.x+=nx*push; b.z+=nz*push;
    }
  }

  // projectiles
  for(let i=projectiles.length-1;i>=0;i--){
    const s=projectiles[i];
    if(s.homing&&s.target&&!s.target.ko){
      const dx=s.target.x-s.x, dz=s.target.z-s.z, dl=Math.hypot(dx,dz)||1;
      s.vx=lerp(s.vx,dx/dl*880,1-Math.exp(-s.homing*dt));
      s.vz=lerp(s.vz,dz/dl*880,1-Math.exp(-s.homing*dt));
    }
    s.x+=s.vx*dt; s.y+=s.vy*dt; s.z+=s.vz*dt; s.life-=dt;
    let dead=s.life<=0||s.y<0;
    for(const t of players){
      if(t===s.owner||t.ko) continue;
      if(s.hit&&s.hit.indexOf(t.i)>=0) continue;
      const d=Math.hypot(t.x-s.x,(t.y+105)-s.y,t.z-s.z);
      if(d<s.r+34){
        if(s.hit) s.hit.push(t.i);
        if(s.kind==='heart'&&s.owner&&!t.ko){
          t.tetherT=2.8; t.tetherFrom=s.owner.i;
          popupAt(t.x,t.y+170,t.z,'♥ TETHERED','#ffb3c6',12);
        }
        hurt(t,s.owner,s.dmg,{knock:s.knock!==undefined?s.knock:240,stun:s.stun||0.12,launch:s.launch||0});
        sparks(s.x,s.y,s.z,s.color,10,220);
        if(!s.pierce) dead=true;
        break;
      }
    }
    if(dead) projectiles.splice(i,1);
  }

  for(let i=bursts.length-1;i>=0;i--){ bursts[i].life-=dt; if(bursts[i].life<=0) bursts.splice(i,1) }
  for(let i=popups.length-1;i>=0;i--){ const p=popups[i]; p.life-=dt; p.y+=34*dt; if(p.life<=0) popups.splice(i,1) }
  for(let i=motes.length-1;i>=0;i--){
    const m=motes[i]; m.x+=m.vx*dt; m.y+=m.vy*dt; m.z+=m.vz*dt;
    m.vy-=900*dt; m.vx*=Math.exp(-1.4*dt); m.vz*=Math.exp(-1.4*dt);
    m.life-=dt; if(m.life<=0) motes.splice(i,1);
  }

  if(!clash&&clock>0){ clock=Math.max(0,clock-dt); if(clock<=0) finishMatch() }
  pressed.clear();
  for(const s of net.pressed) s.clear();
}

/* ============================================================
   RENDER — geometry pass, painter's algorithm
   ============================================================ */
let CAM=null, VP=null, layoutCount=0, mangaView=false, duelSolo=null;

function paintFaces(vp){
  const fog=parseRGB(FOG_COL);
  FACES.sort((a,b)=>b.depth-a.depth);
  for(const f of FACES){
    const a=project(CAM,vp,f.a.x,f.a.y,f.a.z);
    if(!a) continue;
    const b=project(CAM,vp,f.b.x,f.b.y,f.b.z);
    const c=project(CAM,vp,f.c.x,f.c.y,f.c.z);
    const d=project(CAM,vp,f.d.x,f.d.y,f.d.z);
    if(!b||!c||!d) continue;
    ctx.beginPath();
    ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.lineTo(c.x,c.y);ctx.lineTo(d.x,d.y);
    ctx.closePath();
    ctx.globalAlpha=f.alpha;
    const ft=clamp((Math.sqrt(f.depth)-1500)/2800,0,0.5);
    ctx.fillStyle=ft>0.004
      ? 'rgb('+Math.round(f.fr+(fog[0]-f.fr)*ft)+','+Math.round(f.fg+(fog[1]-f.fg)*ft)+','+Math.round(f.fb+(fog[2]-f.fb)*ft)+')'
      : f.color;
    ctx.fill();
    if(f.edge) { ctx.strokeStyle=f.edge; ctx.lineWidth=1; ctx.stroke(); }
  }
  ctx.globalAlpha=1;
}

function drawGround(vp,sky,floor,grid){
  const N=16, span=ARENA_R*2.6, tile=span/N, off=-span/2;
  // Solid atmospheric ground base: if a near tile is clipped by the camera
  // plane the gap reads as floor haze instead of a hole in the world.
  const top=vp.y+vp.h*0.26;
  const haze=ctx.createLinearGradient(0,top-vp.h*0.12,0,top);
  haze.addColorStop(0,'rgba(0,0,0,0)');haze.addColorStop(1,sky[2]);
  ctx.fillStyle=haze;
  ctx.fillRect(vp.x,top-vp.h*0.12,vp.w,vp.h*0.12);
  const base=ctx.createLinearGradient(0,top,0,vp.y+vp.h);
  base.addColorStop(0,sky[2]);
  base.addColorStop(0.34,shadeColor(floor[0],0.82));
  base.addColorStop(1,floor[1]);
  ctx.fillStyle=base;
  ctx.fillRect(vp.x,top,vp.w,vp.y+vp.h-top);
  for(let ix=0;ix<N;ix++)for(let iz=0;iz<N;iz++){
    const x0=off+ix*tile, z0=off+iz*tile, x1=x0+tile, z1=z0+tile;
    const a=project(CAM,vp,x0,0,z0), b=project(CAM,vp,x1,0,z0);
    const c=project(CAM,vp,x1,0,z1), d=project(CAM,vp,x0,0,z1);
    if(!a||!b||!c||!d) continue;
    const inside=Math.abs(x0)<ARENA_R&&Math.abs(z0)<ARENA_R;
    const t=clamp((x0+span/2)/span,0,1);
    ctx.globalAlpha=inside?1:0.92;
    ctx.fillStyle=(ix+iz)%2?floor[0]:shadeColor(floor[0],0.88);
    ctx.beginPath();
    ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.lineTo(c.x,c.y);ctx.lineTo(d.x,d.y);ctx.closePath();
    ctx.fill();
    if(inside){
      ctx.strokeStyle=grid;ctx.lineWidth=1;ctx.stroke();
    }
  }
  ctx.globalAlpha=1;
  // arena boundary
  const ring=[[-ARENA_R,0,-ARENA_R],[ARENA_R,0,-ARENA_R],[ARENA_R,0,ARENA_R],[-ARENA_R,0,ARENA_R]]
    .map(c=>project(CAM,vp,c[0],0,c[2]));
  if(ring.every(Boolean)){
    ctx.strokeStyle='#8fd6ff44';ctx.lineWidth=2;
    ctx.beginPath();
    for(let i=0;i<4;i++){i?ctx.lineTo(ring[i].x,ring[i].y):ctx.moveTo(ring[i].x,ring[i].y)}
    ctx.closePath();ctx.stroke();
  }
  // painted mat markings: outer boundary, inner ring and centre crest
  const circle=(rad,col,lw,alpha)=>{
    ctx.save();ctx.globalAlpha=alpha===undefined?0.55:alpha;
    ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.beginPath();
    let started=false;
    for(let i=0;i<=56;i++){
      const a=(i/56)*TAU;
      const q=project(CAM,vp,Math.cos(a)*rad,2.4,Math.sin(a)*rad);
      if(!q){ctx.restore();return}
      if(started)ctx.lineTo(q.x,q.y); else {ctx.moveTo(q.x,q.y);started=true}
    }
    ctx.closePath();ctx.stroke();ctx.restore();
  };
  circle(ARENA_R*0.97,grid,3,0.75);
  circle(ARENA_R*0.93,'#8fd6ff22',1.5,0.8);
  circle(360,'#bfe9ff55',2,0.6);
  circle(150,'#bfe9ff33',1.5,0.6);
  // a continuous low curb wraps every stage, so the fighting platform has a
  // clear edge instead of drifting off into the backdrop
  const segs=48, rad=ARENA_R*0.998, curb=shadeColor(floor[0],1.55);
  for(let i=0;i<segs;i++){
    const a0=(i/segs)*TAU, a1=((i+1)/segs)*TAU;
    const q0={x:Math.cos(a0)*rad,z:Math.sin(a0)*rad};
    const q1={x:Math.cos(a1)*rad,z:Math.sin(a1)*rad};
    pushPanel({x:q0.x,y:0,z:q0.z},{x:q1.x,y:0,z:q1.z},
              {x:q1.x,y:38,z:q1.z},{x:q0.x,y:38,z:q0.z},curb,{flat:true,alpha:.62});
  }
  for(let i=0;i<12;i++){
    const a=(i/12)*TAU;
    glow(Math.cos(a)*rad,44,Math.sin(a)*rad,'#a9dcff',80,.14);
  }
}

function drawBursts(){
  for(const b of bursts){
    const pr=project(CAM,VP,b.x,b.kind==='ring'?4:b.y,b.z);
    if(!pr) continue;
    const t=1-b.life/b.max;
    ctx.save();
    if(b.kind==='ring'){
      const sc=(b.size||1);
      for(let r=0;r<3;r++){
        const rad=(150+t*900+r*220)*pr.s*sc;
        ctx.globalAlpha=(1-t)*0.55;
        ctx.strokeStyle=b.color;ctx.lineWidth=Math.max(1,4*pr.s*sc);
        ctx.beginPath();ctx.ellipse(pr.x,pr.y,rad,rad*0.34,0,0,TAU);ctx.stroke();
      }
    }else if(b.kind==='beam'||b.kind==='beam2'){
      ctx.globalAlpha=1-t;
      ctx.strokeStyle=b.color;ctx.lineWidth=Math.max(2,10*pr.s);
      if(b.kind==='beam'){
        const ex=project(CAM,VP,b.x+(b.dx||0)*760,b.y,b.z+(b.dz||1)*760);
        if(ex){ctx.beginPath();ctx.moveTo(pr.x,pr.y);ctx.lineTo(ex.x,ex.y);ctx.stroke()}
      }else{
        const p2=project(CAM,VP,b.x2,b.y2,b.z2);
        if(p2){ctx.beginPath();ctx.moveTo(pr.x,pr.y);ctx.lineTo(p2.x,p2.y);ctx.stroke()}
      }
    }else{
      ctx.globalAlpha=1-t;
      ctx.strokeStyle=b.color;ctx.lineWidth=Math.max(1,6*pr.s*(b.scale||1));
      ctx.beginPath();ctx.arc(pr.x,pr.y,36*pr.s*(b.scale||1),-1.1,1.1);ctx.stroke();
      ctx.strokeStyle='#ffffff';ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(pr.x,pr.y,36*pr.s*(b.scale||1),-1.1,1.1);ctx.stroke();
    }
    ctx.restore();
  }
}

function drawProjectiles(){
  for(const s of projectiles){
    const pr=project(CAM,VP,s.x,s.y,s.z);
    if(!pr) continue;
    const r=Math.max(3,s.r*pr.s);
    // Screen-space travel direction, so cards, blades and lashes point where
    // they are actually going instead of always facing to the right.
    const ahead=project(CAM,VP,s.x+s.vx*0.05,s.y,s.z+s.vz*0.05);
    const dir=ahead?Math.atan2(ahead.y-pr.y,ahead.x-pr.x):0;
    ctx.save();
    const tail=project(CAM,VP,s.x-s.vx*0.045,s.y,s.z-s.vz*0.045);
    if(tail){
      const tg=ctx.createLinearGradient(tail.x,tail.y,pr.x,pr.y);
      tg.addColorStop(0,'rgba(0,0,0,0)');tg.addColorStop(1,s.color);
      ctx.globalAlpha=0.45;ctx.strokeStyle=tg;ctx.lineWidth=Math.max(2,r*1.25);ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(tail.x,tail.y);ctx.lineTo(pr.x,pr.y);ctx.stroke();
      ctx.globalAlpha=1;
    }
    ctx.translate(pr.x,pr.y);
    ctx.shadowColor=s.color;ctx.shadowBlur=18;
    if(s.kind==='card'){
      ctx.rotate(dir+Math.PI/2+Math.sin(time*13+s.x*0.02)*0.22);
      ctx.fillStyle='#f7ecd2';
      ctx.fillRect(-r*0.62,-r,r*1.24,r*2);
      ctx.strokeStyle=s.color;ctx.lineWidth=2;ctx.strokeRect(-r*0.62,-r,r*1.24,r*2);
      ctx.fillStyle=s.color;ctx.beginPath();ctx.arc(0,0,r*0.24,0,TAU);ctx.fill();
    }else if(s.kind==='shard'){
      ctx.rotate(dir+Math.PI/2);
      if(s.weapon===1){
        ctx.strokeStyle=s.color;ctx.lineWidth=3;
        ctx.beginPath();ctx.moveTo(0,-r*2.2);ctx.lineTo(0,r*1.2);ctx.stroke();
        ctx.fillStyle='#eaffff';ctx.beginPath();ctx.moveTo(0,-r*2.7);ctx.lineTo(r*0.4,-r*1.5);ctx.lineTo(-r*0.4,-r*1.5);ctx.closePath();ctx.fill();
      }else if(s.weapon===3){
        ctx.strokeStyle=s.color;ctx.lineWidth=3;
        for(let ci=0;ci<4;ci++){ctx.beginPath();ctx.arc(0,-r*1.4+ci*r*0.75,r*0.38,0,TAU);ctx.stroke()}
      }else{
        ctx.fillStyle=s.color;
        ctx.beginPath();ctx.moveTo(0,-r*1.8);ctx.lineTo(r*0.45,r*0.9);ctx.lineTo(-r*0.45,r*0.9);ctx.closePath();ctx.fill();
        ctx.strokeStyle='#e6ffff';ctx.lineWidth=2;
        ctx.beginPath();ctx.moveTo(0,-r*1.2);ctx.lineTo(0,r*0.6);ctx.stroke();
        ctx.beginPath();ctx.moveTo(-r*0.7,r*0.75);ctx.lineTo(r*0.7,r*0.75);ctx.stroke();
      }
    }else if(s.kind==='lash'){
      ctx.rotate(dir+Math.PI/2);
      ctx.strokeStyle=s.color;ctx.lineWidth=5;
      ctx.beginPath();ctx.moveTo(-r*5,0);ctx.lineTo(r*5,0);ctx.stroke();
      ctx.strokeStyle='#ffffff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-r*4,0);ctx.lineTo(r*4,0);ctx.stroke();
    }else if(s.kind==='heart'){
      ctx.fillStyle='#ffbacb';ctx.font='900 '+(r*1.7)+'px Inter,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('♥',0,0);
    }else if(s.kind==='vector'){
      ctx.strokeStyle=s.color;ctx.lineWidth=4;
      for(let i=0;i<3;i++){
        ctx.beginPath();ctx.arc(0,0,r*(0.5+i*0.35),i+performance.now()*0.004,i+2.2);ctx.stroke();
      }
    }else if(s.kind==='wind'){
      ctx.strokeStyle=s.color;ctx.lineWidth=4;
      ctx.beginPath();ctx.arc(0,0,r,-1.6+performance.now()*0.004,1.0+performance.now()*0.004);ctx.stroke();
    }else if(s.kind==='wave'){
      if(s.over){
        // HARI BLUE in Overdrive: white core, electric shell, triple halo
        const g2=ctx.createRadialGradient(0,0,0,0,0,r*1.7);
        g2.addColorStop(0,'#ffffff');g2.addColorStop(0.42,s.color);g2.addColorStop(1,'rgba(120,230,255,0)');
        ctx.globalAlpha=0.95;ctx.fillStyle=g2;
        ctx.beginPath();ctx.arc(0,0,r*1.7,0,TAU);ctx.fill();
        ctx.strokeStyle='#eaffff';ctx.lineWidth=3;
        for(let i=0;i<3;i++){
          ctx.beginPath();ctx.ellipse(0,0,r*(1.0+i*0.16),r*0.44,dir+i*1.05,0,TAU);ctx.stroke();
        }
      }else{
        ctx.globalAlpha=0.85;ctx.fillStyle=s.color;
        ctx.beginPath();ctx.ellipse(0,0,r*1.1,r*0.5,0,0,TAU);ctx.fill();
        ctx.strokeStyle='#ffffff';ctx.lineWidth=2;ctx.stroke();
      }
    }else{
      ctx.fillStyle=s.color;
      ctx.beginPath();ctx.arc(0,0,r,0,TAU);ctx.fill();
      ctx.fillStyle='#ffffff';
      ctx.beginPath();ctx.arc(0,0,r*0.4,0,TAU);ctx.fill();
    }
    ctx.restore();
  }
}

function drawMotes(){
  for(const m of motes){

    ctx.save();
    ctx.globalAlpha=clamp(m.life/m.max,0,1);
    ctx.fillStyle=m.color;
    const r=Math.max(1,m.r*pr.s);
    ctx.beginPath();ctx.arc(pr.x,pr.y,r,0,TAU);ctx.fill();
    ctx.restore();
  }
}

function drawPopups(){

function drawGlows(){

    ctx.restore();

}

// mid-point of two hex colours; alpha is dropped (callers re-apply it).
function mixHex(a,b,t){
  const A=parseRGB(a), B=parseRGB(b), k=clamp(t,0,1);
  const c=[0,1,2].map(i=>Math.round(A[i]+(B[i]-A[i])*k));
  return '#'+c.map(v=>v.toString(16).padStart(2,'0')).join('');
}
// While two Domains are locked in a clash neither world wins: sky, floor and
// grid are the halfway point between the two barriers, and the seam repaints
// each side in its caster's own colours.
function clashPalette(){
  if(!clash||!clash.ids||clash.ids.length<2) return null;
  const A=players[clash.ids[0]], B=players[clash.ids[1]];
  if(!A||!B||!A.cfg.domain||!B.cfg.domain) return null;
  const da=A.cfg.domain, db=B.cfg.domain;
  return {
    // the sky melts from the first world at the top into the second at the
    // horizon; each side of the seam is then washed in its own barrier's light
    sky:[da.sky[0], mixHex(da.sky[1],db.sky[1],0.5), db.sky[2]],
    floor:[da.floor[0], db.floor[1]],
    grid:mixHex(da.grid.slice(0,7),db.grid.slice(0,7),0.5)+'66',
    A:da, B:db
  };
}
function rgba(hex,a){
  const c=parseRGB(hex);
  return 'rgba('+c[0]+','+c[1]+','+c[2]+','+clamp(a,0,1)+')';
}

/* ---------- Domain Clash field ---------- */
// Both barriers fight over the same ground. The seam between them leans
// toward whoever is losing the damage war, so dominance is readable at a
// glance without reading the scoreboard.
function clashState(){
  if(!clash||!clash.ids.length) return null;
  const a=players[clash.ids[0]], b=players[clash.ids[1]]||players[clash.ids[0]];
  if(!a||!b) return null;
  const sa=clash.score[a.i]||0, sb=clash.score[b.i]||0;
  const tot=Math.max(1,sa+sb);
  const bias=clamp((sa-sb)/tot,-1,1);
  let ax=b.x-a.x, az=b.z-a.z;
  const al=Math.hypot(ax,az)||1; ax/=al; az/=al;
  const px=-az, pz=ax;
  const shift=bias*260;
  const fade=clamp(Math.min(clash.intro>0?1-clash.intro/1.4:1,clash.time/1.2),0,1);
  return {a,b,sa,sb,tot,bias,px,pz,fade,
    mx:(a.x+b.x)/2+ax*shift, mz:(a.z+b.z)/2+az*shift,
    da:a.cfg.domain, db:b.cfg.domain};
}
function seamScreen(vp,cs){
  for(const R of [3200,1800,1000,520,260,110]){
    const p1=project(CAM,vp,cs.mx+cs.px*R,0,cs.mz+cs.pz*R);
    const p2=project(CAM,vp,cs.mx-cs.px*R,0,cs.mz-cs.pz*R);
    if(p1&&p2) return {p1,p2};
  }
  return null;
}
function worldRing(vp,cx,cz,r,col,alpha,lw,dash){
  ctx.save();
  ctx.globalAlpha=alpha;ctx.strokeStyle=col;ctx.lineWidth=lw;
  if(dash&&ctx.setLineDash) ctx.setLineDash(dash);
  ctx.beginPath();
  let ok=false;
  for(let i=0;i<=64;i++){
    const a=(i/64)*TAU;
    const p=project(CAM,vp,cx+Math.cos(a)*r,3,cz+Math.sin(a)*r);
    if(!p){ok=false;break}
    if(i) ctx.lineTo(p.x,p.y); else {ctx.moveTo(p.x,p.y);ok=true}
  }
  if(ok) ctx.stroke();
  ctx.restore();
}
function drawClashField(vp){
  const cs=clashState();
  if(!cs||cs.fade<=0.01) return;
  const f=cs.fade;
  const ss=seamScreen(vp,cs);
  if(ss){
    const a=ss.p1,b=ss.p2;
    let dx=b.x-a.x,dy=b.y-a.y;
    const dl=Math.hypot(dx,dy)||1; dx/=dl;dy/=dl;
    const nx=-dy, ny=dx;
    const A=project(CAM,vp,cs.a.x,cs.a.y+100,cs.a.z);
    const mid={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
    const side=((A?A.x:mid.x)-mid.x)*nx+((A?A.y:mid.y)-mid.y)*ny>=0?1:-1;
    const L=4200;
    const e1={x:mid.x-dx*L,y:mid.y-dy*L}, e2={x:mid.x+dx*L,y:mid.y+dy*L};
    const n={x:nx*L*side,y:ny*L*side};
    ctx.save();
    ctx.globalCompositeOperation='lighter';
    ctx.beginPath();ctx.moveTo(e1.x,e1.y);ctx.lineTo(e2.x,e2.y);
    ctx.lineTo(e2.x+n.x,e2.y+n.y);ctx.lineTo(e1.x+n.x,e1.y+n.y);ctx.closePath();
    ctx.fillStyle=rgba(cs.a.cfg.domain.sky[2],0.46*f);ctx.fill();
    ctx.beginPath();ctx.moveTo(e1.x,e1.y);ctx.lineTo(e2.x,e2.y);
    ctx.lineTo(e2.x-n.x,e2.y-n.y);ctx.lineTo(e1.x-n.x,e1.y-n.y);ctx.closePath();
    ctx.fillStyle=rgba(cs.b.cfg.domain.sky[1],0.24*f);ctx.fill();
    ctx.restore();
  }
  // competing domain sigils burn into the floor around each caster — a third
  // challenger paints its own sigil instead of being visually ignored
  for(const id of clash.ids){
    const p=players[id]; if(!p) continue;
    const d=p.cfg.domain;
    const pulse=0.5+0.5*Math.sin(time*2.4+p.i);
    const lc=d.sky[1];
    worldRing(vp,p.x,p.z,300,lc,0.26*f*pulse,3,[14,10]);
    worldRing(vp,p.x,p.z,430,lc,0.16*f*(1-pulse*0.4),2,[4,16]);
    worldRing(vp,p.x,p.z,150,lc,0.34*f,2);
  }
  // vertical barrier sheets fighting along the seam
  const L=1700, cols=20;
  for(let i=0;i<cols;i++){
    const t0=(i/cols-0.5)*2, t1=((i+1)/cols-0.5)*2;
    const h=210+Math.sin(time*2.1+i*1.7)*90+((i*37)%140);
    const x0=cs.mx+cs.px*L*t0, z0=cs.mz+cs.pz*L*t0;
    const x1=cs.mx+cs.px*L*t1, z1=cs.mz+cs.pz*L*t1;
    const col=(i%2?cs.a:cs.b).cfg.accent;
    pushPanel({x:x0,y:0,z:z0},{x:x1,y:0,z:z1},{x:x1,y:h,z:z1},{x:x0,y:h,z:z0},
      col,{flat:true,alpha:(0.08+0.15*Math.abs(Math.sin(time*1.6+i)))*f});
  }
}
function drawClashFX(vp){
  const cs=clashState();
  if(!cs||cs.fade<=0.01) return;
  const f=cs.fade;
  const ss=seamScreen(vp,cs);
  if(!ss) return;
  const a=ss.p1,b=ss.p2;
  let dx=b.x-a.x,dy=b.y-a.y;
  const dl=Math.hypot(dx,dy)||1; dx/=dl;dy/=dl;
  const nx=-dy, ny=dx;
  const mid={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
  const pulse=0.55+0.45*Math.sin(time*6.2);
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  const sx0=mid.x-dx*1800, sy0=mid.y-dy*1800, sx1=mid.x+dx*1800, sy1=mid.y+dy*1800;
  // layered wall: a wide pressure band, a hot band and a white core
  const band=[
    {w:46,a:0.10*f,c:cs.a.cfg.accent},
    {w:26,a:0.12*f,c:cs.b.cfg.accent},
    {w:12,a:0.34*f,c:'#ffffff'},
    {w:3,a:0.80*f*pulse,c:'#ffffff'}
  ];
  for(const bd of band){
    ctx.strokeStyle=rgba(bd.c,bd.a);ctx.lineWidth=bd.w;
    ctx.beginPath();ctx.moveTo(sx0,sy0);ctx.lineTo(sx1,sy1);ctx.stroke();
  }
  // travelling segments make the barrier read as active, not painted on
  ctx.setLineDash([22,38]);ctx.lineDashOffset=-time*300;
  ctx.strokeStyle=rgba('#ffffff',0.55*f);ctx.lineWidth=4;
  ctx.beginPath();ctx.moveTo(sx0,sy0);ctx.lineTo(sx1,sy1);ctx.stroke();
  ctx.setLineDash([]);
  ctx.shadowColor='#ffd9ff';ctx.shadowBlur=18;
  // jagged pressure lightning along the seam
  for(let arc=0;arc<3;arc++){
    const col=arc%2?cs.a.cfg.accent:cs.b.cfg.accent;
    ctx.strokeStyle=rgba(col,0.72*f);
    ctx.lineWidth=1.6;ctx.shadowColor=col;ctx.shadowBlur=14;
    ctx.beginPath();
    for(let i=0;i<=22;i++){
      const t=i/22;
      const j=Math.sin(time*9+i*2.3+arc*2.1)*18*(1-Math.abs(t-0.5)*1.2);
      const x=mid.x+dx*(t-0.5)*1500+nx*j;
      const y=mid.y+dy*(t-0.5)*1500+ny*j;
      i?ctx.lineTo(x,y):ctx.moveTo(x,y);
    }
    ctx.stroke();
  }
  // where the two expansions grind together
  const rad=90+60*pulse;
  const g=ctx.createRadialGradient(mid.x,mid.y,0,mid.x,mid.y,rad);
  g.addColorStop(0,rgba('#ffffff',0.55*f));
  g.addColorStop(0.4,rgba(cs.a.cfg.accent,0.30*f));
  g.addColorStop(0.7,rgba(cs.b.cfg.accent,0.22*f));
  g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(mid.x,mid.y,rad,0,TAU);ctx.fill();
  // streams of influence rushing from each caster into the collision
  for(const [p,dir] of [[cs.a,1],[cs.b,-1]]){
    const sp=project(CAM,vp,p.x,p.y+120,p.z);
    if(!sp) continue;
    for(let i=0;i<3;i++){
      const t=(time*1.9+i*0.33)%1;
      const x=lerp(sp.x,mid.x,t), y=lerp(sp.y,mid.y,t)-Math.sin(t*Math.PI)*60;
      ctx.fillStyle=rgba(p.cfg.accent,0.55*f*(1-t));
      ctx.beginPath();ctx.arc(x,y,Math.max(1,5*(1-t)),0,TAU);ctx.fill();
    }
  }
  ctx.restore();
}

/* ---------- three-way collision: world-space pass ---------- */
function drawThreeWayCinema(vp){
  const c=clash&&clash.cinema;
  const core=cinemaCore();
  if(!c||!core||c.t>=c.dur) return;
  const t=c.t, g=core.group;
  const mt=t-threeWay.manga;
  if(mt<=0) return;
  const p1=clamp(mt/1.25,0,1);
  const p2=clamp((mt-1.25)/1.35,0,1);
  const p3=clamp((mt-2.6)/1.5,0,1);
  const out=clamp((mt-4.0)/0.9,0,1);
  const m=1-out;
  const collide=clamp((mt-1.0)/0.7,0,1);
  const beat=0.5+0.5*Math.sin(mt*7.2);
  ctx.save();
  ctx.globalCompositeOperation='lighter';

  // PHASE 1 — the three worlds materialise together, each around its caster.
  for(const p of g) drawDomainAura(vp,p,clamp(p1*1.15,0,1)*m*0.8);

  // PHASE 1-2 — the three skies bleed into one another over the arena.
  for(let k=0;k<g.length;k++){
    const p=g[k];
    const pr=project(CAM,vp,p.x,p.y+90,p.z);
    if(!pr) continue;
    const rad=Math.max(80,540+320*Math.sin(t*0.8+k*2.1)+(1-p1)*380);
    const grd=ctx.createRadialGradient(pr.x,pr.y,0,pr.x,pr.y,rad);
    grd.addColorStop(0,rgba(p.cfg.domain.accent,0.24*m*p1));
    grd.addColorStop(0.55,rgba(p.cfg.domain.accent,0.08*m));
    grd.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=grd;
    ctx.beginPath();ctx.arc(pr.x,pr.y,rad,0,TAU);ctx.fill();
    // a thin vertical flare marks the caster without flooding the frame
    const top=project(CAM,vp,p.x,p.y+980,p.z);
    if(top){
      const pg=ctx.createLinearGradient(pr.x,pr.y,top.x,top.y);
      pg.addColorStop(0,rgba(p.cfg.domain.accent,0.16*m*p1));
      pg.addColorStop(1,'rgba(0,0,0,0)');
      ctx.strokeStyle=pg;ctx.lineWidth=5;ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(pr.x,pr.y);ctx.lineTo(top.x,top.y);ctx.stroke();
    }
  }

  // Equal sigils on the floor: three claims, no favourite.
  for(const p of g){
    const d=p.cfg.domain, base=140+260*p1;
    worldRing(vp,p.x,p.z,base,d.accent,0.75*m*p1,4,[16,12]);
    worldRing(vp,p.x,p.z,base+190,d.accent,0.32*m*p1,2,[5,18]);
    worldRing(vp,p.x,p.z,base*0.52,d.accent,0.45*m,2.5);
  }

  const cr=project(CAM,vp,core.x,core.y,core.z);
  if(cr&&p2>0.01&&collide>0.01){
    // PHASE 2 — three equal seams meet exactly at the collision point.
    const pts=g.map(p=>project(CAM,vp,p.x,p.y+120,p.z));
    if(pts.every(Boolean)){
      ctx.strokeStyle=rgba('#ffffff',0.28*m*p2);
      ctx.lineWidth=2;
      ctx.beginPath();
      for(let k=0;k<=pts.length;k++){
        const q=pts[k%pts.length];
        k?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y);
      }
      ctx.stroke();
    }
    for(const p of g){
      const pr=project(CAM,vp,p.x,p.y+120,p.z);
      if(!pr) continue;
      const col=p.cfg.domain.accent;
      // each seam bows outward on its own arc, so three casters standing in a
      // line still read as three separate collisions, not one flat beam
      const mx=(pr.x+cr.x)/2, my=(pr.y+cr.y)/2;
      const bx=cr.x-pr.x, by=cr.y-pr.y, bl=Math.hypot(bx,by)||1;
      const bow=(110+p.i*34)*(0.6+0.4*p2)*(p.i%2?1:-1);
      const cxp=mx+(-by/bl)*bow, cyp=my+(bx/bl)*bow*0.55;
      for(let w=0;w<3;w++){
        const wob=Math.sin(t*9+w*2.1+p.i)*10*(1-p3*0.35);
        // every seam is painted in its own domain colour — same weight, same
        // width — so the three worlds stay equally legible at the collision
        ctx.strokeStyle=rgba(col,(w===2?0.78:0.42-w*0.08)*m*p2);
        ctx.lineWidth=w===2?4.5:16-w*4;
        ctx.beginPath();ctx.moveTo(pr.x,pr.y);
        ctx.quadraticCurveTo(cxp+wob,cyp-wob*1.8,cr.x,cr.y);
        ctx.stroke();
      }
      ctx.strokeStyle=rgba('#ffffff',0.34*m*p2);
      ctx.lineWidth=1.5;
      ctx.beginPath();ctx.moveTo(pr.x,pr.y);
      ctx.quadraticCurveTo(cxp,cyp,cr.x,cr.y);ctx.stroke();
      // sparks peeling off the seam
      for(let i=0;i<2;i++){
        const q=(t*1.7+i*0.5+p.i*0.17)%1, u=1-q;
        const sx=u*u*pr.x+2*u*q*cxp+q*q*cr.x;
        const sy=u*u*pr.y+2*u*q*cyp+q*q*cr.y;
        ctx.fillStyle=rgba(col,0.65*m*p2*(1-q));
        ctx.beginPath();ctx.arc(sx+Math.sin(q*9+p.i)*10,sy+Math.cos(q*7)*8,2.2,0,TAU);ctx.fill();
      }
      for(let i=0;i<3;i++){
        const q=(t*1.5+i*0.34)%1;
        ctx.fillStyle=rgba(col,0.55*m*p2*(1-q));
        ctx.beginPath();
        ctx.arc(lerp(pr.x,cr.x,q),lerp(pr.y,cr.y,q)-Math.sin(q*Math.PI)*44,2.6,0,TAU);
        ctx.fill();
      }
    }
  }

  // PHASE 2-3 — the collision core with three lobes of equal weight: the
  // equilibrium is unstable, nobody has pushed anybody out.
  if(cr&&collide>0.01){
    const rad=Math.max(26,(46+94*p2+14*beat)*(0.7+0.3*collide));
    // ground shockwaves rolling out of the intersection
    for(let i=0;i<3;i++){
      const q=((t*0.55+i*0.33)%1);
      worldRing(vp,core.x,core.z,220+q*1500,g[i%g.length].cfg.domain.accent,0.30*m*(1-q)*p2,3);
    }
    // soft halo first, then a dense core, so the collision reads as a sphere
    const halo=ctx.createRadialGradient(cr.x,cr.y,0,cr.x,cr.y,rad*2.4);
    halo.addColorStop(0,rgba('#ffffff',0.30*m*collide));
    halo.addColorStop(0.42,rgba(g[0].cfg.domain.accent,0.16*m*collide));
    halo.addColorStop(0.72,rgba(g[1%g.length].cfg.domain.accent,0.10*m*collide));
    halo.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=halo;
    ctx.beginPath();ctx.arc(cr.x,cr.y,rad*2.4,0,TAU);ctx.fill();
    const grd=ctx.createRadialGradient(cr.x,cr.y,0,cr.x,cr.y,rad);
    grd.addColorStop(0,rgba('#ffffff',0.98*m));
    grd.addColorStop(0.34,rgba('#fff2dd',0.72*m));
    grd.addColorStop(0.62,rgba(g[0].cfg.domain.accent,0.34*m));
    grd.addColorStop(0.84,rgba(g[1%g.length].cfg.domain.accent,0.22*m));
    grd.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=grd;
    ctx.beginPath();ctx.arc(cr.x,cr.y,rad,0,TAU);ctx.fill();
    // crisp containment ring hugging the sphere
    ctx.strokeStyle=rgba('#ffffff',0.55*m*collide);
    ctx.lineWidth=2.6;
    ctx.beginPath();ctx.arc(cr.x,cr.y,rad*1.06,0,TAU);ctx.stroke();
    for(let k=0;k<3;k++){
      const a=t*1.45+k*TAU/3;
      const x=cr.x+Math.cos(a)*rad*0.55, y=cr.y+Math.sin(a)*rad*0.26;
      const col=g[k%g.length].cfg.domain.accent;
      const lg=ctx.createRadialGradient(x,y,0,x,y,rad*0.46);
      lg.addColorStop(0,rgba(col,0.36*m*collide));
      lg.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=lg;
      ctx.beginPath();ctx.arc(x,y,rad*0.46,0,TAU);ctx.fill();
    }
    for(let i=0;i<3;i++){
      const q=(t*0.8+i*0.34)%1;
      const rr2=170+q*1250;
      ctx.strokeStyle=rgba(i===1?'#ffffff':g[i%g.length].cfg.domain.accent,0.3*m*(1-q)*p2);
      ctx.lineWidth=2+9*(1-q);
      ctx.beginPath();ctx.arc(cr.x,cr.y,rr2,0,TAU);ctx.stroke();
    }
    // three equal containment rings turning in opposite directions: the clash
    // is a deadlock, and the rings never settle into one colour
    for(let k=0;k<3;k++){
      const a0=t*(1.1+k*0.14)*(k%2?-1:1)+k*TAU/3;
      ctx.strokeStyle=rgba(g[k%g.length].cfg.domain.accent,0.34*m*p3*collide);
      ctx.lineWidth=2.4;
      ctx.setLineDash([rad*0.9,rad*2.2]);
      ctx.beginPath();ctx.arc(cr.x,cr.y,rad*(1.15+k*0.22),a0,a0+TAU*0.72);ctx.stroke();
    }
    ctx.setLineDash([]);
  }
  ctx.restore();
}

/* ---------- three-way collision: screen-space interference ---------- */
function drawCinemaOverlay(){
  const c=clash&&clash.cinema;
  const core=cinemaCore();
  if(!c||!core||c.t>=c.dur) return;
  const t=c.t, g=core.group;
  const mt=t-threeWay.manga;
  if(mt<=0) return;
  const p2=clamp((mt-1.2)/1.2,0,1);
  const out=clamp((mt-4.0)/0.9,0,1);
  const m=1-out;
  const pr=project(CAM,VP,core.x,core.y,core.z);
  const cx=pr?pr.x:W/2, cy=pr?pr.y:H*0.5;
  ctx.save();
  // three colour tears pulling out of the collision point
  ctx.globalCompositeOperation='lighter';
  for(let k=0;k<3;k++){
    const col=g[k].cfg.domain.accent;
    const a=t*2.4+k*TAU/3;
    for(let i=0;i<3;i++){
      const len=W*(0.3+0.28*Math.sin(t*1.7+i*2.1+k));
      ctx.strokeStyle=rgba(col,0.1*m*p2*(0.5+0.5*Math.sin(t*11+i)));
      ctx.lineWidth=1+2*Math.abs(Math.sin(t*6+i));
      ctx.beginPath();
      ctx.moveTo(cx,cy);
      ctx.lineTo(cx+Math.cos(a+i*0.24)*len,cy+Math.sin(a+i*0.24)*len*0.55);
      ctx.stroke();
    }
  }
  // interference scan lines: the room refusing to settle
  ctx.globalCompositeOperation='screen';
  for(let i=0;i<26;i++){
    const yy=((i/26)*H+t*60*(i%2?1:-1))%H;
    const al=(0.012+0.02*Math.abs(Math.sin(t*3+i)))*m*p2;
    ctx.fillStyle=rgba(i%3===0?'#ffffff':g[i%g.length].cfg.domain.accent,al);
    ctx.fillRect(0,yy+Math.sin(t*4+i)*3,W,1.5+i%3);
  }
  // unstable rim: the three worlds pressing on the edges of the frame
  const vg=ctx.createRadialGradient(cx,cy,H*0.28,cx,cy,H*0.95);
  vg.addColorStop(0,'rgba(0,0,0,0)');
  vg.addColorStop(0.7,rgba(g[0].cfg.domain.accent,0.05*m*p2));
  vg.addColorStop(0.86,rgba(g[1%g.length].cfg.domain.accent,0.07*m*p2));
  vg.addColorStop(0.95,rgba(g[2%g.length].cfg.domain.accent,0.09*m*p2));
  vg.addColorStop(1,'rgba(2,4,10,0.72)');
  ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
  ctx.restore();
  // one restrained title, letter-spaced, only while the three worlds hold
  const title=clamp(Math.min((mt-0.7)/0.7,(3.9-mt)/0.7),0,1);
  if(title>0.01){
    ctx.save();
    ctx.globalAlpha=title*0.92;
    ctx.textAlign='center';
    ctx.fillStyle='#f2e2c0';
    ctx.font='900 '+Math.round(Math.min(15,W/34))+'px Inter,system-ui,sans-serif';
    if(ctx.letterSpacing!==undefined) ctx.letterSpacing='5px';
    ctx.fillText('THREE-WAY DOMAIN CLASH',W/2,H*0.69);
    ctx.globalAlpha=title*0.55;
    ctx.fillStyle='#cfe0ee';
    ctx.font='800 '+Math.round(Math.min(9,W/72))+'px Inter,system-ui,sans-serif';
    if(ctx.letterSpacing!==undefined) ctx.letterSpacing='3px';
    ctx.fillText('THREE DOMAINS · ONE COLLISION POINT',W/2,H*0.69+18);
    ctx.restore();
  }
}
/* ---------- three-way opening: manga triptych close-ups ---------- */
function drawMangaClash(){
  const c=clash&&clash.cinema, core=cinemaCore();
  if(!c||!core) return;
  const g=core.group, t=c.t, M=threeWay.manga;
  const gut=Math.max(5,Math.round(W*0.01));
  const pw=(W-gut*2)/3;
  ctx.save();
  ctx.fillStyle='#04050a';ctx.fillRect(0,0,W,H);
  for(let i=0;i<3;i++){
    const p=g[i]; if(!p) continue;
    const rx=i*(pw+gut);
    const rv=clamp((t-i*0.11)/0.4,0,1);
    if(rv<=0.01) continue;
    const z=Math.pow(clamp(t/M,0,1),0.82);
    const punch=clamp((t-(M-0.3))/0.3,0,1);
    // The panel is a tall strip, so its horizontal field is narrow: the lens
    // has to sit well back for the head to fill the width without clipping.
    const dist=lerp(182,128,z)-16*punch;
    const S=p.cfg.scale||1, hy=p.y+170*S;
    const ang=(p.face||0)+(i-1)*0.2;
    const eye={x:p.x+Math.sin(ang)*dist, y:hy+4+Math.sin(t*2.4+i*2.2)*1.2, z:p.z+Math.cos(ang)*dist};
    const vp={x:rx,y:0,w:pw,h:H,cx:rx+pw/2,cy:H/2,focal:(H/2)/Math.tan(0.45),fov:0.9};
    vp.cam=makeCam(eye,{x:p.x+Math.sin(p.face||0)*6,y:hy-16,z:p.z+Math.cos(p.face||0)*6},0.9);
    const ph=H*rv;
    ctx.save();
    ctx.beginPath();ctx.rect(rx,0,pw,ph);ctx.clip();
    mangaView=true;renderScene(vp);mangaView=false;
    const hpr=project(CAM,vp,p.x,hy,p.z);
    const fx=hpr?hpr.x:vp.cx, fy=hpr?hpr.y:ph*0.42;
    // ink falloff + domain backlight around the face
    const dg=ctx.createRadialGradient(fx,fy,pw*0.06,fx,fy,pw*1.15);
    dg.addColorStop(0,'rgba(4,6,14,0)');
    dg.addColorStop(0.5,'rgba(4,6,14,0.24)');
    dg.addColorStop(1,'rgba(4,6,14,0.88)');
    ctx.fillStyle=dg;ctx.fillRect(rx,0,pw,ph);
    ctx.globalCompositeOperation='lighter';
    const ag=ctx.createRadialGradient(fx,fy,0,fx,fy,pw*0.62);
    ag.addColorStop(0,rgba(p.cfg.domain.accent,0.30));
    ag.addColorStop(0.6,rgba(p.cfg.domain.accent,0.10));
    ag.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=ag;ctx.fillRect(rx,0,pw,ph);
    ctx.globalCompositeOperation='source-over';
    // a hard diagonal shadow across the jaw and a rim light on one edge
    ctx.fillStyle='rgba(4,6,14,0.30)';
    ctx.beginPath();ctx.moveTo(rx,ph*0.58);ctx.lineTo(rx+pw,ph*0.40);ctx.lineTo(rx+pw,ph);ctx.lineTo(rx,ph);ctx.closePath();ctx.fill();
    const rim=ctx.createLinearGradient(rx,0,rx+pw,0);
    rim.addColorStop(0,'rgba(0,0,0,0)');
    rim.addColorStop(0.72,'rgba(0,0,0,0)');
    rim.addColorStop(1,rgba(p.cfg.domain.accent,0.22));
    ctx.fillStyle=rim;ctx.fillRect(rx,0,pw,ph);
    ctx.globalCompositeOperation='source-over';
    // open, shouting mouth: the activation beat the reference page is built on
    const mo=project(CAM,vp,p.x+Math.sin(p.face||0)*11.2,hy-7,p.z+Math.cos(p.face||0)*11.2);
    if(mo){
      const mw=Math.max(6,pw*0.085), mh=Math.max(5,pw*0.062);
      ctx.save();ctx.translate(mo.x,mo.y);
      ctx.fillStyle='#08080e';
      ctx.beginPath();ctx.ellipse(0,0,mw,mh,0,0,TAU);ctx.fill();
      ctx.fillStyle='#3d1622';
      ctx.beginPath();ctx.ellipse(0,mh*0.28,mw*0.60,mh*0.52,0,0,TAU);ctx.fill();
      ctx.fillStyle='rgba(246,242,230,0.9)';
      ctx.fillRect(-mw*0.66,-mh*0.86,mw*1.32,mh*0.26);
      ctx.restore();
    }
    // radial ink lines give the panel its scream
    for(let k=0;k<24;k++){
      const a=k*TAU/24+Math.sin(k*4.3)*0.09+t*0.1;
      const r0=pw*(0.30+((k*29)%30)/300), r1=pw*(1.0+((k*41)%50)/180);
      ctx.strokeStyle='rgba(6,8,14,0.38)';ctx.lineWidth=1+(k%3);
      ctx.beginPath();
      ctx.moveTo(fx+Math.cos(a)*r0,fy+Math.sin(a)*r0*1.15);
      ctx.lineTo(fx+Math.cos(a)*r1,fy+Math.sin(a)*r1*1.15);
      ctx.stroke();
    }
    // halftone dots in the shadowed lower third
    ctx.fillStyle='rgba(6,8,14,0.13)';
    for(let yy=ph*0.66;yy<ph;yy+=10){
      for(let xx=rx+5+((((yy/10)|0)%2)?4:0);xx<rx+pw;xx+=10){
        const s2=(((yy/10)|0)%3)?1.6:2.4;
        ctx.fillRect(xx,yy,s2,s2);
      }
    }
    // name tab
    ctx.fillStyle='rgba(4,6,12,0.72)';ctx.fillRect(rx+4,4,pw-8,15);
    ctx.fillStyle=p.cfg.accent;ctx.textAlign='left';ctx.textBaseline='middle';
    ctx.font='900 '+Math.max(7,Math.round(Math.min(9,pw/16)))+'px Inter,system-ui,sans-serif';
    ctx.fillText('P'+(p.i+1)+' · '+p.cfg.short.toUpperCase(),rx+8,12);
    // speech bubble, one per caster, like the reference page
    const ba=clamp((t-0.92)/0.3,0,1);
    if(ba>0.01){
      const bw=pw*0.88, bh=Math.max(36,Math.min(56,ph*0.085));
      const bx=rx+pw/2-bw/2, by=ph*0.74+(1-ba)*22;
      ctx.save();
      ctx.globalAlpha=ba;
      ctx.translate(bx+bw/2,by+bh/2);ctx.rotate((i-1)*0.07);ctx.translate(-(bx+bw/2),-(by+bh/2));
      ctx.strokeStyle='#08090f';ctx.lineWidth=2.2;ctx.fillStyle='#f7f3e6';
      ctx.beginPath();
      ctx.moveTo(bx+bw*0.32,by+bh*0.86);
      ctx.lineTo(bx+bw*0.24,by+bh+16);
      ctx.lineTo(bx+bw*0.46,by+bh*0.92);
      ctx.closePath();ctx.fill();ctx.stroke();
      rr(bx,by,bw,bh,bh*0.28);ctx.fill();ctx.stroke();
      ctx.fillStyle='#0a0b12';ctx.textAlign='center';ctx.textBaseline='middle';
      const fs=Math.max(8,Math.round(Math.min(13,pw/13.5)));
      ctx.font='900 '+fs+'px Inter,system-ui,sans-serif';
      ctx.fillText('DOMAIN',bx+bw/2,by+bh*0.36);
      ctx.fillText(i===1?'EXPANSION.':'EXPANSION!!!',bx+bw/2,by+bh*0.70);
      ctx.restore();
    }
    ctx.textBaseline='alphabetic';
    ctx.restore();
    // panel frame
    ctx.strokeStyle='#04050a';ctx.lineWidth=gut;ctx.strokeRect(rx-gut/2,0,pw+gut,ph);
    ctx.strokeStyle=rgba(p.cfg.domain.accent,0.55);ctx.lineWidth=1.2;
    ctx.strokeRect(rx+2,2,pw-4,ph-4);
  }
  // the triptych breaks into the arena on a white cut
  const fl=clamp((t-(M-0.3))/0.3,0,1);
  if(fl>0){ctx.fillStyle='rgba(255,255,255,'+(fl*0.92).toFixed(3)+')';ctx.fillRect(0,0,W,H)}
  ctx.restore();
  mangaView=false;
}
/* ---------- two-way clash: one inked page ---------- */
// The reference is line art, not a render: white paper, one hard black
// diagonal, two inked portraits cropped by it, the hands of the Domain sign
// over the seam and stone crumbs in the air. Only the eyes keep their colour.
function duelPortrait(p,cx,cy,s,dir){
  const ink='#0d0d12', paper='#f8f5ee';
  const hair=p.cfg.hair||'#161d30';
  const hc=hair.replace('#','');

  const eyeCol=p.cfg.eyes||'#9fd8ff';
  const lw=0.022;
  ctx.save();
  ctx.translate(cx,cy);ctx.scale(dir<0?-s:s,s);
  ctx.lineJoin='round';ctx.lineCap='round';
  // shoulders and high collar
  ctx.beginPath();
  ctx.moveTo(-0.80,1.00);ctx.quadraticCurveTo(-0.72,0.52,-0.34,0.44);
  ctx.lineTo(0.34,0.44);ctx.quadraticCurveTo(0.72,0.52,0.80,1.00);
  ctx.closePath();
  ctx.fillStyle='#111116';ctx.fill();
  // neck
  ctx.beginPath();
  ctx.moveTo(-0.16,0.28);ctx.lineTo(0.16,0.28);ctx.lineTo(0.19,0.58);ctx.lineTo(-0.19,0.58);ctx.closePath();
  ctx.fillStyle=paper;ctx.fill();ctx.strokeStyle=ink;ctx.lineWidth=lw;ctx.stroke();
  // back hair silhouette
  const hairFill=light?paper:'#0e0e13';
  ctx.beginPath();
  ctx.moveTo(-0.46,0.24);
  ctx.lineTo(-0.52,-0.10);ctx.lineTo(-0.42,-0.30);ctx.lineTo(-0.50,-0.46);
  ctx.lineTo(-0.32,-0.40);ctx.lineTo(-0.36,-0.60);ctx.lineTo(-0.16,-0.50);
  ctx.lineTo(-0.12,-0.70);ctx.lineTo(0.02,-0.54);ctx.lineTo(0.10,-0.72);
  ctx.lineTo(0.20,-0.52);ctx.lineTo(0.36,-0.62);ctx.lineTo(0.32,-0.40);
  ctx.lineTo(0.48,-0.46);ctx.lineTo(0.38,-0.24);ctx.lineTo(0.50,-0.04);
  ctx.lineTo(0.42,0.24);
  ctx.closePath();
  ctx.fillStyle=hairFill;ctx.fill();ctx.strokeStyle=ink;ctx.lineWidth=lw*1.25;ctx.stroke();
  // face
  ctx.beginPath();
  ctx.moveTo(-0.32,-0.16);
  ctx.quadraticCurveTo(-0.34,-0.40,-0.10,-0.46);
  ctx.quadraticCurveTo(0.14,-0.52,0.30,-0.34);
  ctx.quadraticCurveTo(0.36,-0.16,0.31,0.04);
  ctx.quadraticCurveTo(0.27,0.30,0.05,0.46);
  ctx.quadraticCurveTo(-0.10,0.52,-0.22,0.36);
  ctx.quadraticCurveTo(-0.33,0.18,-0.32,-0.16);
  ctx.closePath();
  ctx.fillStyle=paper;ctx.fill();ctx.strokeStyle=ink;ctx.lineWidth=lw;ctx.stroke();
  // ear
  ctx.beginPath();ctx.moveTo(-0.30,-0.02);
  ctx.quadraticCurveTo(-0.45,-0.06,-0.41,0.14);
  ctx.quadraticCurveTo(-0.37,0.24,-0.28,0.18);ctx.closePath();
  ctx.fillStyle=paper;ctx.fill();ctx.strokeStyle=ink;ctx.lineWidth=lw*0.9;ctx.stroke();
  // bangs over the forehead
  ctx.beginPath();
  ctx.moveTo(-0.34,-0.20);ctx.lineTo(-0.24,-0.44);ctx.lineTo(-0.14,-0.22);
  ctx.lineTo(-0.02,-0.50);ctx.lineTo(0.08,-0.24);ctx.lineTo(0.20,-0.46);
  ctx.lineTo(0.31,-0.18);

  // brows
  for(const sx of [-1,1]){

    ctx.lineWidth=0.050;ctx.strokeStyle=ink;ctx.stroke();
  }

  for(const sx of [-1,1]){

function duelPanel(p,cx,cy,poly,size,dir){

// stone crumbs floating through the panel
function duelDebris(t){
  let sd=2267;
  const rnd=()=>{ sd=(sd*16807)%2147483647; return sd/2147483647 };
  for(let i=0;i<15;i++){
    const px=rnd()*W, py0=rnd()*H, sp=0.5+rnd()*0.9, s=3+rnd()*9;
    const py=py0-((t*20*sp+i*53)%(H*0.34));

    ctx.beginPath();
    for(let k=0;k<5;k++){
      const a=k/5*TAU, r=s*(0.62+((k*37+i*11)%30)/70);

    ctx.closePath();
    ctx.fillStyle='#fbf9f2';ctx.fill();
    ctx.strokeStyle='#111116';ctx.lineWidth=1.2;ctx.stroke();
    ctx.strokeStyle='rgba(17,17,22,0.45)';ctx.lineWidth=0.8;

}
// ez runs 0 -> 1 across the back half of the beat: the lens tightens on the
// eyes (focal, not a dolly, so the camera never clips inside the head) and the
// eye line stays pinned to the middle of the panel the whole way.
function duelFaceVp(p,cx,cy,z,size,ez){
  ez=clamp(ez||0,0,1);
  const face=(p.face||0);
  const J=fighterParts(p,face);
  const E=J.P(J.head.x,J.head.y+1,J.head.z+11.2);   // the eyes, in world space
  // focal already scales with the canvas, so a fixed stand-off keeps the head
  // at a little over half the frame on any window shape.
  const dist=clamp(180*(0.94-0.12*ez)*(1-0.14*z),90,700);
  const side=(p.i%2)?1:-1;
  const ang=face+side*0.05;   // dead in front of the face, a hair off-axis
  const eye={x:E.x+Math.sin(ang)*dist, y:E.y+dist*0.015, z:E.z+Math.cos(ang)*dist};
  const vp={x:0,y:0,w:W,h:H,cx:0,cy:0,focal:((H/2)/Math.tan(0.44))*(1+1.15*ez),fov:0.88};
  vp.cam=makeCam(eye,{x:E.x,y:E.y,z:E.z},0.88);
  const hp=project(vp.cam,vp,E.x,E.y,E.z);
  if(hp){ vp.cx=cx-hp.x; vp.cy=cy-hp.y }
  vp.focus=p;
  return vp;
}
// one half of the page: the fighter in close-up, burning in their own colour
function duelModelPanel(p,cx,cy,poly,size,z,ez){
  const vp=duelFaceVp(p,cx,cy,z,size,ez);

function duelBubble(t){

function drawDuelClash(){
  const c=clash&&clash.cinema;
  if(!c||c.ids.length!==2) return;
  const a=players[c.ids[0]], b=players[c.ids[1]];
  if(!a||!b) return;
  const t=c.t, D=c.dur||duel.manga;
  const z=clamp(t/D,0,1);
  const fade=clamp(t/0.26,0,1);
  const cut=clamp((t-(D-0.24))/0.24,0,1);
  const y0=H*0.02, y1=H*0.72, bw=Math.max(9,H*0.024);
  const yy=x=>y0+(y1-y0)*(x/W);
  const x0=-90, x1=W+90;
  const polyB=[[x0,-90],[x1,-90],[x1,yy(x1)-bw/2],[x0,yy(x0)-bw/2]];
  const polyA=[[x0,yy(x0)+bw/2],[x1,yy(x1)+bw/2],[x1,H+90],[x0,H+90]];
  const szB=Math.min(H*0.50,W*0.34), szA=Math.min(H*0.52,W*0.36);
  ctx.save();
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';

  ctx.translate(W/2,H/2);ctx.scale(1.03+0.04*z,1.03+0.04*z);ctx.translate(-W/2,-H/2);
  const ez=clamp((z-0.38)/0.46,0,1);

  duelModelPanel(b,W*0.68,H*0.31,polyB,szB,z,ease);
  duelModelPanel(a,W*0.31,H*0.68,polyA,szA,z,ease);
  // the hard diagonal that cuts the page in two
  ctx.fillStyle='#07060b';
  ctx.beginPath();
  ctx.moveTo(x0,yy(x0)-bw/2);ctx.lineTo(x1,yy(x1)-bw/2);
  ctx.lineTo(x1,yy(x1)+bw/2);ctx.lineTo(x0,yy(x0)+bw/2);ctx.closePath();ctx.fill();
  duelBubble(t);
  duelDebris(t);
  const lab=(p,right,bottom)=>{
    ctx.save();

    if(ctx.letterSpacing!==undefined) ctx.letterSpacing='2px';

/* ---------- pairing verdict ---------- */
// Three fighters, three possible two-way clashes; each ends on its own line.
const PAIR_LINES={'01':'FORTUNE OUTRUNS THE HORIZON','02':'FORTUNE SHUFFLES THE KALEIDOSCOPE',
  '12':'THE HORIZON REFRACTS THE KALEIDOSCOPE'};
function spawnVerdict(list,best){
  if(!list||list.length!==2) return;

  if(!w||!l) return;
  const key=[w.kind,l.kind].sort((x,y)=>x-y).join('');
  verdict={t:0,dur:2.7,w:w.i,l:l.i,line:PAIR_LINES[key]||'TWO DOMAINS · ONE SURVIVOR'};

}
function drawVerdict(){

function drawTethers(vp){
  for(const p of players){
    if(!p.tetherT||p.tetherT<=0) continue;
    const o=players[p.tetherFrom];
    if(!o||o.ko) continue;
    const a=project(CAM,vp,o.x,o.y+110,o.z);
    const b=project(CAM,vp,p.x,p.y+110,p.z);
    if(!a||!b) continue;

    ctx.beginPath();ctx.moveTo(a.x,a.y);

    ctx.setLineDash([]);

function drawDomainAmbience(vp){
  if(!domain) return;

  drawDomainAura(vp,domain.owner,f);

// Same domain art, drawn for any caster: the three-way cutscene gives each of
// the three worlds its own ambience instead of inventing a new design.
function drawDomainAura(vp,o,f){
  const d=o.cfg.domain;
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  // innermost ring rotates with the Domain clock; Arashi gets a second
  // counter-spinning gale so the hurricane reads as moving air.
  worldRing(vp,o.x,o.z,470,d.accent,0.16*f,2);
  for(let i=0;i<4;i++){
    const t=time*0.5+i/4;
    const rr2=520+Math.sin(time*0.9+i)*70;
    const x=o.x+Math.cos(t*TAU)*rr2, z=o.z+Math.sin(t*TAU)*rr2;
    const p=project(CAM,vp,x,10,z);
    if(p){ctx.fillStyle=rgba(d.accent,0.5*f);ctx.beginPath();ctx.arc(p.x,p.y,5,0,TAU);ctx.fill()}
  }
  if(domain.type===5){
    // visible rotating gale walls inside the eye, plus ground dust and
    // lightning so the hurricane is a place, not a grey fog
    for(let arm=0;arm<3;arm++){
      for(let k=0;k<9;k++){
        const a=time*(1.3+arm*0.12)+arm*2.1+k*0.22;
        const r0=230+k*95;
        const y0=k*74, y1=y0+150+Math.sin(time*2+k)*40;
        const p1=project(CAM,vp,o.x+Math.cos(a)*r0,y0,o.z+Math.sin(a)*r0);
        const p2=project(CAM,vp,o.x+Math.cos(a+0.16)*(r0+70),y1,o.z+Math.sin(a+0.16)*(r0+70));
        if(p1&&p2){
          ctx.strokeStyle=rgba(d.accent,0.16*f);ctx.lineWidth=3+arm;
          ctx.beginPath();ctx.moveTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);ctx.stroke();
        }
      }
    }
    for(let i=0;i<14;i++){
      const a=time*1.9+i*0.9, r0=120+((i*89)%760);
      const p1=project(CAM,vp,o.x+Math.cos(a)*r0,4,o.z+Math.sin(a)*r0);
      const p2=project(CAM,vp,o.x+Math.cos(a+0.35)*(r0+160),4,o.z+Math.sin(a+0.35)*(r0+160));
      if(p1&&p2){ctx.strokeStyle=rgba(d.accent,0.12*f);ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);ctx.stroke()}
    }
    // lightning strikes around the silent eye
    for(let i=0;i<3;i++){
      const a=time*0.7+i*2.1, rr2=380+((i*211)%420);
      const top=project(CAM,vp,o.x+Math.cos(a)*rr2,900,o.z+Math.sin(a)*rr2);
      const bot=project(CAM,vp,o.x+Math.cos(a)*rr2,0,o.z+Math.sin(a)*rr2);
      if(top&&bot){
        ctx.strokeStyle=rgba('#e8f4ff',0.55*f);ctx.lineWidth=2;
        ctx.beginPath();
        for(let k=0;k<=8;k++){
          const t=k/8, j=Math.sin(time*9+k*3.1+i)*14;
          const x=lerp(top.x,bot.x,t)+j, y=lerp(top.y,bot.y,t);
          k?ctx.lineTo(x,y):ctx.moveTo(x,y);
        }
        ctx.stroke();
      }
    }
  }
  ctx.restore();
}

function renderScene(vp){
  VP=vp; CAM=vp.cam;
  FACES=[]; GLOWS=[];

  const stage=ARENAS[arenaIdx];
  const cp=clashPalette();
  const dm=domain?domain.owner.cfg.domain:null;
  const skyCols=cp?cp.sky:(dm?dm.sky:stage.sky);
  const floorCols=cp?cp.floor:(dm?dm.floor:stage.floor);
  const gridCol=cp?cp.grid:(dm?dm.grid:stage.grid);
  FOG_COL=skyCols[2];

  ctx.save();
  ctx.beginPath();ctx.rect(vp.x,vp.y,vp.w,vp.h);ctx.clip();

  // Duel close-up: no arena, just the fighter over the aura the caller painted
  if(duelSolo){
    drawFighter(duelSolo);drawMirrors(duelSolo);
    paintFaces(vp);drawGlows();
    ctx.restore();
    return;
  }

  const sky=ctx.createLinearGradient(0,vp.y,0,vp.y+vp.h*0.78);
  sky.addColorStop(0,skyCols[0]);sky.addColorStop(0.55,skyCols[1]);sky.addColorStop(1,skyCols[2]);
  ctx.fillStyle=sky;ctx.fillRect(vp.x,vp.y,vp.w,vp.h);
  ctx.fillStyle=skyCols[2];
  ctx.globalAlpha=0.55;
  ctx.fillRect(vp.x,vp.y+vp.h*0.72,vp.w,vp.h*0.28);
  ctx.globalAlpha=1;

  drawGround(vp,skyCols,floorCols,gridCol);
  // During the three-way cutscene the two-player seam is replaced by the
  // three-way collision — a 2-way wall would read as somebody already winning.
  if(clash&&!cinemaOn()) drawClashField(vp);

  // A clash has no single world yet: every caster's Domain is still standing,
  // so both sets of props (trees and rain across mirrors and violet pillars)
  // occupy the same ground until one barrier collapses.
  if(clash&&clash.ids&&clash.ids.length>=2){
    for(const id of clash.ids){
      const q=players[id];
      if(q&&q.cfg.domain&&q.cfg.domain.geo) emitGeo(q.cfg.domain.geo);
    }
  }else emitGeo(dm?dm.geo:stage.geo);
  for(const p of players){ drawFighter(p); drawMirrors(p); }

  paintFaces(vp);
  drawGlows();
  // A manga panel is a clean close-up: no HUD clutter, names or popups.
  if(!mangaView){
    drawTethers(vp);
    if(clash&&!cinemaOn()&&clash.ids.length>=2){
      // each barrier still projects its own light while the clash is live
      for(const id of clash.ids){ const q=players[id]; if(q&&!q.ko) drawDomainAura(vp,q,0.55) }
    }else if(domain&&!cinemaOn()) drawDomainAmbience(vp);
    if(clash&&!cinemaOn()) drawClashFX(vp);
    if(clash&&clash.cinema) drawThreeWayCinema(vp);
    drawMotes();
    drawBursts();
    drawProjectiles();
    drawNames();
    drawPopups();
  }

  // atmospheric falloff at the edges of the pane keeps the eye on the fight
  const vg=ctx.createRadialGradient(vp.x+vp.w/2,vp.y+vp.h*0.54,vp.h*0.24,
    vp.x+vp.w/2,vp.y+vp.h*0.54,vp.h*1.02);
  vg.addColorStop(0,'rgba(2,5,12,0)');
  vg.addColorStop(0.62,'rgba(2,5,12,0.16)');
  vg.addColorStop(1,'rgba(2,5,12,0.55)');
  ctx.fillStyle=vg;ctx.fillRect(vp.x,vp.y,vp.w,vp.h);

  ctx.restore();
}

/* ---------- camera ---------- */
function alivePlayers(){return players.filter(p=>!p.ko)}
function spread(){
  const a=alivePlayers();
  let m=0;
  for(let i=0;i<a.length;i++)for(let j=i+1;j<a.length;j++)
    m=Math.max(m,Math.hypot(a[i].x-a[j].x,a[i].z-a[j].z));
  return m;
}
function frameGroup(list,pad){
  let cx=0,cz=0,cy=0,n=0;
  for(const p of list){cx+=p.x;cz+=p.z;cy+=p.y+100;n++}
  if(!n) return {cx:0,cz:0,cy:100,radius:420};
  cx/=n;cy/=n;cz/=n;
  let radius=195;
  for(const p of list) radius=Math.max(radius,Math.hypot(p.x-cx,p.z-cz)+105);
  radius+=(pad||0);
  return {cx,cy,cz,radius};
}
const CAM_MAX=1450;
// The rig lags a few frames behind the action. Instant camera snaps are the
// main reason a 3D brawler feels jerky, so eye and view direction are eased.
// One smoothing state per viewport. Sharing a single state made both halves
// of split-screen chase the last solved camera, so each pane duplicated the
// other player's shot instead of following its own fighter.
let camEyeS=[], camDirS=[];
function resetCameraSmooth(){ camEyeS=[]; camDirS=[]; }
function smoothedCam(vp,list,opts,key){
  const cam=solveCamera(vp,list,opts);
  const k=key|0;
  if(!camEyeS[k]){
    camEyeS[k]={x:cam.eye.x,y:cam.eye.y,z:cam.eye.z};
    camDirS[k]={x:cam.fx,y:cam.fy,z:cam.fz};
  }else{
    const e=camEyeS[k], d0=camDirS[k];
    const a=opts.close?0.26:0.20;
    e.x+=(cam.eye.x-e.x)*a; e.y+=(cam.eye.y-e.y)*a; e.z+=(cam.eye.z-e.z)*a;
    d0.x+=(cam.fx-d0.x)*a; d0.y+=(cam.fy-d0.y)*a; d0.z+=(cam.fz-d0.z)*a;
    const dl=Math.hypot(d0.x,d0.y,d0.z)||1;
    d0.x/=dl;d0.y/=dl;d0.z/=dl;
  }
  const s=camEyeS[k], sd=camDirS[k];
  const eye={x:s.x,y:s.y,z:s.z};
  const target={x:s.x+sd.x*900,y:s.y+sd.y*900,z:s.z+sd.z*900};
  return makeCam(eye,target,cam.fov||0.86);
}
function solveCamera(vp,list,opts){
  opts=opts||{};
  if(cinemaOn()){
    // One slow, wide push around the collision point: all three casters and
    // the core stay in frame, equal weight, no favourite.
    const core=cinemaCore();
    if(core){
      const t=Math.max(0,clash.cinema.t-threeWay.manga), g=core.group;
      let span=0;
      for(let i=0;i<g.length;i++)for(let j=i+1;j<g.length;j++)
        span=Math.max(span,Math.hypot(g[i].x-g[j].x,g[i].z-g[j].z));
      const ramp=clamp(t/1.35,0,1);
      const yaw=0.8+t*0.5;
      const dist=lerp(520,clamp(760+span*0.52,880,1580),ramp);
      const eye={x:core.x+Math.sin(yaw)*dist,
        y:lerp(110,360,ramp)+Math.sin(t*1.35)*46,
        z:core.z+Math.cos(yaw)*dist};
      return makeCam(eye,{x:core.x,y:110,z:core.z},0.96);
    }
  }
  if(clash&&clash.ids.length){
    // slow orbit around the collision point: both barriers stay framed while
    // the seam visibly shoves back and forth with the damage war.
    const group=clash.ids.map(id=>players[id]).filter(Boolean);
    const a=group[0]||players[0], b=group[1]||a;
    const t=clamp(1-clash.time/clash.total,0,1);
    let mx=0,mz=0; for(const g of group){mx+=g.x;mz+=g.z}
    mx/=Math.max(1,group.length); mz/=Math.max(1,group.length);
    const mid={x:mx,z:mz};
    let span=0;
    for(let i=0;i<group.length;i++)for(let j=i+1;j<group.length;j++)
      span=Math.max(span,Math.hypot(group[i].x-group[j].x,group[i].z-group[j].z));
    const dist=clamp(640+span*0.92,720,1900);
    const yaw=0.55+Math.sin(t*Math.PI*1.3)*0.46;
    const pitch=0.26+Math.sin(t*Math.PI)*0.09;
    const eye={x:mid.x+Math.sin(yaw)*Math.cos(pitch)*dist,
      y:150+Math.sin(pitch)*dist+Math.sin(t*Math.PI)*120,
      z:mid.z+Math.cos(yaw)*Math.cos(pitch)*dist};
    return makeCam(eye,{x:mid.x,y:118,z:mid.z},0.92);
  }
  if(domain&&domain.intro>0){
    const o=domain.owner;
    const t=1-clamp(domain.intro/domain.total,0,1);
    const a=t*2.6+o.i*1.7;
    const d=lerp(760,340,t);
    const eye={x:o.x+Math.sin(a)*d, y:o.y+lerp(400,150,t), z:o.z+Math.cos(a)*d};
    const target={x:o.x,y:o.y+120+lerp(80,0,t),z:o.z};
    return makeCam(eye,target,0.95);
  }
  const f=frameGroup(list,opts.pad||0);
  const aspect=Math.max(0.2,vp.w/vp.h);
  const fovY=0.86;
  const tanY=Math.tan(fovY/2), tanX=tanY*aspect;
  const need=Math.max(f.radius/tanY,f.radius/tanX);
  let dist=opts.close?clamp(need*0.92+110,400,900):(need*0.84+150);
  dist=clamp(dist,430,CAM_MAX);
  const yaw=(opts.yaw!==undefined?opts.yaw:0.62);
  const pitch=(opts.pitch!==undefined?opts.pitch:0.32)+clamp((dist-900)/1500,0,0.22)+camKick*0.16;
  dist+=camKick*170;
  const eye={
    x:f.cx+Math.sin(yaw)*Math.cos(pitch)*dist,
    y:f.cy+Math.sin(pitch)*dist,
    z:f.cz+Math.cos(yaw)*Math.cos(pitch)*dist
  };
  return makeCam(eye,{x:f.cx,y:f.cy,z:f.cz},fovY);
}

function rr(x,y,w,h,r){
  ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(x,y,w,h,r); else ctx.rect(x,y,w,h);
}

    ctx.fillRect(0,0,W,H);ctx.restore();
  }

function drawCardWheel(p,vp){
  if(p.kind!==0||p.ko) return;
  const r=vp?Math.min(34,Math.max(24,vp.w/7)):38;
  const cx=vp?vp.x+26+r:88, cy=vp?vp.y+vp.h-26-r:H-162;
  ctx.save();

  ctx.beginPath();ctx.arc(cx,cy,r+12,0,TAU);ctx.fill();
  ctx.strokeStyle='#b9975c99';ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(cx,cy,r+12,0,TAU);ctx.stroke();
  const n=JIN_DECK.length;
  for(let i=0;i<n;i++){
    const a=-Math.PI/2+i*(TAU/n);
    const x=cx+Math.cos(a)*(r+10), y=cy+Math.sin(a)*(r+10);
    const on=i===(p.cardIdx||0);
    const spent=p.cardCd&&p.cardCd[i]>0;
    const c=JIN_DECK[i];
    ctx.save();ctx.translate(x,y);ctx.rotate(a+Math.PI/2);
    ctx.globalAlpha=spent?0.32:1;
    ctx.fillStyle=on?'#ffedc4':'#1b2740';
    ctx.fillRect(-8,-11,16,22);
    ctx.strokeStyle=on?'#ffe6a8':(c.type==='joker'?'#c9a2ff':'#7b8aa6');ctx.lineWidth=on?2:1;
    ctx.strokeRect(-8,-11,16,22);
    ctx.fillStyle=on?'#3a2b16':'#dbe6f5';
    ctx.font='900 9px Inter,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(c.s,0,-4);
    ctx.font='900 7px Inter,sans-serif';
    ctx.fillText(c.r,0,5);
    ctx.restore();
  }
  const cur=JIN_DECK[p.cardIdx||0];
  if(cur){
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillStyle='#ffe6a8';ctx.font='900 10px Inter,system-ui,sans-serif';
    ctx.fillText(cur.s+cur.r,cx,cy+(p.jokers?'-3':2));

      ctx.fillText('★'+p.jokers,cx,cy+9);
    }
  }
  ctx.restore();
}

function drawWager(){

    const st=stakes[i], x=x0+i*(cw+9);
    const on=i===w.stakeIdx&&w.phase==='choose';
    ctx.fillStyle=on?'#2c1d10':'#101a2c';
    ctx.strokeStyle=on?'#ffd79a':'#3a4a64';ctx.lineWidth=on?2:1;
    rr(x,y0,cw,62,7);ctx.fill();ctx.stroke();
    ctx.fillStyle=on?'#ffe3ac':'#9fb6cc';ctx.font='900 9px Inter,system-ui,sans-serif';
    ctx.fillText(st?st.name:'',x+cw/2,y0+26);
    ctx.fillStyle='#7f97b1';ctx.font='800 8px Inter,system-ui,sans-serif';
    ctx.fillText(st?st.desc:'',x+cw/2,y0+42);
    if(w.phase==='spin'&&i===w.stakeIdx){ctx.fillStyle='#ffd79a';ctx.font='900 9px Inter,system-ui,sans-serif';ctx.fillText('SPINNING…',x+cw/2,y0+56)}
  }
  ctx.fillStyle='#c9dcef';ctx.font='800 10px Inter,system-ui,sans-serif';
  const msg=w.phase==='choose'?'◀ ▶ CHOOSE STAKE · ATTACK / DOMAIN CONFIRM':
    w.phase==='spin'?'THE WHEEL IS TURNING…':
    (w.win?'HOUSE WINS · CHALLENGERS PAY':'CHALLENGERS WIN · HOUSE PAYS');
  ctx.fillText(msg,W/2,y0+88);
  if(w.results&&w.results.length){
    ctx.fillStyle='#8fa8bf';ctx.font='800 9px Inter,system-ui,sans-serif';
    ctx.fillText(w.results.map((r,ri)=>'#'+(ri+1)+' '+(r.win?'HOUSE':'CHALLENGERS')).join('   '),W/2,y0+104);
  }
  ctx.restore();
}

  if(t.dataset.go==='fight'){ startMatch(); return }
